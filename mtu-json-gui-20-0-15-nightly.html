            setTimeout(() => area.classList.remove('ring-2', 'ring-blue-500'), 1000);
        }

        // 修正后的 applyOriginalTextReplacement (约 170 行)
        function applyOriginalTextReplacement() {
            const hasBatch = matchedFiles.length > 0;
            let modifiedCount = 0;

            const processRegions = (targetRegions) => {
                targetRegions.forEach(r => {
                    if (r.texts && Array.isArray(r.texts)) {
                        r.texts = r.texts.map(text => {
                            let newText = text;
                            // 1. 执行原有的 replacements 规则
                            replacements.forEach(([find, replace]) => {
                                while (newText.includes(find)) {
                                    newText = newText.replace(find, replace);
                                }
                            });

                            // 2. [新增] 执行半角转全角逻辑
                            const convertedText = convertHalfToFullKatakana(newText);
                            
                            if (convertedText !== text) modifiedCount++;
                            return convertedText;
                        });
                    }
                });
            };

            if (hasBatch) {
                matchedFiles.forEach(file => processRegions(file.regions));
                // 【关键】如果是批量模式，必须重新加载当前页来同步内存
                loadFile(currentFileIndex); 
            } else {
                processRegions(regions);
                // 【关键】如果是单 JSON，手动同步编辑框并重绘
                if (activeRegionIndex !== -1) {
                    document.getElementById('origEditArea').value = regions[activeRegionIndex].texts.join('\n');
                }
                draw(); 
            }
            return modifiedCount;
        }

        */
        /**
         * 强化版清洗函数：确保无文字的空框被彻底抹除
         */
        function cleanTranslationText(text) {
            if (!text) return "";
            
            // 只检查去掉换行和空格后，译文是否还有实质内容
            const hasActualContent = text.replace(/【BR】/g, '').trim().length > 0;
            
            if (!hasActualContent) {
                return ""; // 译文确实没字了，返回空
            }

            // 有字的情况下，修剪首尾，合并中间多余换行
            return text
                .replace(/^(【BR】)+|(【BR】)+$/g, '') 
                .replace(/(【BR】){2,}/g, '【BR】');   
        }

        // --- Rich Text Parser ---
        function parseRichText(text) {
            if (!text) return [{ text: "", style: {} }];
            const parts = text.split(/(\[\/?[a-z]+(?:=[^\]]*)?\])/i);
            const result = [];
            // 初始化 styleStack
            const styleStack = [{ 
                bold: false, italic: false, tcy: false, dot: false, 
                scale: 1.0, font: null, ruby: null, rotation: 0,
                kerning: 0, offX: 0, offY: 0, vShear: 0, preKerning: 0, lineKerning: null, nextKerning: null,// [新增] 初始前间距为 0
                mirror: false,  // 水平翻转
                mirrorV: false  // 新增：竖向翻转
            }];

            parts.forEach(part => {
                if (!part) return;

                const tagMatch = part.match(/^\[(\/?)([a-z]+)(?:=([^\]]*))?\]$/i);
                if (tagMatch) {
                    const isClose = tagMatch[1] === '/';
                    const tagName = tagMatch[2].toLowerCase();
                    const param = tagMatch[3];

                    if (!isClose) {
                        const currentStyle = {...styleStack[styleStack.length - 1]};
                        if (tagName === 'b') currentStyle.bold = true;
                        else if (tagName === 'i') { if (param) { const angle = parseFloat(param); currentStyle.italic = isNaN(angle) ? true : angle; } else currentStyle.italic = true; }
                        // 在 tagName === 't' 逻辑附近添加
                        else if (tagName === 't') currentStyle.tcy = true;
                        else if (tagName === 'nt') currentStyle.noTcy = true; // [新增] 禁止纵中横标志
                        else if (tagName === 'd') currentStyle.dot = true;
                        // --- 替换约 751 行 ---
                        else if (tagName === 's' && param) {
                            const pStr = param.toString().toLowerCase();
                            if (pStr.endsWith('px')) {
                                // 识别到 px，存入 absFontSize (绝对字号)
                                currentStyle.absFontSize = parseFloat(pStr);
                                currentStyle.scale = 1.0; // 倍率归位
                            } else {
                                // 否则视为普通倍率
                                currentStyle.scale = parseFloat(pStr) || 1.0;
                                delete currentStyle.absFontSize;
                            }
                        }
                        else if (tagName === 'f' && param) currentStyle.font = param;
                        else if (tagName === 'r' && param) currentStyle.ruby = param;
                        else if (tagName === 'rot' && param) currentStyle.rotation = parseFloat(param) || 0;
                        else if (tagName === 'k' && param) currentStyle.kerning = parseFloat(param) || 0;
                        // 2. 在 tagName 判断逻辑中（约 770 行附近）添加解析
                        else if (tagName === 'prek' && param) {
                            currentStyle.preKerning = parseFloat(param) || 0;
                        }
                        else if (tagName === 'x' && param) currentStyle.offX = parseFloat(param) || 0;
                        else if (tagName === 'y' && param) currentStyle.offY = parseFloat(param) || 0;
                        // [新增] 垂直切变解析
                        else if (tagName === 'v' && param) currentStyle.vShear = parseFloat(param) || 0;
                        else if (tagName === 'm') currentStyle.mirror = true;
                        else if (tagName === 'mv') currentStyle.mirrorV = true; // 处理 [mv] 标签
                        else if (tagName === 'c' && param) {
                            currentStyle.color = param; // 存储颜色值
                        } 
                        // 在 tagName 判断逻辑循环中（约 770 行附近）添加
                        else if (tagName === 'lk' && param) currentStyle.lineKerning = parseFloat(param);
                        // 2. 在 tagName 判断逻辑循环中添加解析
                        else if (tagName === 'nk' && param) currentStyle.nextKerning = parseFloat(param);

                        // [核心新增]：解析 局部描边(st)、发光(g)、外描边(os)
                        else if (tagName === 'st' && param) { // 用 st 代替 s 避开原字号缩放标签冲突
                            const params = param.split(',');
                            currentStyle.strokeColor = params[0] || '#000000';
                            currentStyle.strokeWidth = parseFloat(params[1]) || 2;
                        }
                        else if (tagName === 'g' && param) {
                            const params = param.split(',');
                            currentStyle.glowColor = params[0] || '#ff0000';
                            currentStyle.glowBlur = parseFloat(params[1]) || 6;
                        }
                        else if (tagName === 'os' && param) {
                            const params = param.split(',');
                            currentStyle.outerStrokeColor = params[0] || '#000000';
                            currentStyle.outerStrokeWidth = parseFloat(params[1]) || 3;
                        }
                        styleStack.push(currentStyle);
                    } else { if (styleStack.length > 1) styleStack.pop(); }
                } else {
                    const currentStyle = styleStack[styleStack.length - 1];
                    result.push({ text: part, style: {...currentStyle} });
                }
            });
            return result;
        }

            return [
                { ...transform(-w/2, -h/2), type: 'scale', index: 0, cursor: 'nwse-resize' }, 
                { ...transform(w/2, -h/2),  type: 'scale', index: 1, cursor: 'nesw-resize' },
                { ...transform(w/2, h/2),   type: 'scale', index: 2, cursor: 'nwse-resize' },
                { ...transform(-w/2, h/2),  type: 'scale', index: 3, cursor: 'nesw-resize' },
                { ...transform(0, -h/2),    type: 'scale', index: 4, cursor: 'ns-resize' },
                { ...transform(w/2, 0),     type: 'scale', index: 5, cursor: 'ew-resize' },
                { ...transform(0, h/2),     type: 'scale', index: 6, cursor: 'ns-resize' },
                { ...transform(-w/2, 0),    type: 'scale', index: 7, cursor: 'ew-resize' },
                { ...transform(0, -h/2 - ROTATE_HANDLE_OFFSET), type: 'rotate', cursor: 'grab' }
            ];
        }
        /**
         * 为单个小框生成手柄（包含边中点和旋转点）
         */
        function getLineHandles(line) {
            const handles = [];
            // 1. 边中点手柄保持不变
            for (let i = 0; i < 4; i++) {
                const p1 = line[i], p2 = line[(i + 1) % 4];
                handles.push({ 
                    x: (p1[0] + p2[0]) / 2, 
                    y: (p1[1] + p2[1]) / 2, 
                    type: 'move-edge', 
                    index: i,
                    cursor: i % 2 === 0 ? 'ns-resize' : 'ew-resize' 
                });
            }
            // 2. 旋转手柄
            const p0 = line[0], p1 = line[1];
            const topMid = { x: (p0[0] + p1[0]) / 2, y: (p0[1] + p1[1]) / 2 };
            const edgeVec = { x: p1[0] - p0[0], y: p1[1] - p0[1] };
            let normalVec = { x: edgeVec.y, y: -edgeVec.x }; // 指向框外

            const len = Math.hypot(normalVec.x, normalVec.y);
            if (len > 0) { 
                const offset = 30 / viewState.scale;
                handles.push({
                    x: topMid.x + (normalVec.x / len) * offset,
                    y: topMid.y + (normalVec.y / len) * offset,
                    anchorX: topMid.x, // 【新增】连接线起点 X
                    anchorY: topMid.y, // 【新增】连接线起点 Y
                    type: 'rotate-line',
                    cursor: 'grab'
                });
            }
            return handles;
        }

        function onMouseDown(e) {
            const pos = getMousePos(e); 

            // --- 1. 空格键优先级最高：强制进入平移模式 ---
            if (e.button === 0 && isSpacePressed) {
                viewState.isPanning = true; 
                viewState.startX = e.clientX; 
                viewState.startY = e.clientY;
                document.getElementById('canvasContainer').style.cursor = 'grabbing';
                return; // 只要按了空格，不执行选框或涂抹
            }

            // --- [新增] 仿制图章核心按键控制链 ---
            if (stampMode === 'active') {
                if (e.button === 2) { 
                    // 右键单击：留下或重置模仿圈绝对物理坐标
                    e.preventDefault();
                    stampSource = pos;
                    stampOffset = null; // 每次重选右键，都清空原有的位移，等待左键重新锚定
                    console.log("图章模仿点设定/重置成功:", stampSource);
                    draw();
                    renderUI(e);
                    return;
                }
                if (e.button === 0) { 
                    // 左键落下：触发绘制圈，锁定相对位移，启动涂抹
                    if (!stampSource) {
                        alert("请先在画面上【单击右键】以确定仿制采样点(模仿圈)！");
                        return;
                    }
                    isStampDrawing = true;
                    isCanvasDirty = true;
                    // 💥 【核心公式】：在左键按下的瞬间，精确锁定两圈之间基于图片绝对像素的相对矢量位移
                    stampOffset = {
                        x: pos.x - stampSource.x,
                        y: pos.y - stampSource.y
                    };
                    handleStampDraw(pos);
                    return;
                }
            }

            // --- [新增] 混合模式按下逻辑 ---
            if (comboMode && (e.button === 2 || e.button === 1)) {
                isMaskDragging = true;
                if (e.button === 2) {
                    // 右键：仅执行自由涂抹
                    comboActiveTool = 'paint';
                    currentMaskOp = 'brush';
                    handlePaint(pos, 'brush');
                } else if (e.button === 1) {
                    // 中键：仅执行蒙版橡皮
                    comboActiveTool = 'mask';
                    currentMaskOp = 'eraser';
                    handleMaskPaint(pos, 'eraser');
                }
                return; // 关键：拦截后续逻辑，防止“同时画出”两个东西
            }

            if (paintMode !== 'none') {
                if (e.button === 2 || e.button === 1) { // 右键或中键
                    isMaskDragging = true;
                    // 如果当前是画笔模式：右键画(brush)，中键擦(eraser)
                    // 如果当前是橡皮模式：右键擦(eraser)，中键画(brush)
                    if (paintMode === 'brush') {
                        currentMaskOp = (e.button === 2) ? 'brush' : 'eraser';
                    } else {
                        currentMaskOp = (e.button === 2) ? 'eraser' : 'brush';
                    }
                    handlePaint(pos, currentMaskOp);
                    return;
                }
            }

            if (maskEditMode !== 'none') {
                // 右键 (2) 和 中键 (1) 负责蒙版
                if (e.button === 2 || e.button === 1) {
                    isMaskDragging = true;
                    if (maskEditMode === 'brush') {
                        currentMaskOp = (e.button === 2) ? 'brush' : 'eraser';
                    } else {
                        currentMaskOp = (e.button === 2) ? 'eraser' : 'brush';
                    }
                    handleMaskPaint(pos, currentMaskOp);
                    return; // 拦截右键和中键，不让它们触发选框
                }
                // 如果是左键 (0)，逻辑会继续向下跑，不被拦截
            }

            if (isDrawingMode) {
                drawStartPos = pos;
                tempDrawRect = { x: pos.x, y: pos.y, w: 0, h: 0 };
                return; 
            }

            // --- 1. 手柄操作优先级最高 ---
            if (activeRegionIndex !== -1) {
                const region = regions[activeRegionIndex]; // 必须先定义 region

                // =============================================================
                // 【核心新增】：3D 透视框顶点小方块碰撞点击检测
                // =============================================================
                // =============================================================
                // 【升级版】：3D 透视框（4角 + 4边中点）碰撞点击检测
                // =============================================================
                if (region.isPerspective && region.points) {
                    const clickRadius = 12 / viewState.scale; 
                    
                    // A. 优先检测是否点中了 4 个角 (0, 1, 2, 3)
                    for (let i = 0; i < 4; i++) {
                        const dist = Math.hypot(pos.x - region.points[i].x, pos.y - region.points[i].y);
                        if (dist < clickRadius) {
                            draggingPointIdx = i; 
                            transformState.dragging = true;
                            transformState.action = 'move-3d-point';
                            
                            // 【核心防漂移】：暗中记录按下鼠标那一刻的初始坐标和全框定点快照
                            transformState.startMouse = { x: pos.x, y: pos.y };
                            transformState.startPoints = JSON.parse(JSON.stringify(region.points));
                            return; 
                        }
                    }

                    // B. 其次检测是否点中了 4 条边的中心点 (4:顶边, 5:右边, 6:底边, 7:左边)
                    for (let i = 0; i < 4; i++) {
                        const next = (i + 1) % 4;
                        const midX = (region.points[i].x + region.points[next].x) / 2;
                        const midY = (region.points[i].y + region.points[next].y) / 2;
                        
                        const dist = Math.hypot(pos.x - midX, pos.y - midY);
                        if (dist < clickRadius) {
                            draggingPointIdx = i + 4; // 赋予专属边控制代号 4, 5, 6, 7
                            transformState.dragging = true;
                            transformState.action = 'move-3d-point';
                            
                            // 记录拖拽边的初始快照
                            transformState.startMouse = { x: pos.x, y: pos.y };
                            transformState.startPoints = JSON.parse(JSON.stringify(region.points));
                            return;
                        }
                    }
                    // =============================================================
                    // 【核心升级：3D 专属多边形内域判定器】
                    // 算法：经典图形学射线法 (Ray-Casting)，精准判定鼠标是否落在任意变形的四边形内部
                    // =============================================================
                    const isPointIn3DPolygon = (px, py, pts) => {
                        let inside = false;
                        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                            const xi = pts[i].x, yi = pts[i].y;
                            const xj = pts[j].x, yj = pts[j].y;
                            const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
                            if (intersect) inside = !inside;
                        }
                        return inside;
                    };

                    // 如果点击命中了紫框的多边形实体内部
                    if (isPointIn3DPolygon(pos.x, pos.y, region.points)) {
                        transformState.dragging = true;
                        transformState.action = 'move-line'; // 强行激活原本系统的全框平移链条
                        
                        // 封印初始位移快照
                        transformState.startMouse = { x: pos.x, y: pos.y };
                        transformState.startPoints = JSON.parse(JSON.stringify(region.points));
                        transformState.startPointsRegionIndex = activeRegionIndex;
                        
                        return; // 💥 【核心熔断】：这里必须写 return！
                        // 直接强行中止函数，彻底断开与后面橙色矩形碰撞逻辑的联系，绝对不给它滑向“画布平移”的机会！
                    }
                    // =============================================================
                }
                // =============================================================
                // =============================================================

                // 【译文模式手柄检测】
                if (displayMode === 'translation' || displayMode === 'comparison') { // 加上对比模式
                    const handles = getRegionHandles(region);
                    for(let h of handles) {
                        const hitThreshold = 20 / viewState.scale; // 统一 20px 判定区
                        
                        if (Math.hypot(pos.x - h.x, pos.y - h.y) < hitThreshold) {
                            transformState.dragging = true; 
                            transformState.action = h.type; 
                            transformState.handleIndex = h.index; 
                            transformState.startMouse = pos; 
                            transformState.startBox = [...region.box];
                            transformState.startBoxAngle = region.angle || 0; // 统一变量名

                            const [x1, y1, x2, y2] = transformState.startBox;
                            const cx = x1 + (x2 - x1) / 2;
                            const cy = y1 + (y2 - y1) / 2;

                            if (h.type === 'rotate') {
                                transformState.center = { x: cx, y: cy };
                                transformState.startMouseAngle = Math.atan2(pos.y - cy, pos.x - cx);
                                return; 
                            }

                            // 缩放锚点逻辑
                            const rad = transformState.startBoxAngle * Math.PI / 180;
                            const cos = Math.cos(rad), sin = Math.sin(rad);
                            let ox, oy, fx, fy;
                            const w2 = (x2 - x1) / 2, h2 = (y2 - y1) / 2;
                            switch(h.index) {
                                case 0: ox = w2;  oy = h2;  fx = -1; fy = -1; break;
                                case 1: ox = -w2; oy = h2;  fx = 1;  fy = -1; break;
                                case 2: ox = -w2; oy = -h2; fx = 1;  fy = 1;  break;
                                case 3: ox = w2;  oy = -h2; fx = -1; fy = 1;  break;
                                case 4: ox = 0;   oy = h2;  fx = 0;  fy = -1; break;
                                case 5: ox = -w2; oy = 0;   fx = 1;  fy = 0;  break;
                                case 6: ox = 0;   oy = -h2; fx = 0;  fy = 1;  break;
                                case 7: ox = w2;  oy = 0;   fx = -1; fy = 0;  break;
                            }
                            transformState.anchor = { x: ox * cos - oy * sin + cx, y: ox * sin + oy * cos + cy };
                            transformState.factor = { x: fx, y: fy };
                            return; 
                        }
                    }
                }
                // 【原文模式小框手柄检测】
                else if (activeLineIndex !== -1 && region.lines[activeLineIndex]) {
                    const lineIdx = activeLineIndex; 
                    const lineHandles = getLineHandles(region.lines[lineIdx]);
                    for (let h of lineHandles) {
                        const hitThreshold = 15 / viewState.scale; // 统一 15px 判定区
                        if (Math.hypot(pos.x - h.x, pos.y - h.y) < hitThreshold) {
                            transformState.dragging = true; 
                            transformState.action = h.type; 
                            transformState.handleIndex = h.index; 
                            transformState.lineIndex = lineIdx;
                            transformState.startMouse = pos;
                            transformState.originalPoints = JSON.parse(JSON.stringify(region.lines[lineIdx]));
                            
                            // 记录小框中心用于旋转
                            let lx = 0, ly = 0;
                            region.lines[lineIdx].forEach(p => { lx += p[0]; ly += p[1]; });
                            const lcx = lx / 4, lcy = ly / 4;
                            transformState.lineCenter = { x: lcx, y: lcy };
                            transformState.startMouseAngle = Math.atan2(pos.y - lcy, pos.x - lcx);
                            return;
                        }
                    }
                }
            }

            // --- 2. 命中检测 (区域与单行) ---
            const hit = findRegionAt(pos); 

            if (hit) {
                if (e.shiftKey) {
                    // 多选逻辑... (保持你原有的不变)
                    isShiftMultiSelect = true; 
                    const existingIdx = selectedItems.findIndex(item => item.regionIdx === hit.regionIdx && item.lineIdx === hit.lineIdx);
                    if (existingIdx > -1) selectedItems.splice(existingIdx, 1); 
                    else selectedItems.push(hit);
                    activeRegionIndex = hit.regionIdx;
                    activeLineIndex = hit.lineIdx;
                } else {
                    isShiftMultiSelect = false; 
                    selectedItems = [hit]; 
                    activeRegionIndex = hit.regionIdx;
                    activeLineIndex = hit.lineIdx;
                    setActiveRegion(hit.regionIdx);

                    transformState.dragging = true;
                    transformState.startMouse = pos;

                    // --- 精简版：原文模式只动小框，译文模式只动大框 ---
                    if (displayMode === 'original' && hit.lineIdx !== -1) {
                        // 只有“原文模式”且“点中小框”时，才允许移动小框
                        transformState.action = 'move-line'; 
                        transformState.lineIndex = hit.lineIdx;
                        transformState.originalPoints = JSON.parse(JSON.stringify(regions[hit.regionIdx].lines[hit.lineIdx]));
                    } else if (displayMode === 'translation' || displayMode === 'comparison') {
                        // “译文模式”下，点中任何地方都移动大框// --- 修改后：允许对比模式下也触发大框移动 ---
                        transformState.action = 'move-region'; 
                        transformState.startBox = [...regions[hit.regionIdx].box];
                    } else {
                        // 其他情况（如原文模式点在大框空白处），禁止拖拽
                        transformState.dragging = false; 
                    }
                }
                draw(); 
                return;
            }

            // --- 3. 空白处处理 ---
            if (e.button === 0) {
                if (isSpacePressed || !hit) {
                    viewState.isPanning = true; 
                    viewState.startX = e.clientX; 
                    viewState.startY = e.clientY;
                    document.getElementById('canvasContainer').style.cursor = 'grabbing';
                    // 空白处处理 ---
                    if (!hit) {
                        if (e.button === 0) { 
                            // 【左键点击空白】：取消左键相关的选中
                            activeRegionIndex = -1;
                            activeLineIndex = -1;
                            selectedItems = [];
                            isShiftMultiSelect = false;
                            
                            // 允许平移画布
                            viewState.isPanning = true; 
                            viewState.startX = e.clientX; 
                            viewState.startY = e.clientY;
                            document.getElementById('canvasContainer').style.cursor = 'grabbing';
                            
                            // 更新侧边栏状态（不影响右键多选数据）
                            resetSidebar(); 
                        } 
                        else if (e.button === 2) { 
                            // 【右键点击空白】：仅取消右键批量选择列表
                            selectedRegions = []; 
                        }
                        
                        draw(); // 立即刷新画布，让对应的框消失/变色
                        return;
                    }
                    return;
                }
            }
        }

        function onMouseMove(e) {
            const pos = getMousePos(e);
            let cursor = 'default';

            // 1. 如果正在涂抹（右键/中键已按下），保持拦截
            if (isMaskDragging) {
                if (comboMode) {
                    if (comboActiveTool === 'paint') handlePaint(pos, 'brush');
                    else if (comboActiveTool === 'mask') handleMaskPaint(pos, 'eraser');
                } else if (paintMode !== 'none') {
                    handlePaint(pos, currentMaskOp);
                } else if (maskEditMode !== 'none') {
                    handleMaskPaint(pos, currentMaskOp);
                }
                return; 
            }

            // 如果是混合模式，也需要记录鼠标位置并渲染 UI 圆圈
            // --- 【核心修改点】 ---
            // 只有在“既没在拖框”又“没在平移”的情况下，才显示笔刷 UI 并拦截后续逻辑
            if ((maskEditMode !== 'none' || paintMode !== 'none' || comboMode) && !transformState.dragging) {
                mainCanvas.style.cursor = 'crosshair';
                currentMousePos = pos; 
                renderUI(); 
                return; // 只有不拖拽时才拦截，这样下方的 transformState.dragging 逻辑就能跑到了
            }

            if (isDrawingMode && drawStartPos) {
                tempDrawRect.w = pos.x - drawStartPos.x;
                tempDrawRect.h = pos.y - drawStartPos.y;
                draw(); return;
            }

            // 2. 如果正在平移画布（Space+左键），执行平移并拦截
            if (viewState.isPanning) {
                const dx = e.clientX - viewState.startX; 
                const dy = e.clientY - viewState.startY;
                viewState.x += dx; 
                viewState.y += dy;
                viewState.startX = e.clientX; 
                viewState.startY = e.clientY;
                updateCanvasTransform(); 
                return;
            }

            if (transformState.dragging && activeRegionIndex !== -1) {
                const region = regions[activeRegionIndex];

                // =============================================================
                // 【核心新增】：3D 顶点控制点拖拽位移刷新
                // =============================================================
                // =============================================================
                // 【升级版】：3D 顶点 / 4边平行拖拽位移刷新
                // =============================================================
                if (transformState.action === 'move-3d-point' && draggingPointIdx !== -1) {
                    // 算出鼠标相较于按下那一刻，在空间里移动了多少绝对像素点
                    const dx = pos.x - transformState.startMouse.x;
                    const dy = pos.y - transformState.startMouse.y;

                    if (draggingPointIdx < 4) {
                        // 【模式 A】：拖拽单个角，只让当前角移动
                        region.points[draggingPointIdx] = {
                            x: transformState.startPoints[draggingPointIdx].x + dx,
                            y: transformState.startPoints[draggingPointIdx].y + dy
                        };
                    } else {
                        // 【模式 B】：拖拽边中心点，让组成该条边的两个端点同时跟着鼠标等量平行移动！
                        const idxA = draggingPointIdx - 4;      // 端点 A（例如 4-4 = 0）
                        const idxB = (idxA + 1) % 4;             // 端点 B（例如 0+1 = 1）

                        region.points[idxA] = {
                            x: transformState.startPoints[idxA].x + dx,
                            y: transformState.startPoints[idxA].y + dy
                        };
                        region.points[idxB] = {
                            x: transformState.startPoints[idxB].x + dx,
                            y: transformState.startPoints[idxB].y + dy
                        };
                    }
                    
                    draw();   // 强制刷新
                    return;   // 拦截
                }
                // =============================================================
                // 【核心新增】：3D 透视框的【全框整体平移】双轨联动同步器
                // =============================================================
                if (region.isPerspective && transformState.startPoints && transformState.dragging && transformState.startPointsRegionIndex === activeRegionIndex) {
                    // 实时计算鼠标相较于刚按下时的总位移跨度
                    const dx = pos.x - transformState.startMouse.x;
                    const dy = pos.y - transformState.startMouse.y;
                    
                    // 让 4 个空间顶点同时吃上相同的位移量，实现完美平行移动
                    region.points.forEach((p, i) => {
                        p.x = transformState.startPoints[i].x + dx;
                        p.y = transformState.startPoints[i].y + dy;
                    });

                    // ⚠️ 警告：这里绝对【不要】写 return！
                    // 必须放行！让原本系统的代码继续往下跑，去位移它的常规 region.box。
                    // 这样常规框和 3D 点就能并肩前行，几何重心永远不会分裂错位！
                }
                // =============================================================

                // 1. 移动小框
                if (transformState.action === 'move-line') {
                    const line = region.lines[transformState.lineIndex];
                    const orig = transformState.originalPoints;
                    if (line && orig) { // 增加判空防止崩溃
                        const dx = pos.x - transformState.startMouse.x;
                        const dy = pos.y - transformState.startMouse.y;
                        for (let i = 0; i < 4; i++) {
                            line[i][0] = orig[i][0] + dx;
                            line[i][1] = orig[i][1] + dy;
                        }
                    }
                }
                // 2. 移动大框
                // 在 onMouseMove 函数内部找到对应的 action 处理分支
                else if (transformState.action === 'move-region') {
                    const origBox = transformState.startBox;
                    const dx = pos.x - transformState.startMouse.x;
                    const dy = pos.y - transformState.startMouse.y;

                    // 这里正在直接修改内存中当前页的 regions 数据
                    region.box = [
                        origBox[0] + dx, origBox[1] + dy,
                        origBox[2] + dx, origBox[3] + dy
                    ];
                }
                // 3. 增量旋转 (大框)
                // 在 onMouseMove 中搜索 rotate 分支
                else if (transformState.action === 'rotate' && transformState.center) {
                    const curAngle = Math.atan2(pos.y - transformState.center.y, pos.x - transformState.center.x);
                    const deltaAngle = (curAngle - transformState.startMouseAngle) * 180 / Math.PI;
                    
                    // 仅仅修改角度数值，小框坐标数据（region.lines）绝对不参与计算
                    region.angle = transformState.startBoxAngle + deltaAngle; 
                }
                // 4. 锚点缩放 (大框)
                else if (transformState.action === 'scale') {
                    const anchor = transformState.anchor;
                    const factor = transformState.factor;
                    const dx = pos.x - anchor.x, dy = pos.y - anchor.y;
                    const rad = region.angle * Math.PI / 180;
                    const cos = Math.cos(rad), sin = Math.sin(rad);
                    const localDistX = dx * cos + dy * sin;
                    const localDistY = -dx * sin + dy * cos;

                    const [ox1, oy1, ox2, oy2] = transformState.startBox;
                    const oldW = ox2 - ox1, oldH = oy2 - oy1;
                    const newW = Math.max(5, factor.x !== 0 ? localDistX * factor.x : oldW);
                    const newH = Math.max(5, factor.y !== 0 ? localDistY * factor.y : oldH);

                    const offsetX = (newW / 2) * (-factor.x);
                    const offsetY = (newH / 2) * (-factor.y);
                    const newCx = anchor.x - (offsetX * cos - offsetY * sin);
                    const newCy = anchor.y - (offsetX * sin + offsetY * cos);

                    region.box = [newCx - newW/2, newCy - newH/2, newCx + newW/2, newCy + newH/2];
                }
                // 5. 小框边拉拽
                else if (transformState.action === 'move-edge') {
                    const line = region.lines[transformState.lineIndex];
                    const orig = transformState.originalPoints;
                    const p1 = transformState.handleIndex, p2 = (p1 + 1) % 4;
                    const dx = pos.x - transformState.startMouse.x, dy = pos.y - transformState.startMouse.y;
                    const edgeVec = { x: orig[p2][0] - orig[p1][0], y: orig[p2][1] - orig[p1][1] };
                    let norm = { x: -edgeVec.y, y: edgeVec.x };
                    const len = Math.hypot(norm.x, norm.y); if (len > 0) { norm.x /= len; norm.y /= len; }
                    const proj = dx * norm.x + dy * norm.y;
                    line[p1] = [orig[p1][0] + proj * norm.x, orig[p1][1] + proj * norm.y];
                    line[p2] = [orig[p2][0] + proj * norm.x, orig[p2][1] + proj * norm.y];
                }
                // 6. 小框旋转
                else if (transformState.action === 'rotate-line') {
                    const line = region.lines[transformState.lineIndex];
                    const orig = transformState.originalPoints;
                    const center = transformState.lineCenter;
                    if (center && orig) {
                        const curAng = Math.atan2(pos.y - center.y, pos.x - center.x);
                        const dAng = curAng - transformState.startMouseAngle;
                        const cos = Math.cos(dAng), sin = Math.sin(dAng);
                        orig.forEach((p, idx) => {
                            const dx = p[0] - center.x, dy = p[1] - center.y;
                            line[idx] = [dx * cos - dy * sin + center.x, dx * sin + dy * cos + center.y];
                        });
                    }
                }
                draw(); return;
            }

            // 鼠标手势同步逻辑
            if (cursor === 'default' && activeRegionIndex !== -1) {
                const region = regions[activeRegionIndex];
                if (displayMode === 'translation') {
                    const handles = getRegionHandles(region);
                    for (let h of handles) {
                        if (Math.hypot(pos.x - h.x, pos.y - h.y) < 20 / viewState.scale) {
                            cursor = h.cursor || 'pointer'; break;
                        }
                    }
                } else if (region.lines && activeLineIndex !== -1) {
                    const lineHandles = getLineHandles(region.lines[activeLineIndex]);
                    for (let h of lineHandles) {
                        if (Math.hypot(pos.x - h.x, pos.y - h.y) < 15 / viewState.scale) {
                            cursor = h.cursor || 'pointer'; break;
                        }
                    }
                }
            }
            mainCanvas.style.cursor = cursor;
        }
        
        // 蒙版涂抹核心函数
        // 修改 handleMaskPaint 和 handlePaint 内部
        function handleMaskPaint(pos, op) {
            if (op === 'none') return;
            isCanvasDirty = true; // [核心新增]
            
            maskCtx.save();
            maskCtx.globalCompositeOperation = (op === 'brush') ? 'source-over' : 'destination-out';
            
            maskCtx.beginPath();
            // --- 【修改点】在这里除以缩放比例 ---
            // 只有这样，画在原始图像上的半径才能在视觉上对齐屏幕上的 UI 圆圈
            const radius = maskBrushSize / viewState.scale;
            
            maskCtx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            maskCtx.fillStyle = 'white'; 
            maskCtx.fill();
            maskCtx.restore();
            
            draw(); 
        }
        
        // 1. 点击自定义方块 -> 触发原生选择器
        btnFillColor.addEventListener('click', () => {
            // 【修改】优先判断是否有右键多选，若有则设为 -2，否则跟随 activeRegionIndex
            colorPickTargetIndex = (selectedRegions.length > 0) ? -2 : activeRegionIndex;

            // 设置初始值
            let currentColor = (colorPickTargetIndex !== -1 && regions[colorPickTargetIndex]) ? 
                colorToHex(regions[colorPickTargetIndex].parsedColor || activeTextColor) : activeTextColor;

        btnStrokeColor.addEventListener('click', () => {

                colorToHex(regions[colorPickTargetIndex].strokeColor || activeStrokeColor) : activeStrokeColor;

        const btnBlurColor = document.getElementById('btnBlurColor');

        // 点击预览方块触发选择器
        btnBlurColor.addEventListener('click', () => {

            let currentColor = (colorPickTargetIndex !== -1 && regions[colorPickTargetIndex]) ? 
                (regions[colorPickTargetIndex].blurColor || "#000000") : "#000000";

        // 处理颜色变化
        nativeBlurPicker.addEventListener('input', (e) => {
            const color = e.target.value;

            // 直接调用批处理函数，它会自动识别 selectedRegions 或 activeRegionIndex
            batchUpdateProp('blurColor', color);
            draw();
        });

        // 2. 绑定通用处理函数
        setupNativePicker(nativeFillPicker, 'fill');
        setupNativePicker(nativeStrokePicker, 'stroke');

        function setupNativePicker(picker, type) {
            picker.addEventListener('input', (e) => {
                const color = e.target.value;
                const prop = type === 'fill' ? 'parsedColor' : 'strokeColor';
                const isFill = (type === 'fill');
                
                // 核心批处理函数已经能处理多选和单选
                batchUpdateProp(prop, color); 
                
                if (isFill) {
                    btnFillColor.style.backgroundColor = color;
                    // 【修改】只要不是全局模式 (即单选或多选)
                    if (colorPickTargetIndex !== -1) {
                        // 如果是白色系，执行自动黑边逻辑
                        if (isNearWhite(color)) {
                            if (colorPickTargetIndex === -2) {
                                // 针对多选列表批量设置
                                selectedRegions.forEach(idx => {
                                    if (regions[idx]) {
                                        regions[idx].strokeColor = "#000000";
                                        regions[idx].strokeEnable = true;
                                    }
                                });
                            } else if (regions[colorPickTargetIndex]) {
                                // 针对单选设置
                                regions[colorPickTargetIndex].strokeColor = "#000000";
                                strokeEnableCb.checked = true;
                            }
                            btnStrokeColor.style.backgroundColor = "#000000";
                        }
                    } else {
                        // 全局模式
                        activeTextColor = color;
                        if (isNearWhite(color)) {
                            activeStrokeColor = "#000000";
                            strokeEnableCb.checked = true;
                            btnStrokeColor.style.backgroundColor = "#000000";
                        }
                    }
                } else {
                    btnStrokeColor.style.backgroundColor = color;
                    if (colorPickTargetIndex === -1) activeStrokeColor = color;
                }
                draw();
            });

            picker.addEventListener('change', (e) => {
                const color = e.target.value;
                // 因为多选时 index 为 -2，不等于 -1，所以这里不会再弹出全局确认框
                if (colorPickTargetIndex === -1) {
                    pendingGlobalValue = color;
                    pendingGlobalType = type; 
                    const typeName = type === 'fill' ? '填充颜色' : '描边颜色';
                    confirmMessage.innerHTML = `您已修改默认${typeName}。<br>是否将此颜色应用到当前页面的<b class="text-yellow-400">所有</b>文本框？`;
                    confirmModal.style.display = 'flex';
                }
                if (colorPickTargetIndex !== -1) draw();
            });
        }

        // [新增] 字重控制监听
        
        fontWeightSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            batchUpdateProp('fontWeight', e.target.value);
        });


        function onMouseUp() {
            // =============================================================
            // 【核心新增】：松开左键时释放 3D 顶点控制锁
            // =============================================================
            draggingPointIdx = -1; 
            // =============================================================

            // 原有的平移/拖拽停止逻辑
            viewState.isPanning = false;

            // --- 新增：停止蒙版涂抹 ---
            if (isMaskDragging) {
                isMaskDragging = false;
                currentMaskOp = 'none';
                comboActiveTool = 'none'; // [新增] 重置混合工具标记
                syncMaskData(); 
                draw();
                return;
            }
            // 【关键修改点】：结束绘制并自动退出模式
            if (isDrawingMode && drawStartPos && tempDrawRect) {
                if (Math.abs(tempDrawRect.w) > 5 && Math.abs(tempDrawRect.h) > 5) {
                    const x1 = Math.min(drawStartPos.x, drawStartPos.x + tempDrawRect.w);
                    const y1 = Math.min(drawStartPos.y, drawStartPos.y + tempDrawRect.h);
                    const x2 = Math.max(drawStartPos.x, drawStartPos.x + tempDrawRect.w);
                    const y2 = Math.max(drawStartPos.y, drawStartPos.y + tempDrawRect.h);

                    // --- 新增：根据长宽比自动计算方向 ---
                    const drawW = x2 - x1;
                    const drawH = y2 - y1;
                    // 如果宽度大于高度，判定为横排 'h'，否则为竖排 'v'
                    const autoDirection = (drawW > drawH) ? 'h' : 'v';

                    const newRegion = {
                        box: [x1, y1, x2, y2],
                        angle: 0,
                        direction: autoDirection, // <--- 这里由原来的 activeDefaultDir 改为自动判定
                        translation: "新区域",
                        texts: ["新行"],
                        font_size: 20,
                        line_spacing: activeLineSpacing,
                        letter_spacing: activeLetterSpacing,
                        parsedColor: activeTextColor,
                        strokeColor: activeStrokeColor,
                        strokeWidthRatio: activeStrokeWidth,
                        lines: [[ [x1,y1], [x2,y1], [x2,y2], [x1,y2] ]]
                    };

                    regions.push(newRegion);
                    setActiveRegion(regions.length - 1);
                    
                    // 如果需要，也可以同步更新一下右侧“属”按钮的文字显示
                    const propBtn = document.getElementById('editPropBtnRight');
                    if (propBtn) propBtn.innerText = (autoDirection === 'v' ? "竖" : "横");
                }
                
                // --- 核心改动：画完立刻关闭开关并恢复 UI ---
                isDrawingMode = false; 
                const btn = document.getElementById('drawModeBtnRight');
                if (btn) {
                    btn.classList.remove('bg-yellow-600', 'text-white');
                }
                // 恢复画布光标为默认（抓手）
                document.getElementById('canvasContainer').style.cursor = 'grab';

                drawStartPos = null;
                tempDrawRect = null;
                draw();
                return;
            }

            // 原有的平移/拖拽停止逻辑
            viewState.isPanning = false;
            transformState.dragging = false;
            transformState.action = null;
            draw();
        }

        // --- [修正版] 坐标转换：解决偏移和延迟问题 ---
        function getCanvasCoordinates(e) {
            const rect = mainCanvas.getBoundingClientRect(); 
            // 直接使用屏幕位置减去画布边界，再除以缩放倍率即可
            return {
                x: (e.clientX - rect.left) / viewState.scale,
                y: (e.clientY - rect.top) / viewState.scale
            };
        }

        function draw() {
            // 在 draw() 里面加入：联动更新 3D 悬浮层的缩放和平移状态
            // 【精准对齐版】联动更新 3D 悬浮层的缩放和平移状态
            function syncPerspectiveLayer() {
                const layer = document.getElementById('perspectiveTextLayer');
                if (!layer) return;
                
                // 将原本的 viewState.offsetX / Y 修正为源码真正的 viewState.x / y
                layer.style.transform = `translate(${viewState.x}px, ${viewState.y}px) scale(${viewState.scale})`;
            }
            syncPerspectiveLayer(); // 每次画布重绘，悬浮层就自动强制对齐一次

            if (isPageLoading) {
                ctx.fillStyle = "#111827"; // 背景色
                ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
                // 可以在屏幕中心画个转圈或者提示文字
                return; 
            }
            if (ctx !== mainCanvasCtx && !isExporting_logic_running) { 
                ctx = mainCanvasCtx; 
            }
            if(!ctx) return;
            if(!currentImage) return;

            // --- 核心新增：锁定实际像素显示，禁用抗锯齿 ---
            ctx.imageSmoothingEnabled = false;
            ctx.mozImageSmoothingEnabled = false;
            ctx.webkitImageSmoothingEnabled = false;
            ctx.msImageSmoothingEnabled = false;

            // 1. 底层：原图
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height); 
            ctx.drawImage(currentImage, 0, 0);

            // 2. 中层：渲染修复图 (被蒙版裁剪后的部分)
            // 2. 中层：渲染修复图 (被蒙版裁剪后的部分)
            // 2. 中层：渲染修复图
            // --- 修改后的 draw() 函数内部关于修复图的部分 ---

            // 修复版代码块
            if ((displayMode === 'translation' || displayMode === 'comparison') && paintCanvas.width > 0) {
                // 增加：只有当修复图确实存在时，才进行透明度相关的绘制
                if (currentRepairImage) {
                    ctx.save();
                    try {
                        ctx.globalAlpha = repairOpacity; 

                        if (ignoreMaskForRepair) {
                            ctx.drawImage(currentRepairImage, 0, 0, mainCanvas.width, mainCanvas.height);
                        } else if (maskCanvas.width > 0) {
                            // 确保离屏画布尺寸一致
                            if (compCanvas.width !== mainCanvas.width || compCanvas.height !== mainCanvas.height) {
                                compCanvas.width = mainCanvas.width;
                                compCanvas.height = mainCanvas.height;
                            }

                            compCtx.clearRect(0, 0, compCanvas.width, compCanvas.height);
                            compCtx.drawImage(currentRepairImage, 0, 0, compCanvas.width, compCanvas.height);
                            
                            compCtx.globalCompositeOperation = 'destination-in';
                            compCtx.drawImage(maskCanvas, 0, 0, compCanvas.width, compCanvas.height);
                            compCtx.globalCompositeOperation = 'source-over';

                            ctx.drawImage(compCanvas, 0, 0);
                        }
                    } catch (e) {
                        console.error("渲染修复层时发生错误:", e);
                    } finally {
                        // 关键：无论绘制是否成功，都强制恢复画布状态，防止透明度污染底图
                        ctx.restore(); 
                    }
                }
            }

            // --- 3. 关键层：半透明红色可视化层 ---
            // 这个就是你问的“在哪里”的那一层，它画在修复图之上，方便你改
            if (showMask && maskCanvas.width > 0) {
                ctx.save();
                ctx.globalAlpha = 0.3; // 不透明度
                
                const maskOverlay = document.createElement('canvas');
                maskOverlay.width = maskCanvas.width; maskOverlay.height = maskCanvas.height;
                const moCtx = maskOverlay.getContext('2d');
                
                moCtx.fillStyle = '#ff0000'; // 纯红
                moCtx.fillRect(0, 0, maskOverlay.width, maskOverlay.height);
                moCtx.globalCompositeOperation = 'destination-in';
                moCtx.drawImage(maskCanvas, 0, 0); // 只在有蒙版的地方涂红
                
                ctx.drawImage(maskOverlay, 0, 0);
                ctx.restore();
            }

            // 4. 绘制涂鸦层 (Paint Layer)
            if (paintCanvas.width > 0) {
                ctx.save();
                ctx.globalAlpha = paintOpacity; 
                ctx.drawImage(paintCanvas, 0, 0);
                ctx.restore();

                // --- [核心新增] 蓝色遮罩可视化层 ---
                if (showPaintMask) {
                    ctx.save();
                    ctx.globalAlpha = 0.3; // 遮罩不透明度，与显蒙保持一致
                    
                    // 创建临时画布用于合成蓝色遮罩
                    const paintOverlay = document.createElement('canvas');
                    paintOverlay.width = paintCanvas.width; 
                    paintOverlay.height = paintCanvas.height;
                    const poCtx = paintOverlay.getContext('2d');
                    
                    poCtx.fillStyle = '#0000ff'; // 纯蓝
                    poCtx.fillRect(0, 0, paintOverlay.width, paintOverlay.height);
                    
                    // 关键：只在有涂鸦像素的地方显示蓝色
                    poCtx.globalCompositeOperation = 'destination-in';
                    poCtx.drawImage(paintCanvas, 0, 0);
                    
                    ctx.drawImage(paintOverlay, 0, 0);
                    ctx.restore();
                }
            }

            // --- 【新增：文字层控制】 ---
            // 只有在开启“字”开关时，才渲染复杂的译文或原文文本
            // --- 找到这一行并修改 ---
            if (showText) {
                // 修改：让对比模式也执行译文渲染逻辑
                if(displayMode === 'translation' || displayMode === 'comparison') {
                    // 严格按汉堡包顺序绘制：底层发光 -> 中层描边 -> 顶层填充
                    regions.forEach(r => drawSmartTranslation(r, 'glow'));
                    regions.forEach(r => drawSmartTranslation(r, 'outer-stroke')); // 关键：新增这一行
                    regions.forEach(r => drawSmartTranslation(r, 'stroke'));
                    regions.forEach(r => drawSmartTranslation(r, 'fill'));
                } else {
                    // 原文模式下的 OCR 文本预览
                    regions.forEach(r => drawOriginal(r));
                }
            }

            // 2. UI 装饰与交互层 (框线、手柄)
            regions.forEach((r, i) => {
                const active = (i === activeRegionIndex);
                const isMultiSelected = selectedRegions.includes(i); // 是否在多选列表中

                if (r.box && showBlocks && !r.isPerspective) {
                    ctx.save();
                    const [x1, y1, x2, y2] = r.box;
                    const w = x2 - x1, h = y2 - y1;
                    const cx = x1 + w/2, cy = y1 + h/2;
                    ctx.translate(cx, cy);
                    ctx.rotate(r.angle * Math.PI / 180);

                    // 样式优先级：单选激活(红) > 多选选中(橙) > 普通(绿)
                    // 1. 先判断并绘制“多选”的填充背景（这样它会出现在最底层）
                    if (isMultiSelected) {
                        ctx.fillStyle = 'rgba(245, 158, 11, 0.15)'; // 稍微加深一点点
                        ctx.fillRect(-w/2, -h/2, w, h);
                    }

                    // 2. 再决定边框的颜色
                    if (active) {
                        ctx.strokeStyle = '#f59e0b'; // 激活项始终是红色边框
                        ctx.lineWidth = 3;
                    } else if (isMultiSelected) {
                        ctx.strokeStyle = '#f59e0b'; // 多选项是非激活时的橙色边框
                        ctx.lineWidth = 3;
                    } else {
                        ctx.strokeStyle = '#22c55e'; // 普通项绿色
                        ctx.lineWidth = 1.5;
                    }

                    // 3. 最后统一画出边框
                    ctx.strokeRect(-w/2, -h/2, w, h);
                    ctx.restore();
                }

                // 1. 【核心恢复】计算当前活动区域的最值字号索引
                let minSizeIdx = -1, maxSizeIdx = -1;
                if (active && r.lines && r.lines.length > 1) {
                    let minS = Infinity, maxS = -Infinity;
                    const textSource = r.texts || (r.translation ? r.translation.split('【BR】') : []);
                    const isV = r.direction === 'v';
                    
                    r.lines.forEach((line, lIdx) => {
                        const txt = textSource[lIdx] || "";
                        // 使用你的自动字号计算函数
                        const size = getSingleLineAutoFontSize(txt, line, isV);
                        if (size < minS) { minS = size; minSizeIdx = lIdx; }
                        if (size > maxS) { maxS = size; maxSizeIdx = lIdx; }
                    });
                }

                // 修改后：去掉 || active，使其严格受全局开关控制
                if (r.lines && showLines) {
                    r.lines.forEach((line, lIdx) => {
                        ctx.save();
                        
                        // --- [A. 行框渲染] 部分 ---

                        // 1. 基础样式初始化
                        let color = '#3b82f6'; // 默认：不透明蓝色
                        let lineWidth = 1.5;

                        // 2. 状态判定
                        // 检查当前行是否在选中队列中
                        const selectOrder = selectedItems.findIndex(item => item.regionIdx === i && item.lineIdx === lIdx);
                        const isInSelection = selectOrder > -1;

                        /**
                         * 【核心修改】判定逻辑：
                         * 只有当 Shift 模式开启，且当前行确实被选中时，才判定为 MultiSelected (橙色)
                         * 这样可以避免在非 Shift 模式下，单纯的数组残留导致错误的颜色显示
                         */
                        const isMultiSelected = isShiftMultiSelect && isInSelection;

                        // 单选激活判定（通常用于编辑状态）
                        const isSingleActive = (active && lIdx === activeLineIndex);

                        // 3. 样式优先级应用 (多选橙 > 单选红 > 最值高亮)
                        if (isMultiSelected) {
                            color = '#f59e0b'; // 橙色：Shift 连选模式
                            lineWidth = 2.5;
                        } else if (isSingleActive) {
                            color = '#ef4444'; // 红色：当前编辑行
                            lineWidth = 2.5;
                        } else if (active) {
                            // 区域内辅助高亮
                            if (lIdx === maxSizeIdx) { 
                                color = '#c084fc'; // 紫色：最大行
                                lineWidth = 2.5; 
                            } else if (lIdx === minSizeIdx) { 
                                color = '#f472b6'; // 粉色：最小行
                                lineWidth = 2.5; 
                            }
                        }

                        // 绘制边框
                        ctx.strokeStyle = color;
                        ctx.lineWidth = lineWidth;
                        ctx.beginPath();
                        line.forEach((p, pi) => pi === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
                        ctx.closePath();
                        ctx.stroke();

                        // --- 4. 绘制红色序号（仅多选模式） ---
                        if (isMultiSelected) {
                            // A. 计算缩放自适应的字体大小
                            const fs = Math.max(12, 18 / viewState.scale);
                            ctx.font = `bold ${fs}px sans-serif`;
                            
                            const isV = r.direction === 'v'; // 是否垂直排版

            // 【核心新增：3D 透视拦截器阻断点】
            // =========================================================================
            // =========================================================================
            // 【完美修正版：3D 透视双模拦截烘焙器】
            // =========================================================================
            if (region.isPerspective && region.points) {
                // 模式一：如果当前画笔指向的是【主屏幕画布】，走极速网页 DOM 预览流

                    if (onlyPass === 'fill') {
                        targetCtx.save();
                        const isActive = (regions[activeRegionIndex] === region);
                        targetCtx.strokeStyle = isActive ? '#a855f7' : '#6b21a8';
                        targetCtx.lineWidth = 2 / viewState.scale;
                        targetCtx.beginPath();
                        region.points.forEach((p, pi) => pi === 0 ? targetCtx.moveTo(p.x, p.y) : targetCtx.lineTo(p.x, p.y));
                        targetCtx.closePath();
                        targetCtx.stroke();
                        // 2. 如果是正在编辑的激活框，渲染高级控制手柄（4角方块 + 4边圆圈）
                        if (isActive) {
                            const handleSize = 8 / viewState.scale; // 顶点方块大小
                            const radius = 4 / viewState.scale;     // 边的中心圆圈半径
                            
                            // A. 先画 4 个顶点的紫色方块
                            targetCtx.fillStyle = '#a855f7';
                            region.points.forEach(p => {
                                targetCtx.fillRect(p.x - handleSize / 2, p.y - handleSize / 2, handleSize, handleSize);
                            });

                            // B. 【新增】计算并渲染 4 条边的中心控制圆点
                            targetCtx.fillStyle = '#c084fc'; // 浅紫色，用于区分边和角
                            targetCtx.strokeStyle = '#ffffff';
                            targetCtx.lineWidth = 1 / viewState.scale;

                            for (let i = 0; i < 4; i++) {
                                const next = (i + 1) % 4;
                                // 计算两条边之间的中点绝对像素坐标
                                const midX = (region.points[i].x + region.points[next].x) / 2;
                                const midY = (region.points[i].y + region.points[next].y) / 2;

                                targetCtx.arc(midX, midY, radius, 0, Math.PI * 2);
                                targetCtx.fill();

                    // 只有当有明确的局部 pass 且不是 'fill' 时才拦截；如果 total 渲染（onlyPass 为空）或者是 'fill' 阶段，则放行烘焙
                    if (onlyPass && onlyPass !== 'fill') return;
                    
                    // 🚀 召唤后台烘焙引擎，把透视字烙印进导出的 PNG 图片中

            }
            // =========================================================================

            // [新增] 获取当前框的字重
            const effectiveWeight = region.fontWeight || activeFontWeight;
            
            // === 参数配置区 ===
            const RUBY_SIZE_RATIO = 0.4;    // Ruby 大小
            const RUBY_OFFSET_RATIO = 0.02; // Ruby 离正文的距离 (紧贴)

            // [新增] 着重号配置
            const DOT_RADIUS_RATIO = 0.1;   // 着重号半径 (即直径是 0.2 倍字号)
            const DOT_OFFSET_RATIO = 0.05;  // 着重号离正文的距离 (稍微比 Ruby 远一点点，0.05 比较透气，也可设为 0.02)

            if (!region.translation) return;
            const rawText = region.translation || "";
            // 【核心修改】：在 split 之前，把视觉用的 ↵ 符号全部抹掉，确保不渲染到屏幕
            let lines = rawText.replace(/【BR】/g, '\n').replace(/↵/g, '').split('\n');
            
            let boxWidth, boxHeight, angleRad;
            if (region.box) {
                const [x1,y1,x2,y2] = region.box;

                angleRad = region.angle * Math.PI / 180;
            } else { return; }

            const localMinY = -boxHeight / 2; const localMaxY = boxHeight / 2;
            // 在 drawSmartTranslation 函数开头获取参数的部分

            // 【修改】将 letter_spacing 视为倍率，计算出实际像素间距
            // 优先使用单框属性，如果没有则使用全局变量

            const lineSpacingMult = (region.line_spacing !== undefined) ? region.line_spacing : activeLineSpacing;
            // ... 后续逻辑中使用 letterSpacingPx 的地方无需变动，因为它已经是计算后的像素值了
            const effectiveAlign = region.textAlign || activeTextAlign;
            const effectiveFont = region.fontFamily || activeFontFamily;
            
            const finalFillColor = region.parsedColor || activeTextColor;
            const finalStrokeColor = region.strokeColor || activeStrokeColor;
            const finalStrokeWidthRatio = (region.strokeWidthRatio !== undefined) ? region.strokeWidthRatio : activeStrokeWidth;
            // 【关键修改】：优先读取单框的 strokeEnable 属性，如果没有才用全局的 activeStrokeEnabled
            // const isRegionStrokeEnabled = (region.strokeEnable !== undefined) ? region.strokeEnable : activeStrokeEnabled;
            const useConcentricFill = region.fill_holes === true; 

            targetCtx.save();
            const [x1,y1,x2,y2] = region.box; targetCtx.translate(x1 + boxWidth/2, y1 + boxHeight/2); targetCtx.rotate(angleRad);
            
            const isVertical = region.direction === 'v';

            // === MTU 自动换行逻辑 (最终像素感知版：竖排横排统一逻辑) ===
            const originalIsMultiLine = region.lines && region.lines.length >= 2;
            const noExplicitBreak = !rawText.includes('【BR】');
            const fullText = lines.join(''); 
            
            // 基础字号 (用于计算容错)
            const baseH = baseFontSize + letterSpacingPx;

            // 通用原子正则
            // --- 修改前 ---
            // const atomRegex = /(\[t\][\s\S]*?\[\/t\])|(\[[^\]]+\])|([\d\uFF10-\uFF19]{2,4})|([\s\S])/gi;

            // --- 修改后：增加对 !? 组合的识别 ---
            const atomRegex = /(\[t\][\s\S]*?\[\/t\])|(\[[^\]]+\])|([\d\uFF10-\uFF19]{2,4})|([!?！？\uff1f]{2,})|([\s\S])/gi;
            const atoms = fullText.match(atomRegex) || [];

            // 临时设置字体以便准确测量
            targetCtx.font = `${activeFontWeight} ${baseFontSize}px ${effectiveFont.replace(/"/g,'')}`;


            // 新增辅助工具
            const getFinalFSize = (tokStyle) => {
                if (tokStyle.absFontSize !== undefined) return tokStyle.absFontSize;
                return baseFontSize * (tokStyle.scale || 1.0);
            };

            if (isVertical) {
                // === 竖排自动换行 (Vertical Auto-Wrap) [像素级精确版] ===
                const longestLineLen = Math.max(...lines.map(l => l.replace(/\[.*?\]/g, '').length));
                
                // 估算总高度 (仅用于触发条件，防止短文本误判)

                const exceedsBoundsV = totalEstimatedH > boxHeight * 1.05;

                // === 竖排自动换行 (修复富文本继承版) ===
                if (originalIsMultiLine && noExplicitBreak && exceedsBoundsV) {
                    const newLines = [];
                    let currentLineStr = "";
                    let currentPixelH = 0;
                    let activeTagsStack = []; 
                    const maxPixelsHeight = boxHeight + (baseFontSize * 0.05);

                    atoms.forEach(atom => {
                        let atomH = 0;

                        // 【修改点：增加合法标签校验】
                        const tagMatch = atom.match(/^\[([a-z]+)(?:=[^\]]*)?\]$/i);

                        if (tagMatch && !atom.startsWith('[/')) {
                            activeTagsStack.push(atom);
                        } else if (atom.startsWith('[/')) {
                            activeTagsStack.pop();
                        }

                        if (atom.startsWith('[') && !atom.startsWith('[/')) {
                            activeTagsStack.push(atom);
                        } else if (atom.startsWith('[/')) {
                            activeTagsStack.pop();
                        }

                        // --- 替换 atoms.forEach 循环内部的 atomH 计算部分 ---

                        if (atom.startsWith('[')) {
                            // 手动 [t] 标签，高度为一个字

                            const isPunct = /^[!?！？\uff1f]{2,}$/.test(atom);

                            if (isDigits || isPunct) {

                const exceedsBoundsH = totalVisualWidth > boxWidth * 1.05;

                // === 横排自动换行 (修复富文本继承版) ===
                if (originalIsMultiLine && noExplicitBreak && exceedsBoundsH) {
                    const newLines = [];
                    let currentLineStr = "";
                    let currentPixelW = 0;
                    let activeTagsStack = []; // 追踪当前打开的标签

                    let maxPixelsWidth = boxWidth;
                    if (Math.abs(region.angle || 0) > 1) {

                    }

                    atoms.forEach(atom => {
                        let atomW = 0;

                        // 【修改点：增加合法标签校验】

                        }

                        // 追踪标签状态
                        if (atom.startsWith('[') && !atom.startsWith('[/')) {
                            activeTagsStack.push(atom); // 记录开标签
                        } else if (atom.startsWith('[/')) {
                            activeTagsStack.pop(); // 闭标签出栈
                        }

                        if (atom.startsWith('[')) {
                            atomW = 0; 
                        } else {
                            if (CHARS_SYMMETRIC_HALF.includes(atom) || CHARS_HORIZONTAL_COMPRESSION.includes(atom)) {
                                atomW = (baseFontSize * 0.5) + letterSpacingPx;
                            } else {
                                atomW = targetCtx.measureText(atom).width + letterSpacingPx;
                            }
                        }

                        if (currentPixelW + atomW > maxPixelsWidth) {
                            // 【修改点：安全解析标签名】
                            const closingTags = activeTagsStack.map(t => {
                                const m = t.match(/\[([a-z]+)/i);
                                return m ? `[/${m[1]}]` : ""; // 如果匹配不到字母，返回空字符串
                            }).reverse().join('');
                            
                            const openingTags = activeTagsStack.join('');
                            newLines.push(currentLineStr + closingTags);
                            currentLineStr = openingTags + atom;
                            currentPixelW = atomW;
                        } else {
                            currentLineStr += atom;
                            currentPixelW += atomW;
                        }
                    });

                }
            }

            const processedLines = lines.map(lineStr => {
                const tokens = parseRichText(lineStr);
                if (isVertical) {
                    const groupedTokens = [];
                    let currentTcyGroup = null;

                    tokens.forEach(tok => {
                        // 1. 如果是用户手动加了 [t] 标签，始终执行 TCY

                            if (!currentTcyGroup) {
                                currentTcyGroup = { isGroup: true, text: "", subTokens: [], style: { tcy: true } };

                            }

                        // 2. 如果开启了自动 TCY 且是纯文本

                            // 修改后的正则表达式：匹配 2-4 位数字，或者 2 个及以上的 ! ? (含全角半角)
                            const regex = /([\d\uFF10-\uFF19]{1,4}|[!?\uff1f]{1,}|[！？\uff1f]{2,})/g; 
                            let match, lastIndex = 0;

                            while ((match = regex.exec(tok.text)) !== null) {
                                const fullMatch = match[0];
                                if (match.index > lastIndex) {

                                }
                                
                                // 判定条件：是数字（2-4位）或者是标点组合（2位及以上）

                        }

            });

            // === [新增] 动态布局计算 (Dynamic Layout Engine) ===
            // 扫描每一行，判断是否需要因为 Ruby 或 着重号 而撑开间距
            // === [修正] 动态布局计算：支持 Ruby 与着重号共存 ===
            // 在 map 循环外部定义一个变量，用来存储“上一行要求的下一行间距”
            // --- 1. 在 map 循环外部定义状态变量 ---
            let pendingNextLineSpacing = null;

            const lineLayouts = processedLines.map((tokens, lineIdx) => {
                let hasRuby = false;
                let hasDot = false;
                let localLineSpacing = null; // 存储本行的 [lk]
                let localNextSpacing = null; // 存储本行的 [nk]

                // --- 2. 遍历 Token 提取所有样式 ---
                const checkToken = (tok) => {
                    if (tok.style.ruby) hasRuby = true;
                    if (tok.style.dot) hasDot = true;
                    
                    // 提取 LK（控制本行与上一行）
                    if (tok.style.lineKerning !== null && tok.style.lineKerning !== undefined) {

                    }
                    // 提取 NK（控制本行与下一行）

                    }
                    
                    if (tok.subTokens) tok.subTokens.forEach(checkToken);
                };
                tokens.forEach(checkToken);

                // --- 3. 核心优先级逻辑 (修复点) ---
                let effectiveMult = lineSpacingMult; // 默认使用全局设置

                // 如果上一行通过 [nk] 指定了这一行的间距

                }

                // 如果本行通过 [lk] 显式指定了与上一行的间距，则 [lk] 拥有最高优先级，覆盖掉 [nk]

            });

            // 计算总宽高 (用于整体居中)

            // 注意：第一行不需要前置 Gap，所以减去 lineLayouts[0].gap

            // === [新增] 2. 将布局转换为具体的坐标 (Coordinate Calculation) ===
            // 我们需要在 renderPass 之前就把每一行的确切位置算好，

            const linePositions = []; 

            if (isVertical) {

                    const centerX = currentEdge - (layout.thickness / 2);

            // --- Render Logic (Two Pass) ---

            function renderPass(mode) {

                const isOuterStroke = mode === 'outer-stroke';

                    // -------------------------------------------------------------

                        const blurRatio = tokStyle.glowColor ? (tokStyle.glowBlur / currentFs) : (region.blurSizeRatio || 0.1);
                        const blurPx = currentFs * blurRatio; 
                        
                        targetCtx.filter = `blur(${blurPx}px)`; 
                        targetCtx.strokeStyle = tokStyle.glowColor || region.blurColor || "#000000";
                        targetCtx.lineWidth = currentFs * 0.1 + (blurPx * 2);
