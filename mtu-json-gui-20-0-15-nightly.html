                    // -------------------------------------------------------------
                    else if (isOuterStroke) {
                        const globalOuterEnabled = (region.outerStrokeEnable !== undefined) ? region.outerStrokeEnable : activeOuterStrokeEnabled;
                        if (!globalOuterEnabled && !tokStyle.outerStrokeColor) return;

                        targetCtx.save();
                        targetCtx.filter = 'none';
                        targetCtx.strokeStyle = tokStyle.outerStrokeColor || region.outerStrokeColor || activeOuterStrokeColor;
                        
                        // 算出物理外拓宽度（局部配置采用绝对像素，全局配置采用字号比例）
                        const maxW = tokStyle.outerStrokeColor ? (tokStyle.outerStrokeWidth * 2) : (currentFs * (region.outerStrokeWidthRatio !== undefined ? region.outerStrokeWidthRatio : activeOuterStrokeWidth));
                        
                        // 局部标签默认采用利落的高级实体描边，如未触发标签则执行全局“外填孔”
                        if (useOuterConcentricFill && !tokStyle.outerStrokeColor) {
                            const step = Math.max(0.5, currentFs * 0.05);
                            for (let w = maxW; w > 0; w -= step) {
                                targetCtx.lineWidth = w;
                                targetCtx.strokeText(char, rdx, rdy);
                            }
                        } else {
                            targetCtx.lineWidth = maxW;
                            targetCtx.strokeText(char, rdx, rdy);
                        }
                        targetCtx.restore();
                    }
                    // -------------------------------------------------------------
                    // 3. 常规描边层 Pass (Stroke)
                    // -------------------------------------------------------------
                    else if (isStroke) {
                        if (!isRegionStrokeEnabled && !tokStyle.strokeColor) return;

                        targetCtx.save();
                        targetCtx.filter = 'none';
                        targetCtx.strokeStyle = tokStyle.strokeColor || finalStrokeColor;
                        
                        const maxW = tokStyle.strokeColor ? tokStyle.strokeWidth : (currentFs * finalStrokeWidthRatio);

                        if (useConcentricFill && !tokStyle.strokeColor) {
                            const step = Math.max(0.5, currentFs * 0.05);
                            for (let w = maxW; w > 0; w -= step) { 
                                targetCtx.lineWidth = w; 
                                targetCtx.strokeText(char, rdx, rdy); 
                            }
                            targetCtx.fillText(char, rdx, rdy);
                        } else {
                            targetCtx.lineWidth = maxW;
                            targetCtx.strokeText(char, rdx, rdy);
                        }

                        if (tokStyle.dot && dotX !== null && dotY !== null) {
                            targetCtx.beginPath();
                            targetCtx.arc(Math.round(dotX), Math.round(dotY), currentFs * 0.1, 0, Math.PI * 2);
                            targetCtx.lineWidth = maxW;
                            targetCtx.stroke();
                        }
                        targetCtx.restore();
                    }
                    // -------------------------------------------------------------
                    // 4. 文字填充层 Pass (Fill)
                    // -------------------------------------------------------------
                    else if (isFill) {
                        targetCtx.save();
                        targetCtx.filter = 'none';
                        targetCtx.fillStyle = tokStyle.color || finalFillColor;
                        
                        // 绘制文字主体
                        targetCtx.fillText(char, rdx, rdy);
                        if (String(effectiveWeight) === '400') {
                            targetCtx.fillText(char, rdx, rdy); // 常规字重二次叠加机制
                        }
                        
                        if (tokStyle.dot && dotX !== null && dotY !== null) {
                            targetCtx.beginPath();
                            targetCtx.arc(Math.round(dotX), Math.round(dotY), currentFs * 0.1, 0, Math.PI * 2);
                            targetCtx.fill();
 
                            // 如果是常规体，着重号也跟着补一刀加深
                            if (String(effectiveWeight) === '400') {
                                targetCtx.fill();
                            }
                        }
                        targetCtx.restore();
                    }
                };

                if (isVertical) {
                    // === [核心修复] 竖排高度测量 (Block Alignment Measurement) ===
                    // 这一步决定了"整列文字"有多高，从而决定了它在框里怎么居中。
                    // 必须和绘制逻辑、换行逻辑保持 100% 一致。
                    
                    // === 修复竖排块居中偏移：对齐测量逻辑 ===
                    // === 修复竖排块居中偏移：对齐测量逻辑 ===
                    const lineMetrics = processedLines.map(tokens => {
                        let h = 0;
                        let firstAlignDist = 0;
                        let lastAlignDist = 0;
                        let isFirstChar = true;

                        tokens.forEach(tok => {
                            const fSize = getFinalFSize(tok.style);
                            if (tok.isGroup || tok.style.tcy) {
                                if (isFirstChar) isFirstChar = false;
                                h += fSize + letterSpacingPx;
                            } else {
                                for (let charIdx = 0; charIdx < tok.text.length; charIdx++) {
                                    const char = tok.text[charIdx];
                                    let charH;
                                    const isSymmetric = CHARS_SYMMETRIC_HALF.includes(char);
                                    const isPunct = CHARS_VERTICAL_COMPRESSION.includes(char);

                                    if (isSymmetric || isPunct) charH = fSize * 0.5;
                                    else if (ROTATED_LETTERS_NUMBERS.includes(char)) charH = targetCtx.measureText(char).width;
                                    else charH = getCharVerticalHeight(char, fSize);

                                    const alignDist = (fSize - charH) / 2;
                                    

                                    // --- 【核心修复点】 ---
                                    // 把原来的 style.preKerning 改为 tok.style.preKerning
                                    const preSpacing = (tok.style.preKerning || 0) * fSize;
                                    h += charH + preSpacing + letterSpacingPx + (tok.style.kerning || 0) * fSize; // 统一累加，但不要重复操作变量 h
                                }
                            }
                        });

                        if (h > 0) h -= letterSpacingPx;

                        return {
                            theoreticalH: h,
                            visualTop: -firstAlignDist,         // 墨迹相对于 currentY 的起始偏移
                            visualBottom: h + lastAlignDist,    // 墨迹相对于 currentY 的终点位置
                            visualFullH: h + firstAlignDist + lastAlignDist // 实际占用的总高度
                        };
                    });
                                        
                    // ... (后面是 processedLines.forEach 绘制循环) ...

                    processedLines.forEach((tokens, i) => {
                        const metrics = lineMetrics[i];
                        let currentY;

                        // 获取所有行中最宽（最长）的视觉高度，用于块居中
                        const maxVisualH = Math.max(...lineMetrics.map(m => m.visualFullH));

                        if (effectiveAlign === 'column-center') {
                            // 单列居中：基于该列自身的视觉中心
                            currentY = localMinY + (boxHeight - metrics.visualFullH) / 2 - metrics.visualTop;
                        } else if (effectiveAlign === 'block-top') {
                            // 块首对齐：确保视觉顶端贴合框顶
                            currentY = localMinY - metrics.visualTop;
                        } else if (effectiveAlign === 'block-bottom') {
                            // 块尾对齐：确保视觉底端贴合框底
                            currentY = localMaxY - metrics.visualBottom;
                        } else {
                            // 默认：block-center-top (整体块居中)
                            // 计算整体块的起始偏移，并修正首字视觉偏置
                            const blockStartOffset = (boxHeight - maxVisualH) / 2;
                            currentY = localMinY + blockStartOffset - metrics.visualTop;
                        }


                        // ✅ [新代码] 直接读取刚才算好的坐标
                        const x = linePositions[i];

                        tokens.forEach(tok => {
                            if (tok.isGroup) { // --- MTU TCY 全角数字尝试版 ---
                                const fSize = baseFontSize; 
                                const segmentHeight = fSize; 
                                
                                const tcyChars = [];
                                let totalInkWidth = 0;
                                const flexGap = fSize * 0.08; 

                                tok.subTokens.forEach(sub => {
                                    const subFSize = fSize * (sub.style.scale || 1.0);
                                    
                                    // 【关键修改】：不再执行 .replace(/[０-９]/g, ...)，直接使用原始文本
                                    sub._drawText = sub.text; 
                                    
                                    targetCtx.font = `${sub.style.italic === true ? 'italic ' : ''}${sub.style.bold ? 'bold ' : effectiveWeight} ${subFSize}px ${sub.style.font || effectiveFont.replace(/"/g, '')}`;
                                    
                                    for (let char of sub._drawText) {
                                        const m = targetCtx.measureText(char);
                                        // 即使是全角字符，也要测量其实际墨迹宽度以确保像素级居中
                                        const inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
                                        tcyChars.push({
                                            char: char,
                                            style: sub.style,
                                            fSize: subFSize,
                                            inkW: inkW,
                                            lb: m.actualBoundingBoxLeft 
                                        });
                                        totalInkWidth += inkW;
                                    }
                                });

                                const totalBlockWidth = totalInkWidth + (tcyChars.length - 1) * flexGap;
                                // 允许 1.1 倍字号的宽度，防止全角数字挤压得太难看
                                const maxWidth = fSize * 1.1; 
                                let groupScaleX = (totalBlockWidth > maxWidth) ? (maxWidth / totalBlockWidth) : 1.0;

                                targetCtx.save();
                                // 维持 1.5 倍中心距
                                const charCenterY = currentY + (segmentHeight / 2); 

                                targetCtx.textAlign = 'left'; 
                                targetCtx.textBaseline = 'middle';

                                // 计算 currentXCursor 的初始值时也进行取整：
                                // 修改前：
                                // let currentXCursor = -(totalBlockWidth * groupScaleX) / 2;

                                // 修改后：确保起始点也是整数像素坐标
                                let currentXCursor = Math.round(-(totalBlockWidth * groupScaleX) / 2);

                                tcyChars.forEach(m => {
                                    targetCtx.save();
                                    targetCtx.font = `${m.style.italic === true ? 'italic ' : ''}${m.style.bold ? 'bold ' : effectiveWeight} ${m.fSize}px ${m.style.font || effectiveFont.replace(/"/g, '')}`;
                                    
                                    // 【核心改动】：对 drawX 和 drawY 取整
                                    const drawX = Math.round(x + currentXCursor + (m.lb * groupScaleX));
                                    const drawY = Math.round(charCenterY + (m.style.offY || 0));

                                    targetCtx.translate(drawX + (m.style.offX || 0), drawY);
                                    targetCtx.scale(groupScaleX, 1.0); 

                                    if (m.style.rotation) targetCtx.rotate(m.style.rotation * Math.PI / 180);

                                    // --- 渲染层 (复刻 MTU 原版逻辑) ---
                                    // =========================================================
                                    // --- 纵中横模块(TCY) 内部富文本串联渲染层 ---
                                    // =========================================================
                                    if (isGlow) {
                                        if (region.blurEnable || m.style.glowColor) {
                                            const blurRatio = m.style.glowColor ? (m.style.glowBlur / m.fSize) : (region.blurSizeRatio || 0.1);
                                            const blurPx = m.fSize * blurRatio;
                                            targetCtx.filter = `blur(${blurPx}px)`; 
                                            targetCtx.strokeStyle = m.style.glowColor || region.blurColor || "#000000";
                                            targetCtx.lineWidth = m.fSize * 0.1 + (blurPx * 2); 
                                            targetCtx.strokeText(m.char, 0, 0);
                                        }
                                    } 
                                    else if (isOuterStroke) {
                                        const globalOuterEnabled = (region.outerStrokeEnable !== undefined) ? region.outerStrokeEnable : activeOuterStrokeEnabled;
                                        if (globalOuterEnabled || m.style.outerStrokeColor) {
                                            targetCtx.filter = 'none';
                                            targetCtx.strokeStyle = m.style.outerStrokeColor || region.outerStrokeColor || activeOuterStrokeColor;
                                            const maxW = m.style.outerStrokeColor ? (m.style.outerStrokeWidth * 2) : (m.fSize * (region.outerStrokeWidthRatio !== undefined ? region.outerStrokeWidthRatio : activeOuterStrokeWidth));
                                            if (region.outer_fill_holes === true && !m.style.outerStrokeColor) {
                                                const step = Math.max(0.5, m.fSize * 0.05);
                                                for (let w = maxW; w > 0; w -= step) {
                                                    targetCtx.lineWidth = w;
                                                    targetCtx.strokeText(m.char, 0, 0);
                                                }
                                            } else {
                                                targetCtx.lineWidth = maxW;
                                                targetCtx.strokeText(m.char, 0, 0);
                                            }
                                        }
                                    }
                                    else if (isStroke) {
                                        if (isRegionStrokeEnabled || m.style.strokeColor) {
                                            targetCtx.filter = 'none';
                                            targetCtx.strokeStyle = m.style.strokeColor || finalStrokeColor;
                                            const maxW = m.style.strokeColor ? m.style.strokeWidth : (m.fSize * finalStrokeWidthRatio);
                                            if (useConcentricFill && !m.style.strokeColor) {
                                                const step = Math.max(0.5, m.fSize * 0.05);
                                                for (let w = maxW; w > 0; w -= step) { targetCtx.lineWidth = w; targetCtx.strokeText(m.char, 0, 0); }
                                                targetCtx.fillText(m.char, 0, 0);
                                            } else {
                                                targetCtx.lineWidth = maxW;
                                                targetCtx.strokeText(m.char, 0, 0);
                                            }
                                        }
                                    } 
                                    else if (isFill) {
                                        targetCtx.filter = 'none';
                                        targetCtx.fillStyle = m.style.color || finalFillColor;
                                        targetCtx.fillText(m.char, 0, 0);
                                        if (String(effectiveWeight) === '400') {
                                            targetCtx.fillText(m.char, 0, 0); // 保持双层常规字重加深
                                        }
                                    }

                                    targetCtx.restore();
                                    // --- 找到累加逻辑 ---
                                    // 修改前：
                                    // currentXCursor += (m.inkW + flexGap) * groupScaleX;

                                    // 修改后：将每一枚字符占用的总宽度（墨迹+间距）进行取整
                                    currentXCursor += Math.round((m.inkW + flexGap) * groupScaleX);
                                });

                                targetCtx.restore(); 
                                currentY += segmentHeight + letterSpacingPx;
                            }
                            else { 
                                // Normal Vertical
                                // 修改前：const style = tok.style; const fSize = baseFontSize * (style.scale || 1.0);
                                const style = tok.style; const fSize = getFinalFSize(style);
                                const isManualSkew = (typeof style.italic === 'number'); const skewAngle = isManualSkew ? style.italic : 0;
                                
                                // [设置字体] 正文应用 effectiveWeight
                                targetCtx.font = `${style.italic===true?'italic ':''} ${style.bold ? 'bold' : effectiveWeight} ${fSize}px ${style.font || effectiveFont.replace(/"/g,'')}`;
                                targetCtx.lineWidth = fSize * finalStrokeWidthRatio;

                                // === 1. 预计算竖排高度 (Pre-calc Heights) ===
                                const charHeights = [];
                                // --- 修改后的竖排步进逻辑 ---
                                for (const char of tok.text) {
                                    let h;
                                    let isSymmetric = false; // 标记是否为"旋转且对称"的符号(如括号)                                    
                                    
                                    // 在竖排预处理循环内
                                    const mode = region.punctAlign || 'half'; // 默认半格

                                    if (TARGET_PUNCTS.includes(char)) {
                                        // 只有 half 模式占 0.5，其余（full, center）均占 1.0
                                        h = (mode === 'half') ? fSize * 0.5 : fSize * 1.0;
                                    }
                                    else if (CHARS_SYMMETRIC_HALF.includes(char)) {
                                        // 括号和其他压缩字符维持原有的半格逻辑
                                        h = fSize * 0.5;
                                    }
                                    else {
                                        // 3. 普通字符
                                        if (ROTATED_LETTERS_NUMBERS.includes(char)) h = targetCtx.measureText(char).width;
                                        else h = getCharVerticalHeight(char, fSize);
                                    }
                                    
                                    const spacing = letterSpacingPx + (style.kerning || 0) * fSize;
                                    // 在 charHeights.push 之前计算前间距
                                    const preSpacing = (tok.style.preKerning || 0) * fSize; // 计算前间距像素值
                                    // h += preSpacing; 将前间距计入总高度，否则居中对齐会歪
                                    charHeights.push({ h: h, spacing: spacing, preSpacing: preSpacing, char: char, isSymmetric: isSymmetric });
                                }

                                // === 2. Ruby 逻辑 (自动适配压缩高度) ===
                                if (style.ruby) {
                                    targetCtx.save();
                                    const rubyFontSize = fSize * RUBY_SIZE_RATIO;
                                    // [设置字体] 注音不跟随 effectiveWeight (除非有[b])
                                    const rubyFont = `${style.bold ? 'bold' : ''} ${rubyFontSize}px ${style.font || effectiveFont.replace(/"/g,'')}`;
                                    targetCtx.font = rubyFont;
                                    
                                    const rubyText = style.ruby;
                                    const rubyCount = rubyText.length;
                                    const rubyRawHeight = rubyCount * rubyFontSize;
                                    
                                    // 计算正文总高度 (读取已经压缩过的 h)
                                    let tokenTotalHeight = 0; 
                                    charHeights.forEach(item => tokenTotalHeight += item.h + item.spacing);
                                    if(charHeights.length) tokenTotalHeight -= charHeights[charHeights.length-1].spacing;
                                    
                                    // 计算 Ruby X 坐标
                                    const rubyX = x + (fSize * 0.5) + (rubyFontSize * 0.5) + (fSize * RUBY_OFFSET_RATIO);

                                    // Ruby 绘制
                                    if (rubyRawHeight <= tokenTotalHeight) {
                                        const slotHeight = tokenTotalHeight / rubyCount;
                                        for (let i = 0; i < rubyCount; i++) {
                                            const charCenterY = currentY + (i * slotHeight) + (slotHeight / 2);
                                            targetCtx.save(); 
                                            targetCtx.translate(rubyX, charCenterY);
                                            if (style.rotation) targetCtx.rotate(style.rotation * Math.PI / 180);
                                            // [原有] 斜体/水平切变 (Param 3)
                                            if (isManualSkew) targetCtx.transform(1, 0, Math.tan(skewAngle * Math.PI / 180) * -1, 1, 0, 0);
                                            
                                            // [修改] 垂直切变 (Param 2) - 增加 * -1 实现向上抬
                                            if (style.vShear) targetCtx.transform(1, Math.tan(style.vShear * Math.PI / 180) * -1, 0, 1, 0, 0);
                                            targetCtx.textAlign = 'center'; targetCtx.textBaseline = 'middle'; 
                                            
                                            // 传入 rubyFontSize 确保滤镜按比例缩小
                                            executeDraw(rubyText[i], 0, 0, style, null, null, rubyFontSize);
                                            targetCtx.restore();
                                        }
                                        targetCtx.restore();
                                    } else {
                                        // 挤压模式
                                        const centerY = currentY + (tokenTotalHeight / 2);
                                        const scale = (tokenTotalHeight * 1.2) / rubyRawHeight; 
                                        const scaledFontSize = rubyFontSize * scale;
                                        const startY = centerY - (rubyRawHeight*scale / 2) + (scaledFontSize / 2);
                                        for (let i = 0; i < rubyCount; i++) {
                                            const rY = startY + (i * scaledFontSize);
                                            targetCtx.save(); targetCtx.translate(rubyX, rY); targetCtx.scale(1, scale); 
                                            if (style.rotation) targetCtx.rotate(style.rotation * Math.PI / 180);
                                            if (isManualSkew) targetCtx.transform(1, 0, Math.tan(skewAngle * Math.PI / 180) * -1, 1, 0, 0);
                                            if (style.vShear) targetCtx.transform(1, Math.tan(style.vShear * Math.PI / 180) * -1, 0, 1, 0, 0);
                                            targetCtx.textAlign = 'center'; targetCtx.textBaseline = 'middle'; 
                                            // 传入 rubyFontSize 确保滤镜按比例缩小
                                            executeDraw(rubyText[i], 0, 0, style, null, null, rubyFontSize);
                                            targetCtx.restore();
                                        }
                                        targetCtx.restore();
                                    }
                                    targetCtx.restore(); 
                                    // 恢复正文字体
                                    targetCtx.font = `${style.italic===true?'italic ':''} ${style.bold ? 'bold' : effectiveWeight} ${fSize}px ${style.font || effectiveFont.replace(/"/g,'')}`;
                                }
                                if (isFill) {
                                    // 如果标签里有颜色就用标签的，否则用区域全局颜色
                                    targetCtx.fillStyle = style.color || finalFillColor; 
                                }

                                // === 3. 竖排正文绘制循环 (含贴边对齐) ===
                                charHeights.forEach(item => {
                                    const char = item.char; 
                                    const charH = item.h; 
                                    // [新增] 在绘制字符前，先让坐标向下移动“前间距”的距离
                                    currentY += item.preSpacing;
                                    // --- A. 贴边对齐计算 (Alignment Logic) ---
                                    let charCenterY = currentY + charH / 2;
                                    const alignDist = (fSize - charH) / 2;

                                    if (CHARS_OPENING.includes(char) || CHARS_PUNCT.includes(char)) {
                                        // 前括号/逗号/句号：向上贴边 (远离下文)
                                        charCenterY -= alignDist;
                                    } 
                                    else if (CHARS_CLOSING.includes(char)) {
                                        // 后括号：向下贴边 (远离上文)
                                        charCenterY += alignDist;
                                    }


                                    targetCtx.save(); 
                                    // 【核心改动】：对 translate 的坐标进行 Math.round()
                                    targetCtx.translate(Math.round(x + (style.offX || 0)), Math.round(charCenterY + (style.offY || 0)));
                                    
                                    // --- B.旋转处理 & C.变形逻辑  (含修复) ---
                                    const isRotatedLetter = ROTATED_LETTERS_NUMBERS.includes(char);
                                    const needsRotation = isRotatedLetter || CHARS_TO_ROTATE.includes(char) || item.isSymmetric;

                                    if (needsRotation) { 
                                        targetCtx.rotate(Math.PI / 2); 
                                        if (char === "〜") targetCtx.scale(-1, 1); 
                                        
                                        // 【核心修复】
                                        // 1. 逻辑互换：斜体影响 Y(param2)，垂直切变影响 X(param3)
                                        // 2. 符号修正：由于坐标轴旋转了90度，方向也反了，所以这里把原本的 * -1 去掉
                                        
                                        // 1. 斜体 (SkewX -> SkewY slot)
                                        // [i=15] 原本有 *-1，这里去掉，变成正切值
                                        if (isManualSkew) {
                                            targetCtx.transform(1, Math.tan(skewAngle * Math.PI / 180), 0, 1, 0, 0);
                                        }
                                        
                                        // 2. 垂直切变 (SkewY -> SkewX slot)
                                        // [v=15] 原本有 *-1，这里去掉，变成正切值
                                        if (style.vShear) {
                                            targetCtx.transform(1, 0, Math.tan(style.vShear * Math.PI / 180), 1, 0, 0);
                                        }

                                    } else {
                                        // 【正常字符】未旋转，使用标准逻辑
                                        
                                        // 1. 正常变形 (原手动斜体代码)
                                        if (isManualSkew) {
                                            targetCtx.transform(1, 0, Math.tan(skewAngle * Math.PI / 180) * -1, 1, 0, 0);
                                        }
                                        
                                        // 2. 正常垂直切变 (原垂直切变代码)
                                        if (style.vShear) {
                                            targetCtx.transform(1, Math.tan(style.vShear * Math.PI / 180) * -1, 0, 1, 0, 0);
                                        }
                                    }

                                    // 旋转逻辑 (rotation) 保持在最后，因为它是在自身坐标系旋转，通常不受影响，
                                    // 但为了保险，通常放在切变之后或者保持现状。
                                    if (style.rotation) targetCtx.rotate(style.rotation * Math.PI / 180);
                                    
                                    // 镜像处理逻辑
                                    if (style.mirror) {
                                        targetCtx.scale(-1, 1);  // 水平镜像翻转 [m]
                                    }
                                    if (style.mirrorV) {
                                        targetCtx.scale(1, -1);  // 竖向镜像翻转 [mv]
                                    }

                                    targetCtx.textAlign = 'center'; 
                                    targetCtx.textBaseline = 'middle';

                                    // --- D. 墨迹水平居中 (优化版) ---
                                    if (needsRotation && (CHARS_DYNAMIC_CENTER.includes(char) || item.isSymmetric) && !CHARS_NO_CENTER_H.includes(char)) {
                                        const metrics = targetCtx.measureText(char);
                                        
                                        // 采用更精确的墨迹几何中心
                                        // Ascent 是基线到墨迹顶部的距离，Descent 是基线到墨迹底部的距离（通常为负）
                                        // 旋转 90 度后，这个方向变成了水平方向的偏移
                                        const inkMiddle = (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
                                        
                                        // 修正：如果发现某些符号（如 】）依然偏离，可以结合字号进行微调
                                        // 大多数情况下，inkMiddle 已经能解决问题
                                        targetCtx.translate(0, inkMiddle);
                                    }

                                    // 绘制基准点
                                    let drawX = 0, drawY = 0;

                                    // --- E. 非旋转标点的微调 (非半宽) ---
                                    if (!needsRotation) {
                                        if (CHARS_UPRIGHT_CENTER.includes(char)) {
                                            const metrics = targetCtx.measureText(char);
                                            drawX = (metrics.actualBoundingBoxLeft - metrics.actualBoundingBoxRight) / 2;
                                            drawY = (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
                                        }
                                        else if (CHARS_PUNCTUATION_TOP_RIGHT.includes(char)) {
                                            const m = targetCtx.measureText(char);
                                            const mode = region.punctAlign || 'half';
                                            const currentCellHeight = item.h; // 预处理分配的高度

                                            if (mode === 'center') {
                                                // --- 几何居中 ---
                                                drawX = (m.actualBoundingBoxLeft - m.actualBoundingBoxRight) / 2;
                                                drawY = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
                                            } else {
                                                // 1. 水平定位：保持贴右边界
                                                drawX = (fSize / 2) - m.actualBoundingBoxRight;
                                                
                                                // 2. 垂直定位：默认以“右上半格”为基准
                                                // 此时 drawY 会让标点顶端对齐当前格子的中心点（即上半格的顶）
                                                drawY = m.actualBoundingBoxAscent + (fSize * 0.05);
                                                
                                                // 如果是 full 模式，由于格子变大了，我们可能需要额外的微调（如你之前提议的位移补偿）
                                                if (mode === 'full') {
                                                    drawY -= (fSize * 0.5); 
                                                }
                                            }
                                        }
                                        else if (HALF_WIDTH_PUNCTUATION_TOP_RIGHT.includes(char)) { drawX = fSize * 0.3; drawY = -fSize * 0.4; }
                                        else if (CHARS_SMALL_KANA_TOP_RIGHT.includes(char)) { drawX = fSize * 0.1; drawY = -fSize * 0.15; }
                                    }

                                    // --- F. 最终绘制 (描边/填充/着重号) ---

                                    // 1. [新增] 统一计算着重号的水平偏移量
                                    let dotOffsetX = (fSize * 0.5) + (fSize * DOT_OFFSET_RATIO) + (fSize * DOT_RADIUS_RATIO);

                                    // 2. [关键逻辑]：利用预计算的 lineLayouts[i].hasRuby 判断整行是否需要避让
                                    // 只要本行中有一个字有注音，整行的点全部向右平移
                                    if (lineLayouts[i] && lineLayouts[i].hasRuby) {
                                        dotOffsetX += (fSize * RUBY_SIZE_RATIO); 
                                    }

                                    const dotCenterX = drawX + dotOffsetX;

                                    // --- 竖排逻辑：点在字符右侧 ---
                                    // 这里的 dotCenterX 是你之前算好的 (drawX + dotOffsetX)
                                    executeDraw(char, drawX, drawY, style, dotCenterX, drawY, fSize);
                                    
                                    targetCtx.restore(); 
                                    currentY += charH + item.spacing;
                                });
                            }
                        });
                    });

                } else {
                    // === 横排逻辑 (修复版：实现括号精准贴边与单次循环渲染) ===
                    let maxLineWidth = 0;
                    
                    // --- 1. 预计算行宽与字符详情 (用于处理块对齐) ---
                    const linesWidths = processedLines.map(toks => {
                        let w = 0; 
                        toks.forEach(tok => {
                            // 修改前：const fSize = baseFontSize * (tok.style.scale || 1.0);
                            const fSize = getFinalFSize(tok.style);
                            targetCtx.font = `${tok.style.italic===true?'italic ':''} ${tok.style.bold ? 'bold' : effectiveWeight} ${fSize}px ${tok.style.font || effectiveFont.replace(/"/g,'')}`;
                            
                            tok.charDetails = []; // 挂载详情供渲染使用
                            const mode = region.punctAlign || 'half';
                            // --- 修改后的横排步进逻辑 ---
                            for (let i = 0; i < tok.text.length; i++) {
                                const char = tok.text[i];
                                let visualWidth;

                                const cW = targetCtx.measureText(char).width; 
                                const spacing = letterSpacingPx + (tok.style.kerning || 0) * fSize;
                                
                                isSymmetric = false;

                                // 在横排预处理循环内
                                

                                if (TARGET_PUNCTS.includes(char)) {
                                    // 只有 half 模式才压缩宽度，center 和 full 都占 1.0f
                                    visualWidth = (mode === 'half') ? fSize * 0.5 : fSize * 1.0;
                                } else if (CHARS_SYMMETRIC_HALF.includes(char)) {
                                    visualWidth = fSize * 0.5;
                                } else {
                                    visualWidth = targetCtx.measureText(char).width;
                                }

                                const preSpacing = (tok.style.preKerning || 0) * fSize;
                                const advance = visualWidth + spacing;
                                w += advance;

                                tok.charDetails.push({ 
                                    char, originalWidth: cW, visualWidth, advance, spacing, isSymmetric, preSpacing // 存入详情
                                });
                            }
                            if (tok.charDetails.length > 0) w -= (letterSpacingPx + (tok.style.kerning || 0) * fSize);
                        });
                        if (w > maxLineWidth) maxLineWidth = w; 
                        return w;
                    });

                    // --- 2. 核心渲染循环 ---
                    processedLines.forEach((tokens, lineIndex) => {
                        const lineWidth = linesWidths[lineIndex];
                        const y = linePositions[lineIndex];
                        
                        let currentX;
                        // 处理对齐方式
                        if (effectiveAlign === 'block-center-top') currentX = -maxLineWidth / 2;
                        else if (effectiveAlign === 'block-top') currentX = -boxWidth / 2;
                        else if (effectiveAlign === 'block-bottom') currentX = (boxWidth / 2) - lineWidth;
                        else currentX = -lineWidth / 2;

                        tokens.forEach(tok => {
                            const style = tok.style; 
                            // 修改前：const fSize = baseFontSize * (style.scale || 1.0);
                            const fSize = getFinalFSize(style);
                            const isManualSkew = (typeof style.italic === 'number'); 
                            const skewAngle = isManualSkew ? style.italic : 0;
                            
                            targetCtx.font = `${style.italic===true?'italic ':''} ${style.bold ? 'bold' : effectiveWeight} ${fSize}px ${style.font || effectiveFont.replace(/"/g,'')}`;
                            targetCtx.lineWidth = fSize * finalStrokeWidthRatio;

                            // === [新增] 横排 Ruby 绘制逻辑 ===
                            // === [修复版] 横排 Ruby 绘制逻辑 ===
                            if (style.ruby) {
                                targetCtx.save(); // 保存进入 Ruby 前的状态
                                const rubyFontSize = fSize * RUBY_SIZE_RATIO;
                                const rubyFont = `${style.bold ? 'bold ' : ''}${rubyFontSize}px ${style.font || effectiveFont.replace(/"/g,'')}`;
                                targetCtx.font = rubyFont;

                                const rubyText = style.ruby;
                                const rubyCount = rubyText.length;
                                
                                // 计算这个 Token 的总宽度以便平分 Ruby
                                // === [核心修复] 横排 Ruby 宽度计算：剔除末尾间距 ===
                                let tokenWidth = 0;
                                if (tok.charDetails && tok.charDetails.length > 0) {
                                    // 累加所有字符的占据宽度（含间距）
                                    tok.charDetails.forEach(cd => tokenWidth += cd.advance);
                                    // 【关键修复】：减去最后一个字符多加的间距，使 Ruby 精准对齐文字两端
                                    const lastChar = tok.charDetails[tok.charDetails.length - 1];
                                    tokenWidth -= lastChar.spacing;
                                }
                                else {
                                    tokenWidth = targetCtx.measureText(tok.text).width; // 兜底处理
                                }

                                // 计算 Ruby 的 Y 轴位置（在正文上方）
                                const rubyY = y - (fSize * 0.5) - (rubyFontSize * 0.5) - (fSize * RUBY_OFFSET_RATIO);

                                // 在循环外统一设置对齐方式，提高性能
                                targetCtx.textAlign = 'center';
                                targetCtx.textBaseline = 'middle';

                                for (let rIdx = 0; rIdx < rubyCount; rIdx++) {
                                    // 在 Token 宽度内均匀分布 Ruby 字符
                                    const rubyX = currentX + (tokenWidth / rubyCount) * (rIdx + 0.5);
                                    
                                    // 调用全能绘制函数
                                    executeDraw(rubyText[rIdx], rubyX, rubyY, style, null, null, rubyFontSize);
                                }

                                targetCtx.restore(); // 循环结束，统一恢复到正文之前的状态

                                // 此时无需手动恢复 targetCtx.font，因为 restore 已经帮你做好了
                            }
                            if (isFill) {
                                targetCtx.fillStyle = style.color || finalFillColor; 
                            }

                            // 渲染字符
                            if (tok.charDetails) {
                                tok.charDetails.forEach(item => {
                                    const char = item.char;

                                    // [新增] 在确定槽位中心前，先让坐标向右移动“前间距”
                                    currentX += item.preSpacing;
                                    
                                    const slotWidth = item.visualWidth;
                                    let drawCenterX = currentX + slotWidth / 2; // 默认槽位中心
                                    let drawX = 0;
                                    let drawY = 0;

                                    const m = targetCtx.measureText(char);
                                    const mode = region.punctAlign || 'half';
                                    const pad = fSize * 0.05; // 呼吸感间距补偿

                                    // 1. 定义判定条件
                                    const isPunctuation = TARGET_PUNCTS.includes(char); // 。，、
                                    const isClosing = CHARS_CLOSING.includes(char);     // 〉）】》』」｝〟
                                    const isOpening = CHARS_OPENING.includes(char);     // 〈（【《『「｛〝

                                    if (isPunctuation) {
                                        const m = targetCtx.measureText(char);
                                        const mode = region.punctAlign || 'half';
                                        const pad = fSize * 0.05;

                                        if (mode === 'half') {
                                            // 【核心修复】由于 drawCenterX 已经在 0.25em 处 fSize * 0.5 - 
                                            // 距离 1.0em 格子的左边缘只需要向左移动 0.25em + m.actualBoundingBoxDescent 
                                            // drawX = (-fSize * 0.5) + m.actualBoundingBoxLeft; -fSize * 0.5 + 
                                            // drawY = (fSize * 0.5) - m.actualBoundingBoxDescent; (-fSize * 0.5)  +(m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2
                                            drawX = fSize * 0.25 + m.actualBoundingBoxLeft;
                                            drawY = 0;
                                        } else if (mode === 'center') {
                                            // 【核心修复】居中模式通常指在全宽（1.0em）格子中居中m.actualBoundingBoxDescent + 
                                            // 需要从 0.25em 处向右移动 0.25em 达到全宽中心，再应用几何对齐
                                            drawX = fSize * 0.5 + (m.actualBoundingBoxLeft - m.actualBoundingBoxRight) / 2;
                                            drawY = -fSize * 0.5 + 2 * m.actualBoundingBoxDescent + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
                                        }
                                    } else if (isClosing) {
                                        // 后括号保持原本的槽位偏移逻辑
                                        const alignDist = (fSize - slotWidth) / 2;
                                        drawCenterX += alignDist;
                                    } else if (isOpening) {
                                        const alignDist = (fSize - slotWidth) / 2;
                                        drawCenterX -= alignDist;
                                    }

                                    targetCtx.save();
                                    // 【关键步】确保 drawX 和 drawY 被计入 translate
                                    targetCtx.translate(
                                        Math.round(drawCenterX + drawX + (style.offX || 0)), 
                                        Math.round(y + drawY + (style.offY || 0))
                                    );
                                    
                                    // 镜像处理逻辑
                                    if (style.mirror) {
                                        targetCtx.scale(-1, 1);  // 水平镜像翻转 [m]
                                    }
                                    if (style.mirrorV) {
                                        targetCtx.scale(1, -1);  // 竖向镜像翻转 [mv]
                                    }
                                    
                                    // 找到这几行（大约在 3078 行）：
                                    if (char === "〜") targetCtx.scale(-1, 1);
                                    if (isManualSkew) targetCtx.transform(1, 0, Math.tan(skewAngle * Math.PI / 180) * -1, 1, 0, 0);

                                    // --- [核心修复：插入以下代码] ---
                                    if (style.vShear) {
                                        // 这里的参数 2 是垂直切变位。* -1 是为了确保方向与竖排逻辑一致（向上/向下）
                                        targetCtx.transform(1, Math.tan(style.vShear * Math.PI / 180) * -1, 0, 1, 0, 0);
                                    }
                                    // ------------------------------

                                    if (style.rotation) targetCtx.rotate(style.rotation * Math.PI / 180);
                                    
                                    targetCtx.textAlign = 'center'; 
                                    targetCtx.textBaseline = 'middle';

                                    // --- 横排逻辑：点在字符下方 ---
                                    // 计算横排着重号的 Y 轴偏移（在字符中心下方）
                                    const hDotY = (fSize * 0.5) + (fSize * 0.05) + (fSize * 0.1);
                                    // [修复] 横排正文调用，传入 fSize
                                    executeDraw(item.char, 0, 0, tok.style, 0, hDotY, fSize);

                                    targetCtx.restore();
                                    currentX += item.advance;
                                });
                            }
                        });
                    });
                }
                targetCtx.restore();
            }

            // 修改前：
            // if (!onlyPass || onlyPass === 'stroke') renderPass('stroke');
            // if (!onlyPass || onlyPass === 'fill') renderPass('fill');

            // 修改后：严格的汉堡包叠加顺序
            // 修改后的顺序
            if (!onlyPass) {
                renderPass('glow');         // 最底层：发光
                renderPass('outer-stroke'); // [新增] 第二层：外描边
                renderPass('stroke');       // 第三层：常规描边
                renderPass('fill');         // 最顶层：字体填充
            } else {
                renderPass(onlyPass);
            }
            
            targetCtx.restore();
        }

        // [Original Mode Strict Line] - (No changes needed here)
        // [重写] 原文模式渲染函数 - 解决了标点重叠与居中问题
        // --- [修正版] 原文模式渲染：同步标点压缩与旋转逻辑 ---
        // --- [核心升级] 原文模式：全面同步译文模式的压缩与居中算法 ---
        // --- [终极修正] 原文模式：全面同步译文模式的压缩、贴边与几何中心居中算法 ---
        // --- [终极修正] 原文模式：全面同步译文模式的压缩、贴边与几何中心居中算法 ---
        // --- [终极修正] 直接引用 CHARS_DYNAMIC_CENTER 常量，严格对齐译文模式算法 ---
        // --- [终极修正] 1:1 复刻译文模式渲染流水线 ---
        function drawOriginal(r) {
            if (!r.lines || !r.texts) return;
            const fs = r.font_size || 20;
            const isVertical = r.direction === 'v';
            const tcyEnabled = (r.tcy_enabled !== undefined) ? r.tcy_enabled : true;

            ctx.save();
            ctx.fillStyle = "black";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 2 / viewState.scale;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            r.lines.forEach((polygon, i) => {
                const text = r.texts[i] || "";
                if (!text) return;

                const center = getPolygonCenter(polygon);
                const p0 = polygon[0], p1 = polygon[1];
                let angle = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
                let angleDeg = angle * 180 / Math.PI;
                if (angleDeg > 90) angleDeg -= 180;
                if (angleDeg < -90) angleDeg += 180;
                angle = angleDeg * Math.PI / 180;

                ctx.save();
                ctx.translate(center.x, center.y);
                ctx.rotate(angle);
                ctx.font = `${fs}px "Noto Sans JP", sans-serif`;

                if (isVertical) {
                    // --- 1. 竖排逻辑 ---
                    const segments = [];
                    if (tcyEnabled) {
                        const regex = /([\d\uFF10-\uFF19]{2,4})/g;
                        let match, lastIdx = 0;
                        while ((match = regex.exec(text)) !== null) {
                            if (match.index > lastIdx) segments.push({ text: text.substring(lastIdx, match.index), tcy: false });
                            segments.push({ text: match[0], tcy: true });
                            lastIdx = regex.lastIndex;
                        }
                        if (lastIdx < text.length) segments.push({ text: text.substring(lastIdx), tcy: false });
                    } else { segments.push({ text: text, tcy: false }); }

                    // 计算总高度 (必须与渲染步进 100% 同步)
                    let totalH = 0;
                    segments.forEach(seg => {
                        if (seg.tcy) totalH += fs;
                        else {
                            for (const char of seg.text) {
                                const m = ctx.measureText(char);
                                const isRot = ROTATED_LETTERS_NUMBERS.includes(char) || CHARS_TO_ROTATE.includes(char);
                                const isComp = CHARS_VERTICAL_COMPRESSION.includes(char) || CHARS_SYMMETRIC_HALF.includes(char) || isHalfWidth(char);
                                // 压缩符 0.5fs，旋转字母取宽度，其他取 fs
                                totalH += isComp ? (fs * 0.5) : (isRot ? (ROTATED_LETTERS_NUMBERS.includes(char) ? m.width : fs) : fs);
                            }
                        }
                    });

                    let currentY = -totalH / 2;
                    segments.forEach(seg => {
                        if (seg.tcy) {
                            ctx.save(); ctx.translate(0, currentY + fs / 2); ctx.strokeText(seg.text, 0, 0); ctx.fillText(seg.text, 0, 0); ctx.restore();
                            currentY += fs;
                        } else {
                            for (const char of seg.text) {
                                const m = ctx.measureText(char);
                                const isRot = ROTATED_LETTERS_NUMBERS.includes(char) || CHARS_TO_ROTATE.includes(char);
                                const isComp = CHARS_VERTICAL_COMPRESSION.includes(char) || CHARS_SYMMETRIC_HALF.includes(char) || isHalfWidth(char);
                                const stepH = isComp ? (fs * 0.5) : (isRot ? (ROTATED_LETTERS_NUMBERS.includes(char) ? m.width : fs) : fs);

                                // A. 垂直位置 (贴边逻辑)
                                let charY = currentY + stepH / 2;
                                const alignDist = (fs - stepH) / 2;
                                if (CHARS_OPENING.includes(char) || CHARS_PUNCT.includes(char)) charY -= alignDist;
                                else if (CHARS_CLOSING.includes(char)) charY += alignDist;

                                // B. 居中计算 (inkMiddle)
                                let inkOffset = 0;
                                if (CHARS_DYNAMIC_CENTER.includes(char)) {
                                    // 对于旋转了90度的字符，高度指标(Ascent/Descent)变成了水平方向的偏移指标
                                    inkOffset = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
                                } 
                                else if (CHARS_VISUAL_CENTER.includes(char)) {
                                    inkOffset = (m.actualBoundingBoxLeft - m.actualBoundingBoxRight) / 2; // 修改为相减
                                }

                                ctx.save();
                                if (isRot) {
                                    // 【复刻译文模式核心步骤】
                                    ctx.translate(0, charY);     // 先移到行的中轴线和字符高度中心
                                    ctx.rotate(Math.PI / 2);    // 旋转 90 度
                                    if (char === "〜") ctx.scale(-1, 1);
                                    // 重点：inkOffset 必须加在第二个参数 (渲染坐标的 Y)
                                    // 在旋转后的坐标系里，这才是视觉上的“左右水平移动”
                                    // 在 drawOriginal 约 3328 行附近
                                    // 修改前：ctx.strokeText(char, 0, inkOffset);
                                    // 修改后：强制水平偏移取整
                                    const finalInkX = Math.round(inkOffset);
                                    ctx.strokeText(char, 0, finalInkX);
                                    ctx.fillText(char, 0, finalInkX);
                                } else {
                                    // 确保 currentY 的累加步进是整数，或者在 translate 时取整
ctx.translate(0, Math.round(charY));
                                    ctx.strokeText(char, 0, 0);
                                    ctx.fillText(char, 0, 0);
                                }
                                ctx.restore();
                                currentY += stepH;
                            }
                        }
                    });

                } else {
                    // --- 2. 横排逻辑 (对齐译文模式压缩) ---
                    let totalW = 0;
                    const charDetails = [];
                    for (const char of text) {
                        const m = ctx.measureText(char);
                        const isComp = CHARS_HORIZONTAL_COMPRESSION.includes(char) || CHARS_SYMMETRIC_HALF.includes(char);
                        const vW = isComp ? m.width * 0.5 : m.width;
                        totalW += vW;
                        charDetails.push({ char, m, vW });
                    }
                    let currentX = -totalW / 2;
                    charDetails.forEach(item => {
                        const { char, m, vW } = item;
                        let dX = currentX + vW / 2;
                        const aDist = (m.width - vW) / 2;
                        if (CHARS_PUNCT.includes(char) || CHARS_CLOSING.includes(char)) dX += aDist;
                        else if (CHARS_OPENING.includes(char)) dX -= aDist;
                        ctx.save(); ctx.translate(dX, 0); if (char === "〜") ctx.scale(-1, 1);
                        ctx.strokeText(char, 0, 0); ctx.fillText(char, 0, 0); ctx.restore();
                        currentX += vW;
                    });
                }
                ctx.restore();
            });
            ctx.restore();
        }
        // --- Utils ---
        // --- [绑定事件] ---
        document.getElementById('repairInput').addEventListener('change', (e) => handleImageUpload(e, 'repair'));
        document.getElementById('repairFolderInput').addEventListener('change', (e) => handleFolderSelect(e, 'repair'));


        // --- [修改] handleImageUpload 支持修复图 ---
        function handleImageUpload(e, type = 'original') {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => {
                if (type === 'repair') {
                    currentRepairImage = img;
                } else {
                    currentImage = img;
                    currentFileName = file.name.split('.')[0];
                }
                resizeCanvas();
                draw();
            };
            img.src = URL.createObjectURL(file);
        }

        // --- [修改] 批量匹配逻辑 (matchAndLoadFiles) ---
        // 在 tempMatches.push 时加入 repairImage 匹配，通常根据文件名相同来匹配
        // 例如：001.jpg (原图) -> 001.png (修复图)

        window.canvasFitMode = 'auto'; // 全局缩放状态：auto=全屏自适应，width=宽度自适应

        window.setViewFitMode = function(mode) {
            window.canvasFitMode = mode;
            const btnAuto = document.getElementById('btnViewAuto');
            const btnWidth = document.getElementById('btnViewWidth');
            if (mode === 'width') {
                btnWidth.classList.add('bg-blue-600', 'text-white'); btnWidth.classList.remove('text-gray-300');
                btnAuto.classList.add('text-gray-300'); btnAuto.classList.remove('bg-blue-600', 'text-white');
            } else {

                btnWidth.classList.add('text-gray-300'); btnWidth.classList.remove('bg-blue-600', 'text-white');
            }
            resizeCanvas();
            draw();
        };

        function resizeCanvas() {
            if(!currentImage) return;

            const oldW = paintCanvas.width;
            const oldH = paintCanvas.height;

            if (oldW !== currentImage.width || oldH !== currentImage.height) {
                mainCanvas.width = currentImage.width; 
                mainCanvas.height = currentImage.height;
                paintCanvas.width = currentImage.width;
                paintCanvas.height = currentImage.height;
                
                const item = matchedFiles[currentFileIndex];
                if (item && item.paint_raw) {
                    const pImg = new Image();
                    pImg.onload = () => { paintCtx.drawImage(pImg, 0, 0); draw(); };
                    pImg.src = item.paint_raw;
                }
            }

            if(window.comparisonRawImg) {
                comparisonRawImg.width = currentImage.width;
                comparisonRawImg.height = currentImage.height;
            }
            
            const activeContainer = (displayMode === 'comparison') ? leftCompare : document.getElementById('canvasContainer');
            const rect = activeContainer.getBoundingClientRect();
            
            const padding = 40; 
            const availableW = rect.width - padding;
            const availableH = rect.height - padding;

            const scaleX = availableW / currentImage.width;
            const scaleY = availableH / currentImage.height;
            
            // --- 核心改动：判定自适应模式 ---
            let initScale;
            if (window.canvasFitMode === 'width') {
                initScale = scaleX * 0.98; // 宽度优先占满
                viewState.scale = initScale;
                viewState.x = (rect.width - currentImage.width * initScale) / 2;
                viewState.y = padding / 2; // 顶格贴齐，方便纵向直接滚阅
            } else {
                initScale = Math.min(scaleX, scaleY) * 0.95; // 原全屏缩放逻辑
                viewState.scale = initScale;
                viewState.x = (rect.width - currentImage.width * initScale) / 2;
                viewState.y = (rect.height - currentImage.height * initScale) / 2;
            }
            
            updateCanvasTransform();
            
            const fullContainer = document.getElementById('canvasContainer');
            uiCanvas.width = fullContainer.clientWidth;
            uiCanvas.height = fullContainer.clientHeight;

            // 联动同步滚动条显示
            if (typeof syncMtuScrollbars === 'function') syncMtuScrollbars();
        }

        // 建议放在 script 标签内 matchAndLoadFiles 函数附近
        // --- 优化后的批量导入逻辑 ---
        // --- 优化后的批量导入逻辑 ---
        document.getElementById('mtuProjectInput').addEventListener('change', async (e) => {
            const allFiles = Array.from(e.target.files);

        async function handleFolderSelect(e, type) {
            const allFiles = Array.from(e.target.files);
            
            // 自动更新项目名
            if (allFiles.length > 0 && allFiles[0].webkitRelativePath) {
                if (type === 'image' || type === 'json') {
                    currentProjectName = allFiles[0].webkitRelativePath.split('/')[0];
                }
            }
            
            // 【过滤】只保留根目录文件，防止统计数字爆炸
            const rootFiles = allFiles.filter(f => f.webkitRelativePath.split('/').length === 2);

            if (type === 'image') imageFiles = rootFiles;
            else if (type === 'json') jsonFiles = rootFiles;
            else if (type === 'repair') repairFiles = rootFiles; 
            
            // 关键：这里需要 await，确保数据加载完成后再继续
            await matchAndLoadFiles();
        }



        // 同时修改 HTML 监听绑定 (约 982 行附近)
        imageFolderInput.addEventListener('change', (e) => handleFolderSelect(e, 'image'));
        jsonFolderInput.addEventListener('change', (e) => handleFolderSelect(e, 'json'));
        // 修改约 1550 行的绑定
        
        // --- [修正] 适配 MTU 命名规范的匹配逻辑 ---
        // --- [优化] 批量匹配逻辑 ---
        // --- [优化版] 批量匹配逻辑：支持无 JSON 原图加载 ---
        async function matchAndLoadFiles() {
            if (!imageFiles || imageFiles.length === 0) {
                alert("未发现原图，请检查文件夹选择。");
                return;
            }

            const getCleanKey = (name) => {
                return name.toLowerCase()
                    .split('.')[0]
                    .replace('_translations', '')
                    .replace('_inpainted', '')
                    .replace('_fixed', '')
                    .replace('_mask', '')
                    .trim();
            };

            // --- 第一阶段：初始化原图基础列表 ---
            const tempMatches = imageFiles.map(imgFile => ({
                image: imgFile,
                imgKey: getCleanKey(imgFile.name),
                repairImage: null,
                jsonName: imgFile.name.split('.')[0] + ".json",
                regions: [],
                mask_raw: null,
                paint_raw: null
            }));

            // --- 第二阶段：匹配修复图 (Inpainted) ---
            if (repairFiles && repairFiles.length > 0) {
                const repairMap = new Map();
                repairFiles.forEach(f => repairMap.set(getCleanKey(f.name), f));
                
                tempMatches.forEach(item => {
                    const repairFile = repairMap.get(item.imgKey);
                    if (repairFile) {
                        item.repairImage = repairFile;
                    }
                });
                console.log(`阶段2：已匹配 ${repairFiles.length} 张修复图。`);
            }

            // --- 第三阶段：读取并解析 JSON 数据 ---
            if (jsonFiles && jsonFiles.length > 0) {
                const jsonMap = new Map();
                jsonFiles.forEach(f => jsonMap.set(getCleanKey(f.name), f));

                for (const item of tempMatches) {
                    const jsonFile = jsonMap.get(item.imgKey);
                    if (jsonFile) {
                        try {
                            const jsonText = await jsonFile.text();
                            const raw = JSON.parse(jsonText);
                            const data = raw.regions ? raw : raw[Object.keys(raw)[0]];
                            
                            // 同步 JSON 内的数据属性
                            item.regions = data.regions || [];
                            item.mask_raw = data.mask_raw || null;
                            item.paint_raw = data.paint_raw || null;
                            item.jsonName = jsonFile.name;

                            // 统一进行数据清洗与初始化
                            item.regions.forEach(r => {
                                if (r.direction === 'vertical') r.direction = 'v';
                                if (r.direction === 'horizontal') r.direction = 'h';
                                r.font_size = Math.round(r.font_size || 20);
                                
                                // --- 修改开始：同步判定逻辑 ---
                                r.line_spacing = r.line_spacing_mtu !== undefined ? r.line_spacing_mtu : 1.2;
                                r.letter_spacing = r.letter_spacing_mtu !== undefined ? r.letter_spacing_mtu : 0;
                                // --- 修改结束 ---

                                const finalFg = r.fg_colors || r.font_color;
                                if (finalFg) r.parsedColor = parseColor(finalFg);

                                if (r.parsedColor && isNearWhite(colorToHex(r.parsedColor))) {
                                    if (!r.strokeColor || r.strokeColor === 'none') {
                                        r.strokeColor = "#000000"; 
                                        if (r.strokeWidthRatio === undefined || r.strokeWidthRatio === 0) r.strokeWidthRatio = 0.2;
                                    }
                                }

                                if (r.box && Array.isArray(r.box) && r.angle !== undefined) {
                                    // 保持精修坐标
                                } else {
                                    restoreLinesFromCenter(r); 
                                    initRegionBox(r); 
                                }

                                if (r.translation) {
                                    // 强制将 [BR]、<br> 统一替换为标准 【BR】（不区分大小写）
                                    r.translation = r.translation.replace(/\[BR\]|【BR】|<br>/gi, '【BR】');
                                    r.translation = cleanTranslationText(r.translation);
                                }
                            });
                        } catch (err) {
                            console.error(`阶段3：解析 JSON 失败 (${jsonFile.name}):`, err);
                        }
                    }
                }
                console.log(`阶段3：JSON 数据装载完成。`);
            }

            // 最后执行自然数排序，确保 1.png, 2.png, 10.png 顺序正确
            matchedFiles = tempMatches.sort((a, b) => 
                a.image.name.localeCompare(b.image.name, undefined, { numeric: true, sensitivity: 'base' })
            );

            // 更新 UI 并加载首页
            if (matchedFiles.length > 0) {
                currentFileIndex = 0;
                batchNav.classList.replace('hidden', 'flex');
                loadFile(0);
            }
        }

        // --- [新增] 跳转到指定索引 (含保存逻辑) ---
        function jumpToPage(index) {
            if (index < 0 || index >= matchedFiles.length) return;
            // 离开前保存当前页修改
            if (matchedFiles[currentFileIndex]) {
                matchedFiles[currentFileIndex].regions = JSON.parse(JSON.stringify(regions));
            }
            currentFileIndex = index;
            loadFile(currentFileIndex);
        }

        // --- [新增] 刷新导航按钮的禁用状态 (变灰逻辑) ---
        function updateBatchNavUI() {
            const isFirst = currentFileIndex === 0;
            const isLast = currentFileIndex === matchedFiles.length - 1;
            
            // 处于第一页时，禁用“首页”和“上一页”
            document.getElementById('btnFirstPage').disabled = isFirst;
            document.getElementById('btnPrevPage').disabled = isFirst;

        // --- [新增] 跳页监听逻辑 ---
        // --- [完善] 监听页码输入框的回车跳转 ---
        pageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(pageInput.value);
                if (!isNaN(val) && val >= 1 && val <= matchedFiles.length) {
                    jumpToPage(val - 1);
                    pageInput.blur(); 
                } else {
                    alert(`请输入 1-${matchedFiles.length} 之间的页码`);
                    pageInput.value = currentFileIndex + 1;
                }
            }
        });
        // --- [修改后] 批量加载函数：仅负责读取，不负责重新计算 ---
        // --- 修正后的加载函数 ---
        async function loadFile(index) {
            if (index < 0 || index >= matchedFiles.length) return;
            
            // --- 新增：切换页面时清空右键多选列表 ---
            selectedRegions = [];

            // 1. 进入加载状态，锁定唯一加载 ID
            isPageLoading = true; 
            const myLoadId = ++currentLoadingId; 

            const item = matchedFiles[index];
            pageInput.value = index + 1;
            fileCounterTotal.textContent = `/ ${matchedFiles.length}`;

            // 2. 【核心】瞬间清空所有残留，不给“脏数据”留机会
            currentRepairImage = null;
            currentMaskImage = null;
            
            // 物理清空蒙版与涂鸦画布
            maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            
            // 同步更新文字区域数据 (JSON 核心数据)
            regions = JSON.parse(JSON.stringify(item.regions));
            
            // 立即重绘一次（此时屏幕会瞬间变干净，只剩加载背景或原图）
            draw();

            try {
                // 3. 加载主原图
                const img = new Image();
                const mainImg = await new Promise((resolve, reject) => {
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = URL.createObjectURL(item.image);
                });

                // 翻页保护：如果还没加载完就又点了一下，直接撤销
                if (myLoadId !== currentLoadingId) return;

                currentImage = mainImg;
                currentFileName = item.image.name.split('.')[0];
                // --- 新增：如果当前处于对比模式，同步更新右侧原图的 src ---
                if (displayMode === 'comparison' && comparisonRawImg) {
                    comparisonRawImg.src = currentImage.src;
                }
                resizeCanvas();

                // 4. 异步加载修复图
                if (item.repairImage) {
                    const rImg = new Image();
                    rImg.onload = () => {
                        if (myLoadId === currentLoadingId) {
                            currentRepairImage = rImg;
                            draw(); 
                        }
                    };
                    rImg.src = URL.createObjectURL(item.repairImage);
                }

                // 5. 异步加载蒙版数据 (mask_raw)
                if (item.mask_raw) {
                    loadMaskFromBase64(item.mask_raw).then(maskImg => {
                        if (myLoadId === currentLoadingId) {
                            currentMaskImage = maskImg;
                            if (maskImg) {
                                maskCanvas.width = maskImg.width;
                                maskCanvas.height = maskImg.height;
                                maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
                                maskCtx.drawImage(maskImg, 0, 0);
                            }
                            draw(); 
                        }
                    });
                }

                // 6. 异步加载涂鸦数据 (paint_raw)
                if (item.paint_raw) {
                    const pImg = new Image();
                    pImg.onload = () => {
                        if (myLoadId === currentLoadingId) {
                            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
                            paintCtx.drawImage(pImg, 0, 0);
                            draw();
                        }
                    };
                    pImg.src = item.paint_raw;
                }

                // 7. 完成加载任务
                resetSidebar();
                updateBatchNavUI();
                isPageLoading = false;
                draw();

            } catch (err) {
                console.error("加载失败:", err);
                isPageLoading = false;
            }
            // [核心新增] 在函数最后，确认新页面已就绪，重置脏检查标记
            isCanvasDirty = false; 
            isPageLoading = false;
            draw();
        }

        // 翻页导航
        // --- [关键] 翻页时保存数据 ---
        // --- [优化] 翻页时自动保存当前页修改 ---
        // --- [加固版] 翻页导航：增加边界检查与 UI 同步 ---
        function navigateFiles(dir) {
            if (currentFileIndex === -1 || matchedFiles.length === 0) return;

            if (!isPageLoading && matchedFiles[currentFileIndex]) {
                // 1. 文本数据比较轻量，可以每次都存
                matchedFiles[currentFileIndex].regions = JSON.parse(JSON.stringify(regions));

                // 2. [核心改进] 只有画布“脏了”，才执行沉重的图片转换
                if (isCanvasDirty) {
                    console.log("检测到画布变动，正在保存快照...");
                    matchedFiles[currentFileIndex].paint_raw = paintCanvas.toDataURL();
                    matchedFiles[currentFileIndex].mask_raw = maskCanvas.toDataURL('image/png').split(',')[1];
                }
            }

            const newIdx = currentFileIndex + dir;
            if (newIdx >= 0 && newIdx < matchedFiles.length) {

                loadFile(currentFileIndex);
            }
        }

        // --- 彻底修复：全量图片导出逻辑 ---
        // 彻底修复：全量图片导出逻辑 (支持每页蒙版合成)
        async function handleExport() {
            if (matchedFiles.length === 0) return alert("无项目数据");

            // --- 【补回当页保存逻辑】 ---
            syncMaskData(); // 同步蒙版
            if (matchedFiles[currentFileIndex]) {
                // 保存当前页的文本框数据
                matchedFiles[currentFileIndex].regions = JSON.parse(JSON.stringify(regions));
                // 保存当前页的涂鸦数据
                matchedFiles[currentFileIndex].paint_raw = paintCanvas.toDataURL();
            }

            const btn = document.getElementById('btnExport');
            const originalText = btn.innerText;
            btn.disabled = true;

            // 【修改点】不要在函数内部 const 了，直接用全局的
            const CONCURRENCY_LIMIT = globalConcurrencyLimit; // 并发渲染数，建议 4-8

            // 1. 定义单个任务的渲染逻辑（原图 -> 修复 -> 涂鸦 -> 文字）
            async function renderTask(item, index) {
                // 增加兼容性判定
                const CanvasClass = window.OffscreenCanvas || HTMLCanvasElement;
                let offCanvas;
                
                if (window.OffscreenCanvas) {
                    offCanvas = new OffscreenCanvas(currentImage.width, currentImage.height);
                } else {
                    offCanvas = document.createElement('canvas');
                    offCanvas.width = currentImage.width;
                    offCanvas.height = currentImage.height;
                }
                
                const offCtx = offCanvas.getContext('2d');

                // A. 底层原图
                const img = await loadImage(URL.createObjectURL(item.image));
                offCanvas.width = img.width;
                offCanvas.height = img.height;
                offCtx.drawImage(img, 0, 0);
                URL.revokeObjectURL(img.src);

                // B. 修复图 & 蒙版
                if (item.repairImage) {
                    const repairImg = await loadImage(URL.createObjectURL(item.repairImage));
                    if (ignoreMaskForRepair) {
                        offCtx.drawImage(repairImg, 0, 0);
                    } else {
                        const pageMask = await loadMaskFromBase64(item.mask_raw);
                        if (pageMask) {
                            const mCanvas = new OffscreenCanvas(offCanvas.width, offCanvas.height);
                            const mCtx = mCanvas.getContext('2d');
                            mCtx.drawImage(pageMask, 0, 0);
                            mCtx.globalCompositeOperation = 'source-atop';
                            mCtx.drawImage(repairImg, 0, 0);
                            offCtx.drawImage(mCanvas, 0, 0);
                        }
                    }
