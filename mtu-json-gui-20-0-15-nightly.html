        // 修改 MTU 中的 findRegionAt 函数
        function findRegionAt(pos) {
            // 【内置高精射线判定工具】：精准判定鼠标当前坐标是否落在任意扭曲的多边形纯内部
            const isPointIn3DPolygon = (px, py, pts) => {
                let inside = false;
                for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                    const xi = pts[i].x, yi = pts[i].y;
                    const xj = pts[j].x, yj = pts[j].y;
                    const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            };

            // 逆序遍历区域，确保选中最上层的元素
            for (let i = regions.length - 1; i >= 0; i--) {
                const r = regions[i];
                
                // =====================================================================
                // 【核心新增】：3D 透视框未激活状态下的【高精盲点捕获器】
                // 如果这个框开启了 3D 空间透视，直接退役死板的矩形框判定，改由空间 4 顶点多边形接管
                // =====================================================================
                if (r.isPerspective && r.points) {
                    if (isPointIn3DPolygon(pos.x, pos.y, r.points)) {
                        return { regionIdx: i, lineIdx: -1 }; // 🎯 成功盲点命中，直接返回该 3D 框的索引
                    }
                    // 💥 【关键熔断阻断点】：
                    // 如果是 3D 框但本次鼠标没点中它，直接 continue 跳过当前框。
                    // 严防死守，绝对不给它往下继续滑向老旧 r.box 矩形判定的机会，从根本上斩断与橙框的脐带！
                    continue; 
                }
                // =====================================================================
                
                if (r.lines) {
                    // 深入遍历区域内的每一个小框（行）
                    for (let j = 0; j < r.lines.length; j++) {

                // 备选方案：如果没点中小框，检查是否点中了大框范围（常规 2D 矩形框继续走这里）
                if (r.box) {
                    const [x1, y1, x2, y2] = r.box;
                    if (pos.x >= x1 && pos.x <= x2 && pos.y >= y1 && pos.y <= y2) {
                        return { regionIdx: i, lineIdx: -1 }; 
                    }
                }
            }
            return null;
        }

        /**
        * 根据旋转角度动态获取光标方向
        * @param {number} boxAngle - 大框当前角度

        /**
        * 修正版：根据旋转角度动态获取最接近法线的光标
        */
        function getTiltedCursor(boxAngle, handleIndex) {
            // 1. 定义每个手柄在 0 度时的绝对物理角度 (数学极坐标系)
            // 0:左上(-135°), 1:右上(-45°), 2:右下(45°), 3:左下(135°)
            // 4:顶中(-90°), 5:右中(0°), 6:底中(90°), 7:左中(180°)
            const handleAngles = [315, 45, 135, 225, 270, 0, 90, 180];
            
            // 2. 计算当前手柄在全局空间的总角度
            let totalAngle = (boxAngle + handleAngles[handleIndex]) % 360;
            if (totalAngle < 0) totalAngle += 360;
            
            // 3. 将 360 度划分为 8 个核心扇区 (每 45 度一个图标)
            // 修正了区间判断，使其更加平滑
            if ((totalAngle >= 337.5 || totalAngle < 22.5) || (totalAngle >= 157.5 && totalAngle < 202.5)) 
                return 'ew-resize';   // 水平向
            if ((totalAngle >= 22.5 && totalAngle < 67.5) || (totalAngle >= 202.5 && totalAngle < 247.5)) 
                return 'nwse-resize'; // 左上-右下向
            if ((totalAngle >= 67.5 && totalAngle < 112.5) || (totalAngle >= 247.5 && totalAngle < 292.5)) 
                return 'ns-resize';   // 垂直向
            if ((totalAngle >= 112.5 && totalAngle < 157.5) || (totalAngle >= 292.5 && totalAngle < 337.5)) 
                return 'nesw-resize'; // 右上-左下向
                
            return 'default';
        }
        function isHalfWidth(char) { const code = char.charCodeAt(0); return (code >= 0x0020 && code <= 0x007E) || (code >= 0xFF61 && code <= 0xFF9F); }

        // [新增] 将 JSON 中“扶正”的 lines 结合 angle 还原回原图上的旋转坐标
        function restoreLinesFromCenter(region) {
            // 如果没有 angle 或者 angle 为 0，就不需要还原
            if (!region.lines || region.lines.length === 0 || typeof region.angle !== 'number' || region.angle === 0) {
                return;
            }

            // 1. 计算所有点的几何中心 (Center)
            let totalX = 0, totalY = 0, count = 0;
            region.lines.forEach(line => {
                line.forEach(pt => {
                    totalX += pt[0];
                    totalY += pt[1];
                    count++;
                });
            });
            if (count === 0) return;
            const cx = totalX / count;
            const cy = totalY / count;

            // 2. 准备旋转参数 (正向旋转)
            // 对应 Python: math.radians(angle)
            const rad = region.angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);

            // 3. 对每个点执行旋转公式
            // 对应 Python: 
            // new_x = dx * cos - dy * sin
            // new_y = dx * sin + dy * cos
            const newLines = region.lines.map(line => {
                return line.map(pt => {
                    const dx = pt[0] - cx;
                    const dy = pt[1] - cy;
                    return [
                        dx * cos - dy * sin + cx,
                        dx * sin + dy * cos + cy
                    ];
                });
            });

            // 4. 更新 lines
            region.lines = newLines;
        }

            const isVertical = region.direction === 'v';
            // 【新增：定义所需变量】
            // 这里的逻辑与 drawSmartTranslation 保持一致：优先取区域自定义字体，否则取全局默认字体
            const effectiveFont = region.fontFamily || activeFontFamily;
            
            region.lines.forEach((polygon, lineIndex) => {
                const text = textSource[lineIndex] || "";
                if (!text) return;

                const p0 = polygon[0], p1 = polygon[1], p2 = polygon[2], p3 = polygon[3];
                // 计算框的平均宽和高
                const avgWidth = (Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) + Math.hypot(p2[0] - p3[0], p2[1] - p3[1])) / 2;
                const avgHeight = (Math.hypot(p3[0] - p0[0], p3[1] - p0[1]) + Math.hypot(p2[0] - p1[0], p2[1] - p1[1])) / 2;

                let totalUnits = 0;
                let suggestedSize = 0;

                if (isVertical) {
                    // --- 竖排逻辑 ---
                    // 处理 TCY（横排数字），将其视为 1 个单位高度 
                    const tcyProcessedText = text.replace(/([\d\uFF10-\uFF19]{2,4})/g, "T");
                    for (const char of tcyProcessedText) {
                        if (char === 'T') {
                            totalUnits += 1.0;
                        } else if (isHalfWidth(char) || CHARS_VERTICAL_COMPRESSION.includes(char) || CHARS_SYMMETRIC_HALF.includes(char)) {
                            totalUnits += 0.5; // 压缩标点或半角计 0.5
                        } else {
                            totalUnits += 1.0; // 普通全角计 1.0
                        }
                    }
                    suggestedSize = totalUnits > 0 ? (avgHeight / totalUnits) : avgHeight;
                // --- 替换原本的 else { for (const char of text) { ... } } 部分 ---
                }else {
                    // 横排像素感知算法
                    let totalPixelWidthAt100px = 0;
                    const testFS = 100; // 使用 100px 作为测量基准
                    ctx.font = `${testFS}px ${effectiveFont}`; // 确保使用当前设置的字体

                    for (const char of text) {
                        let charW;
                        // 这里的判定逻辑必须和 drawSmartTranslation 里的渲染逻辑完全一致
                        if (CHARS_SYMMETRIC_HALF.includes(char) || CHARS_PUNCT.includes(char)) {
                            charW = testFS * 0.5; // 模拟渲染时的强制半宽
                        } else if (isHalfWidth(char)) {
                            charW = ctx.measureText(char).width; 
                        } else {
                            charW = testFS; // 标准全角
                        }
                        
                        // 【关键修复】：把字间距也算进去 (转为 100px 下的对应比例)
                        // 假设 region.letter_spacing 是倍率 (如 0.1 表示 10% 字号)
                        const spacing = testFS * (region.letter_spacing || 0);
                        totalPixelWidthAt100px += charW + spacing;
                    }

                    // 根据测量出的 100px 总宽，反推最适合容器宽度的字号
                    suggestedSize = totalPixelWidthAt100px > 0 ? (testFS * (avgWidth / totalPixelWidthAt100px)) : avgWidth;
                }

                // 更新全局最小字号
                if (suggestedSize < minFontSize) {
                    minFontSize = suggestedSize;
                }
            });

            // 限制字号范围，防止出现极端数值
            // 修改后的逻辑：中间保持精度，最后一步变整数
            const result = minFontSize === Infinity ? 20 : minFontSize;
            // 限制在 5px 到 200px 之间，并进行四舍五入取整
            return Math.round(Math.max(5, Math.min(result, 200)));
        }

        // 计算单行文字的建议字号（复刻自 Angle 逻辑）
        function getSingleLineAutoFontSize(text, polygon, isVertical) {
            if (!text || text.length === 0) return 20;
            
            // 计算框的平均宽/高
            const p0 = polygon[0], p1 = polygon[1], p2 = polygon[2], p3 = polygon[3];
            const avgW = (Math.hypot(p1[0]-p0[0], p1[1]-p0[1]) + Math.hypot(p2[0]-p3[0], p2[1]-p3[1])) / 2;
            const avgH = (Math.hypot(p3[0]-p0[0], p3[1]-p0[1]) + Math.hypot(p2[0]-p1[0], p2[1]-p1[1])) / 2;

            if (isVertical) {
                // 竖排逻辑：高度 / 字符单位
                let units = 0;
                const tcyText = text.replace(/([\d\uFF10-\uFF19]{2,4})/g, "T");
                for (const char of tcyText) {
                    units += (char === 'T' || !isHalfWidth(char)) ? 1.0 : 0.5;
                }
                return units > 0 ? (avgH / units) : avgH;
            } else {
                // 横排逻辑：宽度 / 测量长度
                const tempFS = 100;
                ctx.font = `${tempFS}px "Noto Sans JP", sans-serif`;
                const mWidth = ctx.measureText(text).width;
                return mWidth > 0 ? (tempFS * (avgW / mWidth)) : avgH;
            }
        }
        function calculateAutoLineSpacing(region, fontSize) {
            if (!region.lines || region.lines.length < 2 || !fontSize) return 1.2;
            const n = region.lines.length;
            const isVertical = region.direction === 'v';
            const angle = region.angle || 0;

            // --- 使用你最熟悉的以前的中心算法 ---
            const getCenter = (poly) => {
                let cx = 0, cy = 0;
                poly.forEach(p => { cx += p[0]; cy += p[1]; });
                return { x: cx / 4, y: cy / 4 };
            };

            const c1 = getCenter(region.lines[0]);
            const cn = getCenter(region.lines[n - 1]);
            const dx = cn.x - c1.x;
            const dy = cn.y - c1.y;

            let totalDist = 0;

            // --- 逻辑整合：0度时等同于原版，有角度时自动投影 ---
            const rad = angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);

            if (isVertical) {
                // 旋转坐标系下的水平位移：dx' = dx*cos + dy*sin
                totalDist = Math.abs(dx * cos + dy * sin);
            } else {
                // 旋转坐标系下的垂直位移：dy' = -dx*sin + dy*cos
                totalDist = Math.abs(-dx * sin + dy * cos);
            }

            const avgDist = totalDist / (n - 1);
            const spacingMult = avgDist / fontSize;
            return Math.min(Math.max(parseFloat(spacingMult.toFixed(2)), 0.5), 3.0);
        }

        // 新增：自动计算并应用当前页文本框字号的众数

        /**
        * 归位功能：实现“斜”（智能探测）与“直”（强制转正）
        * @param {string} mode - 'slanted' (智能角度) 或 'straight' (强制 0 度)

        function recalibrateMode(mode) {

            if (mode === 'slanted') {
                // --- “斜”：重新计算最契合的倾斜角度 ---

                r.angle = null; 
                initRegionBox(r); // initRegionBox 会根据 lines 向量重新推算 angle 并重新计算 box
            } else {
                // --- “直”：强制转正为 0 度 ---
                // 1. 将角度强制设为 0
                r.angle = 0; 
                // 2. 在 0 度姿态下重新计算包围盒
                calculateBoxFromLines(r); 
            }

            // 视觉反馈：按钮成功提示
            const btn = event.currentTarget;

            btn.innerText = "OK";

        }
        // --- [增强版] 支持多选的删除函数 ---
        // 修改 deleteSelectedItems 函数
        window.deleteSelectedItems = function() {
            if (selectedRegions.length > 0) {
                // 批量删除选中的大框
                if (confirm(`确定要删除选中的 ${selectedRegions.length} 个区域吗？`)) {
                    // 必须从后往前删，防止索引偏移
                    selectedRegions.sort((a, b) => b - a).forEach(idx => {
                        regions.splice(idx, 1);
                    });
                    selectedRegions = [];
                    activeRegionIndex = -1;
                    resetSidebar(); //
                }
            } else {
                // 2. 多选删除逻辑：按 Region 分组处理
                const groups = {};
                selectedItems.forEach(item => {
                    if (!groups[item.regionIdx]) groups[item.regionIdx] = [];
                    groups[item.regionIdx].push(item.lineIdx);
                });

                // 【关键】对 regionIdx 进行降序排列，从索引最大的开始删，防止前面的索引偏移
                const sortedRegionIndices = Object.keys(groups).map(Number).sort((a, b) => b - a);

                sortedRegionIndices.forEach(rIdx => {
                    const r = regions[rIdx];
                    // 对当前区域内的小框索引也进行降序排列
                    const linesToDelete = groups[rIdx].sort((a, b) => b - a);

                    linesToDelete.forEach(lIdx => {
                        if (lIdx !== -1 && r.lines[lIdx]) {
                            r.lines.splice(lIdx, 1);
                            if (r.texts) r.texts.splice(lIdx, 1);
                        }
                    });

                    // 如果该区域的所有行都被删光了，或者点中的是大框本身(lineIdx为-1)，则删除整个区域
                    if (linesToDelete.includes(-1) || r.lines.length === 0) {
                        regions.splice(rIdx, 1);
                    } else {
                        initRegionBox(r); // 重新计算剩下行框的包围盒
                    }
                });
            }

            // 3. 清理状态并重绘
            selectedItems = [];
            activeRegionIndex = -1;
            activeLineIndex = -1;
            isShiftMultiSelect = false; // 关闭多选高亮标记
            resetSidebar(); 
            draw();
        };

        /**
        * 判断颜色是否接近白色 (带容差)
        * @param {string} hex - 16进制颜色值 (如 #ffffff)
        * @param {number} threshold - 容差阈值 (0-255)，越高越接近纯白，建议 220
        */
        function isNearWhite(hex, threshold = 220) {
            if (!hex || !hex.startsWith('#')) return false;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            // 如果红绿蓝三个分量都高于阈值，则认为是白色系
            return r > threshold && g > threshold && b > threshold;
        }

        /**

        async function detectSystemFonts() {
            // 检查浏览器是否支持该 API (目前 Chrome, Edge 支持)
            if (!('queryLocalFonts' in window)) {
                alert("当前浏览器不支持自动检测系统字体，请尝试使用 Chrome 或 Edge。");
                return;
            }

            try {
                // 请求权限并获取字体列表
                const fonts = await window.queryLocalFonts();
                const fontSelect = document.getElementById('fontSelect');

                // 使用 Set 去重，因为一个字体家族通常包含很多变体 (Bold, Italic 等)
                const families = [...new Set(fonts.map(f => f.family))].sort();

                // 创建一个分组并添加到下拉框
                const group = document.createElement('optgroup');
                group.label = "--- 系统发现的字体 ---";

                families.forEach(family => {
                    const option = document.createElement('option');
                    // 格式化为 CSS 属性值
                    option.value = `"${family}", sans-serif`;
                    option.textContent = family;
                    group.appendChild(option);
                });

                fontSelect.appendChild(group);
                
                // 视觉反馈
                const btn = event.currentTarget;
                btn.innerText = "OK";
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                console.log(`成功载入 ${families.length} 个系统字体`);

            } catch (err) {
                console.error("检测字体失败:", err);
                if (err.name === 'NotAllowedError') {
                    alert("用户拒绝了字体访问权限。");
                }
            }
        }

        // 5. 别忘了把之前的还原函数加上
        function restoreLinesFromCenter(region) {
            if (!region.lines || region.lines.length === 0 || typeof region.angle !== 'number' || region.angle === 0) return;
            let totalX = 0, totalY = 0, count = 0;
            region.lines.forEach(line => { line.forEach(pt => { totalX += pt[0]; totalY += pt[1]; count++; }); });
            if (count === 0) return;
            const cx = totalX / count; const cy = totalY / count;
            const rad = region.angle * Math.PI / 180; const cos = Math.cos(rad); const sin = Math.sin(rad);
            const newLines = region.lines.map(line => {
                return line.map(pt => {
                    const dx = pt[0] - cx; const dy = pt[1] - cy;
                    return [ dx * cos - dy * sin + cx, dx * sin + dy * cos + cy ];
                });
            });
            region.lines = newLines;
        }

        function syncMtuScrollbars() {
            if (!currentImage) return;
            const parent = getActiveCanvasContainer();
            if (!parent) return;

            let trackV = document.getElementById('mtu-scroll-v');
            let trackH = document.getElementById('mtu-scroll-h');

            // 1. 初始化滚动条 DOM 及拖拽行为
            if (!trackV) {
                trackV = document.createElement('div'); trackV.id = 'mtu-scroll-v';
                trackV.style = 'position:absolute; right:4px; top:4px; bottom:4px; width:8px; background:rgba(31,41,55,0.2); border-radius:4px; z-index:40; display:none;';
                const thumbV = document.createElement('div'); thumbV.id = 'mtu-scroll-v-thumb';
                thumbV.style = 'width:100%; background:#4b5563; border-radius:4px; cursor:pointer; position:absolute; transition:background 0.15s;';
                trackV.appendChild(thumbV);

                trackH = document.createElement('div'); trackH.id = 'mtu-scroll-h';
                trackH.style = 'position:absolute; left:4px; bottom:4px; right:4px; height:8px; background:rgba(31,41,55,0.2); border-radius:4px; z-index:40; display:none;';
                const thumbH = document.createElement('div'); thumbH.id = 'mtu-scroll-h-thumb';
                thumbH.style = 'height:100%; background:#4b5563; border-radius:4px; cursor:pointer; position:absolute; transition:background 0.15s;';
                trackH.appendChild(thumbH);

                setupScrollbarDrag(thumbV, 'v');
                setupScrollbarDrag(thumbH, 'h');
            }

            // 2. 动态维护分屏切换下的父子隶属关系
            if (trackV.parentElement !== parent) parent.appendChild(trackV);
            if (trackH.parentElement !== parent) parent.appendChild(trackH);

            const vW = parent.clientWidth; const vH = parent.clientHeight;
            const imgW = currentImage.width * viewState.scale; const imgH = currentImage.height * viewState.scale;

            // 计算跨越画布两端的绝对边界极值
            const minX = Math.min(0, viewState.x); const maxX = Math.max(vW, viewState.x + imgW);
            const minY = Math.min(0, viewState.y); const maxY = Math.max(vH, viewState.y + imgH);
            const totalW = maxX - minX; const totalH = maxY - minY;

            // 3. 控制显隐（若溢出或发生偏移则亮起）
            const showV = totalH > vH + 1; const showH = totalW > vW + 1;
            trackV.style.display = showV ? 'block' : 'none';
            trackH.style.display = showH ? 'block' : 'none';

            // 4. 精准像素映射
            if (showV) {
                const thumbHeight = Math.max(24, (vH / totalH) * vH);
                const thumbTop = ((0 - minY) / totalH) * (vH - thumbHeight);
                document.getElementById('mtu-scroll-v-thumb').style.height = `${thumbHeight}px`;
                document.getElementById('mtu-scroll-v-thumb').style.top = `${thumbTop}px`;
            }
            if (showH) {
                const thumbWidth = Math.max(24, (vW / totalW) * vW);
                const thumbLeft = ((0 - minX) / totalW) * (vW - thumbWidth);
                document.getElementById('mtu-scroll-h-thumb').style.width = `${thumbWidth}px`;
                document.getElementById('mtu-scroll-h-thumb').style.left = `${thumbLeft}px`;
            }
        }

        function setupScrollbarDrag(thumb, orientation) {
            let isDragging = false; let startMousePos = 0; let startContentPos = 0;

            thumb.onmousedown = (e) => {

                isDragging = true;
                thumb.style.background = '#6b7280';
                startMousePos = orientation === 'v' ? e.clientY : e.clientX;
                startContentPos = orientation === 'v' ? viewState.y : viewState.x;

                const onMouseMove = (moveEvent) => {
                    if (!isDragging) return;
                    const delta = (orientation === 'v' ? moveEvent.clientY : moveEvent.clientX) - startMousePos;
                    const parent = getActiveCanvasContainer();
                    const imgW = currentImage.width * viewState.scale; const imgH = currentImage.height * viewState.scale;
                    
                    const minX = Math.min(0, viewState.x); const maxX = Math.max(parent.clientWidth, viewState.x + imgW);
                    const minY = Math.min(0, viewState.y); const maxY = Math.max(parent.clientHeight, viewState.y + imgH);

                    if (orientation === 'v') {
                        const trackRatio = (maxY - minY) / parent.clientHeight;
                        viewState.y = startContentPos - (delta * trackRatio);
                    } else {
                        const trackRatio = (maxX - minX) / parent.clientWidth;
                        viewState.x = startContentPos - (delta * trackRatio);
                    }
                    updateCanvasTransform();
                    draw();
                };

                const onMouseUp = () => {
                    isDragging = false; thumb.style.background = '#4b5563';
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            };
            
            thumb.onmouseenter = () => { if(!isDragging) thumb.style.background = '#5a6270'; };
            thumb.onmouseleave = () => { if(!isDragging) thumb.style.background = '#4b5563'; };
        }
        // --- 脚本末尾的初始化与检测逻辑 ---

        // 1. [新增] 自动检测设备内存并调整并发
        if (navigator.deviceMemory) {
            console.log(`系统报告内存大约为: ${navigator.deviceMemory} GB`);
            if (navigator.deviceMemory <= 4) {
                // 针对内存低下设备
                globalConcurrencyLimit = 1;
                if (concurrencyInput) {
                    concurrencyInput.value = 1;
                    // 同时更新一下那个小圆灯的颜色（可选）
                    const concurrencyWarn = document.getElementById('concurrencyWarn');
                    if (concurrencyWarn) {
                        concurrencyWarn.className = "text-[10px] text-green-500";
                        concurrencyWarn.title = "已根据您的设备自动选择最稳并发数";
                    }
                }
                console.log("检测到低内存设备，已自动限制并发为 1 以防崩溃");
            }
        }

        resetSidebar();
    </script>
