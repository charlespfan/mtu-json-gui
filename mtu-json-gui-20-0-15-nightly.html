<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTU 嵌字编辑器 (v20.0.15)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/client-zip@2.3.0/worker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/streamsaver@2.0.6/StreamSaver.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background-color: #111827; color: #e5e7eb; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .sidebar-item { 
            transition: all 0.1s; 
            border: 2px solid transparent; 
            margin-bottom: 4px;
        }
        .sidebar-item:hover { background-color: #374151; }
        .sidebar-item.active { 
            background-color: #1f2937; 
            border: 2px solid #ef4444; 
            box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.15); 
        }
        
        #canvasContainer { 
            display: flex; 
            background-image: radial-gradient(#374151 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow: hidden; /* <--- 修改这里：去掉 auto，改为 hidden */
            position: relative;
            cursor: grab; /* 默认手型 */
        }
        canvas { 
            /* 新增：禁用浏览器层面的缩放平滑 */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            /* 新增：绝对定位，确保 (0,0) 坐标严丝合缝 */
            position: absolute;
            top: 0;
            left: 0;
            
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
            display: block;
            transform-origin: 0 0; 
        }

        .color-swatch-btn {
            width: 24px; height: 24px; border-radius: 4px; border: 2px solid #4b5563; cursor: pointer; transition: transform 0.1s, border-color 0.1s;
        }
        .color-swatch-btn:hover { transform: scale(1.1); border-color: #9ca3af; }

        .modal-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1f2937; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); border: 1px solid #374151; }
        
        .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .confirm-box { background: #1f2937; border: 1px solid #4b5563; padding: 20px; border-radius: 8px; text-align: center; width: 300px; }

        .rt-btn {
            background-color: #374151; color: #d1d5db; border: 1px solid #4b5563; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.1s;
        }
        .rt-btn:hover { background-color: #4b5563; color: white; }
        .rt-btn:active { transform: translateY(1px); }
        /* 针对右侧边栏按钮的微调 */
        .w-12 .rt-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 14px;
            border-radius: 6px;
        }

        /* 悬停效果增强 */
        .w-12 .rt-btn:hover {
            transform: scale(1.05);
            background-color: #4b5563;
        }

        /* 蒙版工具专用的激活状态 */
        .rt-btn.mask-active {
            background-color: #ef4444 !important; /* 红色 bg-red-600 */
            color: white !important;
            border-color: #f87171 !important; /* 亮红边框 */
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); /* 增加一点发光感 */
        }

        /* 激活状态下的悬停：变亮而不是变灰 */
        .rt-btn.mask-active:hover {
            background-color: #f87171 !important; /* 亮红色 bg-red-400 */
            transform: scale(1.1);
        }

        #comparisonRawImg {
            position: absolute;
            top: 0;
            left: 0;
            max-width: none !important; /* 防止被父容器强制缩小 */
            max-height: none !important;
            transform-origin: 0 0;
            image-rendering: pixelated; /* 保持像素级清晰 */
        }

        /* 确保分屏容器隐藏溢出 */
        #leftCompare, #rightCompare {
            overflow: hidden;
            position: relative;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="loadingMask" class="modal-mask" style="flex-direction: column; color: white;">
        <div class="text-xl font-bold mb-2">正在加载字体...</div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="confirm-overlay">
        <div class="confirm-box">
            <h3 class="text-white font-bold text-lg mb-4">确认全局操作</h3>
            <p id="confirmMessage" class="text-gray-300 text-sm mb-6">...</p>
            <div class="flex justify-center gap-4">
                <button id="btnConfirmNo" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded text-white text-sm">
                    取消（不进行修改）
                </button>
                <button id="btnConfirmYes" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-white text-sm font-bold">
                    确定全部应用
                </button>
            </div>
        </div>
    </div>


    <!-- Top Toolbar -->
    

    <div id="topToolbar" class="h-16 bg-gray-900 border-b border-gray-700 flex items-center px-4 gap-4 flex-none z-10 shadow-md overflow-x-auto overflow-y-hidden">

        <div class="flex gap-2 items-center flex-shrink-0">
            <div class="flex flex-col gap-1">
                <label class="bg-green-600 hover:bg-green-500 rounded px-2 py-0.5 cursor-pointer text-white text-[10px] font-bold">
                    单原图 <input type="file" id="imageInput" accept="image/*" class="hidden">
                </label>
                <label class="bg-teal-600 hover:bg-teal-500 rounded px-2 py-0.5 cursor-pointer text-white text-[10px] font-bold">
                    单修复图 <input type="file" id="repairInput" accept="image/*" class="hidden">
                </label>
                <label class="bg-blue-600 hover:bg-blue-500 rounded px-2 py-0.5 cursor-pointer text-white text-[10px] font-bold">
                    单 JSON <input type="file" id="jsonInput" accept=".json" class="hidden">
                </label>
            </div>
            
            <div class="w-px h-8 bg-gray-700 mx-1"></div>

            <div class="flex flex-col gap-1">
                <label class="bg-purple-600 hover:bg-purple-500 rounded px-2 py-0.5 cursor-pointer text-white text-[10px] font-bold">
                    原图文件夹 <input type="file" id="imageFolderInput" webkitdirectory directory multiple class="hidden">
                </label>
                <label class="bg-emerald-600 hover:bg-emerald-500 rounded px-2 py-0.5 cursor-pointer text-white text-[10px] font-bold">
                    修复图文件夹 <input type="file" id="repairFolderInput" webkitdirectory directory multiple class="hidden">
                </label>
                <label class="bg-indigo-600 hover:bg-indigo-500 rounded px-2 py-0.5 cursor-pointer text-white text-[10px] font-bold">
                    JSON文件夹 <input type="file" id="jsonFolderInput" webkitdirectory directory multiple class="hidden">
                </label>
            </div>
            <label class="bg-red-700 hover:bg-red-600 rounded px-2 py-0.5 cursor-pointer text-white text-[10px] font-bold shadow-lg">
                <p>一次性</p>
                <p>批量导入</p>
                <p>（推荐）</p>
                <input type="file" id="mtuProjectInput" webkitdirectory directory multiple class="hidden">
            </label>
            
        </div>

        <div class="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700 shadow-sm flex-shrink-0">
            <div class="flex flex-col gap-1">
                <button id="btnExportSingle" class="px-2 py-1 bg-teal-600 hover:bg-teal-500 text-white text-xs rounded"><p>导出</p><p>单图</p></button>
            </div>
            <div class="flex flex-col gap-1">
                <button id="btnExportDir" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 text-white text-xs rounded">批量导出到文件夹</button>
                <button id="btnExport" class="px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded">批量导出为压缩包</button>
            </div>
            <div class="flex flex-col items-center bg-gray-900/50 px-2 py-1 rounded border border-gray-700 ml-2">
                <span class="text-[9px] text-gray-400 uppercase font-bold">并发渲染数</span>
                <div class="flex items-center gap-1">
                    <input type="number" id="concurrencyInput" min="1" max="10" value="1" 
                        class="w-10 bg-gray-800 border border-gray-600 rounded text-center text-xs text-orange-400 h-5 outline-none focus:border-orange-500"
                        title="建议：无显卡设为1-2，有显卡设为4+">
                    <span id="concurrencyWarn" class="text-[10px] text-green-500" title="内存状态预估">●</span>
                </div>
            </div>
            <div class="flex flex-col gap-1">
                <button onclick="exportCurrentJson()" class="px-2 py-1 bg-amber-600 hover:bg-amber-500 text-white text-xs rounded">导出当前JSON</button>
                <button onclick="exportAllJsons()" class="px-2 py-1 bg-orange-600 hover:bg-orange-500 text-white text-xs rounded">批量导出JSON</button>
            </div>

            <div class="w-px h-4 bg-gray-600"></div>
            
            <div class="flex items-center gap-3 bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
                <label class="checkbox-label text-xs text-orange-400 flex items-center gap-1 cursor-pointer" title="全图修复：不理会蒙版数据，强制显示完整的修复图">
                    <input type="checkbox" id="ignoreMaskForRepairCb" class="accent-orange-600">全图修复
                </label>
                <label class="checkbox-label text-xs text-gray-300 flex items-center gap-1 cursor-pointer">
                    <input type="checkbox" id="showBlocksCb" class="accent-blue-600" checked>总框
                </label>
                <label class="checkbox-label text-xs text-gray-300 flex items-center gap-1 cursor-pointer">
                    <input type="checkbox" id="showLinesCb" class="accent-green-600" checked>行框
                </label>
                <label class="checkbox-label text-xs text-gray-300 flex items-center gap-1 cursor-pointer">
                    <input type="checkbox" id="showTextCb" class="accent-yellow-600" checked>文字
                </label>
                <label class="checkbox-label text-xs text-gray-300 flex items-center gap-1 cursor-pointer">
                    <input type="checkbox" id="showMaskCb" class="accent-red-600">显蒙
                </label>
                <label class="checkbox-label text-xs text-gray-300 flex items-center gap-1 cursor-pointer">
                    <input type="checkbox" id="showPaintMaskCb" class="accent-blue-600">显涂
                </label>
                <div class="flex flex-col items-center ml-2 border-l border-gray-700 pl-2">
                    <span class="text-[9px] text-gray-400">修复层透明度</span>
                    <div class="flex items-center gap-2">
                        <input type="range" id="repairOpacityRange" min="0" max="1" step="0.01" value="1" 
                            class="w-16 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        <span id="repairOpacityValue" class="text-[9px] text-gray-500 w-6">100%</span>
                    </div>
                </div>
                <div class="flex flex-col items-center ml-2 border-l border-gray-700 pl-2">
                    <span class="text-[9px] text-gray-400">涂鸦层透明度</span>
                    <div class="flex items-center gap-2">
                        <input type="range" id="paintOpacityRange" min="0" max="1" step="0.01" value="1" 
                            class="w-16 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-green-600">
                        <span id="paintOpacityValue" class="text-[9px] text-gray-500 w-6">100%</span>
                    </div>
                </div>
            </div>
            <div class="w-px h-4 bg-gray-600"></div>
            <div class="flex bg-gray-700 rounded p-0.5">
                <button id="btnTrans" class="px-2 py-0.5 text-xs rounded bg-blue-600 text-white">译</button>
                <button id="btnOriginal" class="px-2 py-0.5 text-xs rounded text-gray-300">原</button>
                <button id="btnCompare" class="px-2 py-0.5 text-xs rounded text-gray-300">对</button>
            </div>
            <div class="w-px h-4 bg-gray-600"></div>
            <div class="flex bg-gray-700 rounded p-0.5" id="viewModeGroup">
                <button id="btnViewAuto" onclick="setViewFitMode('auto')" class="px-2 py-0.5 text-xs rounded bg-blue-600 text-white font-bold" title="全屏自适应">适屏</button>
                <button id="btnViewWidth" onclick="setViewFitMode('width')" class="px-2 py-0.5 text-xs rounded text-gray-300 font-bold" title="宽度自适应">适宽</button>
            </div>
        </div>
        
        <div class="flex-grow"></div>

        <div id="batchNav" class="hidden items-center gap-1 bg-gray-800 px-2 py-1 rounded-lg border border-gray-700 ml-2">
            <button id="btnLastPage" onclick="jumpToPage(matchedFiles.length - 1)" class="p-1 hover:bg-gray-700 rounded text-white disabled:opacity-30 disabled:cursor-not-allowed" title="最后一页">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7M20 19l-7-7 7-7"/></svg>
            </button>
            <button id="btnNextPage" onclick="navigateFiles(1)" class="p-1 hover:bg-gray-700 rounded text-white disabled:opacity-30 disabled:cursor-not-allowed" title="下一页 (←)">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            
            <div class="flex items-center gap-1 mx-1">
                <input type="number" id="pageInput" title="输入数字按回车即可跳转" class="w-12 bg-gray-900 border border-gray-600 rounded text-center text-xs text-white h-6">
                <span id="fileCounterTotal" class="text-[10px] text-gray-400">/ 0</span>
            </div>

            <button id="btnPrevPage" onclick="navigateFiles(-1)" class="p-1 hover:bg-gray-700 rounded text-white disabled:opacity-30 disabled:cursor-not-allowed" title="上一页 (→)">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
            <button id="btnFirstPage" onclick="jumpToPage(0)" class="p-1 hover:bg-gray-700 rounded text-white disabled:opacity-30 disabled:cursor-not-allowed" title="第一页">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M4 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- Style Controls -->
        <div class="flex items-center gap-3 bg-gray-800 p-1.5 rounded-lg border border-gray-700 flex-shrink-0">
             <div class="flex flex-col">
                <span class="text-[9px] text-gray-400 uppercase tracking-wider">字体</span>
                <div class="flex gap-1">
                    <select id="fontSelect" class="bg-gray-900 border border-gray-600 text-white text-xs rounded px-1 py-0.5 outline-none focus:border-blue-500 w-24 h-6">
                        <option value='"Noto Sans SC", sans-serif'>思源黑体</option>
                        <option value='"Source Han Sans SC", "Source Han Sans CN", "Noto Sans SC", sans-serif'>思源黑体 (本地)</option>
                        <option value='"Microsoft YaHei", sans-serif'>微软雅黑</option>
                        <option value='"SimHei", sans-serif'>黑体</option>
                        <option value='"KaiTi", serif'>楷体</option>
                        <option value="custom">手动...</option>
                    </select>
                    <button onclick="detectSystemFonts()" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] rounded px-1.5 flex items-center h-6" title="检测系统所有字体">
                        检
                    </button>
                    <label class="bg-purple-600 hover:bg-purple-500 text-white text-[10px] rounded px-2 flex items-center cursor-pointer" title="加载本地字体文件，可多选支持.ttf .otf .woff">
                        <span>+</span><input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.ttc" class="hidden" multiple>
                    </label>
                </div>
            </div>
            <input type="text" id="customFontInput" class="hidden bg-gray-900 border border-gray-600 text-white text-xs rounded px-2 py-0.5 w-20 h-6" placeholder="字体名">

            <div class="flex flex-col">
                <span class="text-[9px] text-gray-400 uppercase tracking-wider font-bold text-yellow-500">字号</span>
                <div class="flex gap-1">
                    <input type="number" id="fontSizeInput" step="1" title="快捷键: [ 和 ] 调节字号大小" class="bg-gray-900 border border-gray-600 text-white text-xs rounded px-1 py-0.5 w-12 h-6 text-center focus:border-yellow-500 transition-colors" placeholder="-">
                    <button onclick="applyAutoFontSize()" class="bg-yellow-600 hover:bg-yellow-500 text-white text-[10px] rounded px-1 flex items-center justify-center border border-yellow-700 w-6 h-6" title="单页自动字号">
                        自
                    </button>
                    <button onclick="applyModeFontSize()" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] rounded px-1 flex items-center justify-center border border-blue-700 w-6 h-6" title="自动提取并应用当前页字号众数">
                        众
                    </button>
                    <button id="btnForceFontSize" class="bg-gray-700 hover:bg-yellow-600 text-white rounded px-1 flex items-center justify-center border border-gray-600 transition-colors w-6 h-6" title="强制应用当前字号到全书所有页">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                    </button>
                  
                </div>
            </div>
            <div class="flex flex-col mx-1">
                <span class="text-[9px] text-gray-400 uppercase tracking-wider font-bold text-blue-400">字重</span>
                <select id="fontWeightSelect" class="bg-gray-900 border border-gray-600 text-white text-xs rounded px-1 py-0.5 outline-none focus:border-blue-500 h-6 w-16">
                    <option value="400" selected>常规</option>
                    <option value="700">粗体</option> <option value="900">特粗</option>
                    <option value="100">细体</option>
                </select>
            </div>

            <div class="flex flex-col">
                <span class="text-[9px] text-gray-400 uppercase tracking-wider" title="对齐方式">对齐方式</span>
                <div class="flex gap-1">
                    <select id="textAlignSelect" class="bg-gray-900 border border-gray-600 text-white text-xs rounded px-1 py-0.5 outline-none focus:border-blue-500 h-6 w-20">
                        <option value="block-center-top" selected>块居中</option>
                        <option value="block-top">块首对齐</option>
                        <option value="block-bottom">块尾对齐</option>
                        <option value="column-center">单列居中</option>
                    </select>
                    <button id="btnForceAlign" class="bg-gray-700 hover:bg-blue-600 text-white rounded px-1 flex items-center justify-center border border-gray-600 transition-colors w-6 h-6" title="强制应用当前排版到所有框">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex flex-col">
                <span class="text-[9px] text-gray-400 uppercase tracking-wider" title="标点排版模式">标点模式</span>
                <div class="flex gap-1">
                    <select id="punctAlignSelect" class="bg-gray-900 border border-gray-600 text-white text-xs rounded px-1 py-0.5 outline-none focus:border-blue-500 h-6 w-24">
                        <option value="half">紧凑半格 (中日)</option>
                        <option value="full">疏朗全格 (中日)</option>
                        <option value="center">几何居中 (港台)</option>
                    </select>
                    <button id="btnForcePunctAlign" class="bg-gray-700 hover:bg-indigo-600 text-white rounded px-1 flex items-center justify-center border border-gray-600 transition-colors w-6 h-6" title="强制应用当前标点模式到全书">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="alignScopeDialog" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
                <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl shadow-2xl w-96">
                    <h3 class="text-white font-bold text-lg mb-2">应用排版样式</h3>
                    <p class="text-gray-400 text-sm mb-6">将当前选中框的字体、大小、颜色、间距等样式应用到：</p>
                    
                    <div class="space-y-3">
                        <button onclick="executeAlign('page')" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold transition-colors">

        function handleStampErase(pos) {
            if (!currentImage) return;

            // 计算当前释放位置在底图上影响的绝对像素包围框
            const targetLeft = Math.floor(pos.x - r);

            const targetRight = Math.ceil(pos.x + r);
            const targetBottom = Math.ceil(pos.y + r);

            const width = targetRight - targetLeft;
            const height = targetBottom - targetTop;
            if (width <= 0 || height <= 0) return;

            // 创建轻量级内存离屏画布

            maskCanvas.height = height;

            const data = maskImgData.data;

            // 遍历物理像素格点中心，严格按圆方程计算出 100% 硬度的擦除饼图
            for (let y = targetTop; y < targetBottom; y++) {
                for (let x = targetLeft; x < targetRight; x++) {
                    const dist_sq = Math.pow((x + 0.5) - pos.x, 2) + Math.pow((y + 0.5) - pos.y, 2);

                        const localX = x - targetLeft;
                        const localY = y - targetTop;
                        const idx = (localY * width + localX) * 4;
                        // 写入 100% 不透明的色块，用于作为裁切区域
                        data[idx+3] = 255; 
                    }
                }

            // 1像素单点容错保底逻辑

            for (let i = 3; i < data.length; i += 4) {

            }

                const localX = Math.floor(pos.x) - targetLeft;
                const localY = Math.floor(pos.y) - targetTop;
                if (localX >= 0 && localX < width && localY >= 0 && localY < height) {
                    const idx = (localY * width + localX) * 4;
                    data[idx+3] = 255;
                }
            }
            maskCtx.putImageData(maskImgData, 0, 0);

        // 【核心数学引擎】通过 4 个不规则顶点坐标，反推解出 CSS3 所需的 matrix3d 16位矩阵

            // 7. 预乘 Alpha 双线性采样器（内部宽边界完美对齐 flatW）
            const sampleBilinear = (uSrc, vSrc) => {
                const u0 = Math.floor(uSrc);
                const v0 = Math.floor(vSrc);
                const u1 = Math.min(u0 + 1, flatW - 1);
                const v1 = Math.min(v0 + 1, flatH - 1);

                const wu1 = uSrc - u0; const wu0 = 1 - wu1;
                const wv1 = vSrc - v0; const wv0 = 1 - wv1;

                const idx00 = (v0 * flatW + u0) * 4;
                const idx10 = (v0 * flatW + u1) * 4;
                const idx01 = (v1 * flatW + u0) * 4;
                const idx11 = (v1 * flatW + u1) * 4;

                const r00 = sData[idx00], g00 = sData[idx00+1], b00 = sData[idx00+2], a00 = sData[idx00+3];
                const r10 = sData[idx10], g10 = sData[idx10+1], b10 = sData[idx10+2], a10 = sData[idx10+3];
                const r01 = sData[idx01], g01 = sData[idx01+1], b01 = sData[idx01+2], a01 = sData[idx01+3];
                const r11 = sData[idx11], g11 = sData[idx11+1], b11 = sData[idx11+2], a11 = sData[idx11+3];

                const w00 = wu0 * wv0; const w10 = wu1 * wv0;
                const w01 = wu0 * wv1; const w11 = wu1 * wv1;

                const blendedA = w00 * a00 + w10 * a10 + w01 * a01 + w11 * a11;
                if (blendedA <= 0) return { r: 0, g: 0, b: 0, a: 0 };

                const blendedR = w00 * r00 * a00 + w10 * r10 * a10 + w01 * r01 * a01 + w11 * r11 * a11;
                const blendedG = w00 * g00 * a00 + w10 * g10 * a10 + w01 * g01 * a01 + w11 * g11 * a11;
                const blendedB = w00 * b00 * a00 + w10 * b10 * a10 + w01 * b01 * a01 + w11 * b11 * a11;

                return {
                    r: blendedR / blendedA,
                    g: blendedG / blendedA,
                    b: blendedB / blendedA,
                    a: blendedA
                };
            };

            // 8. 逆向像素扫描
            for (let y = minY; y < maxY; y++) {
                for (let x = minX; x < maxX; x++) {
                    const wSpace = inv6 * x + inv7 * y + inv8;
                    if (wSpace <= 0.0001) continue;

                    const u = ((inv0 * x + inv1 * y + inv2) / wSpace) * origW;
                    const v = ((inv3 * x + inv4 * y + inv5) / wSpace) * origH;

                    if (u >= -P && u < origW + P && v >= -P && v < origH + P) {
                        // 💥 【关键修改】：反向索引采样时，映射点必须乘以 SCALE 缩放系数！
                        // 从而强迫目标像素精准咬合住 4 倍密度底稿里饱满的高清矢量细节。
                        const color = sampleBilinear((u + P) * SCALE, (v + P) * SCALE);
                        const dIdx = ((y - minY) * destW + (x - minX)) * 4;

                        dData[dIdx]     = color.r;
                        dData[dIdx + 1] = color.g;
                        dData[dIdx + 2] = color.b;
                        dData[dIdx + 3] = color.a;
                    }
                }
            }

            // 9. 图层贴纸融合
            const stampCanvas = document.createElement('canvas');
            stampCanvas.width = destW;
            stampCanvas.height = destH;
            stampCanvas.getContext('2d').putImageData(destImgData, 0, 0);

            targetCtx.drawImage(stampCanvas, minX, minY);
        }
        // 绑定形排组件的监听器
        document.getElementById('enableShapeWrapCb').addEventListener('change', (e) => {
            enableShapeWrap = e.target.checked;

            if (!isNaN(val) && val >= 1 && val <= 255) floodTolerance = val;

        document.getElementById('floodRadiusInput').addEventListener('input', (e) => {

        window.addEventListener('beforeunload', (e) => {

        /**
         * 将当前画布上的涂鸦和蒙版数据持久化到内存数组中
         * 防止因为 resizeCanvas() 导致的像素丢失
         */
        function persistCanvasData() {
            if (currentFileIndex === -1 || !matchedFiles[currentFileIndex]) return;

            // 如果画布是“脏”的（有改动），则保存快照
            if (isCanvasDirty) {

        if (paintOpacityRange) {
            paintOpacityRange.addEventListener('input', (e) => {

        // 绑定监听器
        document.getElementById('firstLineExpandCb').addEventListener('change', (e) => {
            enableFirstLineExpand = e.target.checked;
        });
        autoFillBtnRight.onclick = async () => {
            if (matchedFiles.length === 0) return alert("请先批量导入项目文件夹！");
            
            // 1. 开始批量处理前，先把当前页你改过的字和涂鸦存好
            saveCurrentStateToMemory();
            
            const originalText = autoFillBtnRight.innerText;
            autoFillBtnRight.disabled = true;

            const THRESHOLD = 0.7; 
            // 【核心联动】：完美对接并接受顶栏配置的并发渲染数数量
            const CONCURRENCY_LIMIT = globalConcurrencyLimit; 

            // 2. 封装单个页面的自动填充子任务（从外部独立解耦出来）
            async function processPageTask(item, index) {
                // 并发核心：在任务内部为每页独立创建私有画布，互不干扰
                const procCanvas = document.createElement('canvas');
                const procCtx = procCanvas.getContext('2d');
                const analysisCanvas = document.createElement('canvas');
                const analysisCtx = analysisCanvas.getContext('2d');

                const img = await loadImage(URL.createObjectURL(item.image));
                analysisCanvas.width = img.width; 
                analysisCanvas.height = img.height;
                analysisCtx.drawImage(img, 0, 0);
                URL.revokeObjectURL(img.src);

                // [核心优化] 一页只向 GPU 要一次全图数据
                const pageImageData = analysisCtx.getImageData(0, 0, img.width, img.height);

                procCanvas.width = img.width; 
                procCanvas.height = img.height;
                procCtx.clearRect(0, 0, procCanvas.width, procCanvas.height);
                
                if (item.paint_raw) {
                    const oldPaint = await loadImage(item.paint_raw);
                    if (oldPaint) procCtx.drawImage(oldPaint, 0, 0);
                }

                let pageChanged = false;
                let qualifiedLines = []; // 新增：用来收集本页所有满足填色条件的行框坐标

                // 私有的圆角/直角裁剪渲染逻辑
                // 升级 drawAndClip：追加 forceMaxRadius 参数用于支撑填落的强制最大圆角
                const drawAndClip = (regionLines, color, offset = {x: 0, y: 0}, skipFirst = false, forceMaxRadius = false) => {
                    procCtx.save();
                    procCtx.globalCompositeOperation = 'source-over';
                    procCtx.fillStyle = color;
                    
                    regionLines.forEach((line, idx) => {
                        if (skipFirst && idx === 0) return; // 跳过首行偏移
                        
                        // 安全读取外部开关（若未定义则默认为 false）
                        const isRoundEnabled = (typeof enableRoundedRect !== 'undefined') ? enableRoundedRect : false;
                        const rRadius = (typeof roundedRectRadius !== 'undefined') ? roundedRectRadius : 8;

                        // 条件：如果全局开启了“圆角”，或者当前属于“填落”的强制圆角模式
                        if (isRoundEnabled || forceMaxRadius) {
                            const d1 = Math.hypot(line[1][0] - line[0][0], line[1][1] - line[0][1]);
                            const d2 = Math.hypot(line[3][0] - line[0][0], line[3][1] - line[0][1]);
                            const shortSide = Math.min(d1, d2);
                            
                            // 核心改动：如果是填落触发，半径直接拉满到最大 (shortSide / 2)，渲染成完美的胶囊半圆形
                            const radius = forceMaxRadius ? (shortSide / 2) : Math.min(rRadius, shortSide / 2);

                            const pts = line.map(p => ({ x: p[0] + offset.x, y: p[1] + offset.y }));
                            procCtx.beginPath();
                            procCtx.moveTo((pts[3].x + pts[0].x) / 2, (pts[3].y + pts[0].y) / 2);
                            for (let k = 0; k < 4; k++) {
                                const pCurrent = pts[k];
                                const pNext = pts[(k + 1) % 4];
                                procCtx.arcTo(pCurrent.x, pCurrent.y, (pCurrent.x + pNext.x) / 2, (pCurrent.y + pNext.y) / 2, radius);
                            }
                            procCtx.closePath(); 
                            procCtx.fill();
                        } else {
                            // 直角矩形经典分支
                            procCtx.beginPath();
                            procCtx.moveTo(line[0][0] + offset.x, line[0][1] + offset.y);
                            for (let k = 1; k < line.length; k++) procCtx.lineTo(line[k][0] + offset.x, line[k][1] + offset.y);
                            procCtx.closePath(); 
                            procCtx.fill();
                        }
                    });

                    if (enableCircleErase) {
                        procCtx.globalCompositeOperation = 'destination-out';
                        const first = regionLines[0], last = regionLines[regionLines.length - 1];
                        const isV = item.regions.find(r => r.lines === regionLines)?.direction === 'v';
                        const erase = (p, radius) => {
                            procCtx.beginPath(); procCtx.arc(p[0] + offset.x, p[1] + offset.y, radius, 0, Math.PI * 2); procCtx.fill();
                        };
                        if (isV) {
                            const r1 = Math.hypot(first[1][0] - first[0][0], first[1][1] - first[0][1]) / 2;
                            if (!skipFirst) { erase(first[1], r1); erase(first[2], r1); }
                            const r2 = Math.hypot(last[1][0] - last[0][0], last[1][1] - last[0][1]) / 2;
                            erase(last[0], r2); erase(last[3], r2);
                        } else {
                            const r1 = Math.hypot(first[3][0] - first[0][0], first[3][1] - first[0][1]) / 2;
                            if (!skipFirst) { erase(first[0], r1); erase(first[1], r1); }
                            const r2 = Math.hypot(last[3][0] - last[0][0], last[3][1] - last[0][1]) / 2;
                            erase(last[3], r2); erase(last[2], r2);
                        }
                    }
                    procCtx.restore();
                };

                const hasOppositeColor = (ctx, poly, targetOpposite) => {
                    let minX = Math.floor(Math.min(...poly.map(p => p[0])));
                    let maxX = Math.ceil(Math.max(...poly.map(p => p[0])));
                    let minY = Math.floor(Math.min(...poly.map(p => p[1])));
                    let maxY = Math.ceil(Math.max(...poly.map(p => p[1])));
                    if (maxX <= minX || maxY <= minY) return false;
                    try {
                        const data = ctx.getImageData(Math.round(minX), Math.round(minY), Math.round(maxX - minX), Math.round(maxY - minY)).data;
                        for (let i = 0; i < data.length; i += 16) {
                            const r = data[i], g = data[i+1], b = data[i+2];
                            if (targetOpposite === 'black' && r < 60 && g < 60 && b < 60) return true;
                            if (targetOpposite === 'white' && r > 200 && g > 200 && b > 200) return true;
                        }
                    } catch(e){}
                    return false;
                };

                item.regions.forEach(r => {
                    if (!r.lines || r.lines.length === 0) return;

                    // [核心优化] 联合投票大坝：累加当前总框下所有行框小矩形的边缘检测像素点
                    const totalStats = { black: 0, white: 0, other: 0 };
                    r.lines.forEach(line => {
                        const lineStats = analyzeLineEdges(pageImageData, line); // 传入全图内存对象和单独行框
                        totalStats.black += lineStats.black;
                        totalStats.white += lineStats.white;
                        totalStats.other += lineStats.other;
                    });

                    const totalPixels = totalStats.black + totalStats.white + totalStats.other;
                    let fillColor = null;

                    // 汇总全框边缘总和进行黑白占比判定
                    if (totalPixels > 0) {
                        if ((totalStats.black / totalPixels) > THRESHOLD) fillColor = "#000000";
                        else if ((totalStats.white / totalPixels) > THRESHOLD) fillColor = "#ffffff";
                    }
                    if (fillColor) {
                        // 新增：只要这个框符合填色条件，把它的所有行框坐标全部记录下来用于削蒙
                        r.lines.forEach(line => qualifiedLines.push(line));
                        
                        const isV = r.direction === 'v';
                        const firstLine = r.lines[0];
                        const lineWidth = isV ? Math.hypot(firstLine[1][0] - firstLine[0][0], firstLine[1][1] - firstLine[0][1]) : Math.hypot(firstLine[3][0] - firstLine[0][0], firstLine[3][1] - firstLine[0][1]);
                        
                        const extDist = lineWidth / 4;
                        const extPoly = isV ? 
                            [firstLine[1], [firstLine[1][0]+extDist, firstLine[1][1]], [firstLine[2][0]+extDist, firstLine[2][1]], firstLine[2]] : 
                            [[firstLine[0][0], firstLine[0][1]-extDist], [firstLine[1][0], firstLine[1][1]-extDist], firstLine[1], firstLine[0]];
                        
                        const opposite = fillColor === "#ffffff" ? "black" : "white";
                        const skipFirstOffset = enableFirstLineExpand ? !hasOppositeColor(analysisCtx, extPoly, opposite) : true;

                        // 判断是否走高端的智能油漆桶路径
                        if (enableFloodFill) {
                            // 【1. 升级：建立当前区域的文本框局部遮罩 + 边框线描边吞噬】
                            const rCanvas = document.createElement('canvas');
                            rCanvas.width = img.width; rCanvas.height = img.height;
                            const rCtx = rCanvas.getContext('2d');
                            rCtx.fillStyle = 'white';
                            rCtx.strokeStyle = 'white'; // 新增：设置框线描边颜色为白色

                            // 设定框线向外侵蚀吞噬的宽度（单位：像素）
                            // 推荐设为 6 到 8。数值越大，行框边框线外面被强行划入“必填文字区”的范围就越宽。
                            rCtx.lineWidth = 6;         
                            rCtx.lineJoin = 'round';    // 拐角修圆，防止尖角溢出污染无关区域

                            r.lines.forEach(line => {
                                rCtx.beginPath();
                                rCtx.moveTo(line[0][0], line[0][1]);
                                for (let k = 1; k < line.length; k++) rCtx.lineTo(line[k][0], line[k][1]);
                                rCtx.closePath();
                                
                                // 核心改进：先填满框内，再用 6 像素粗细的画笔把行框的“边框线”也狠狠犁一遍
                                rCtx.fill();
                                rCtx.stroke(); 
                            });
                            const rBoxData = rCtx.getImageData(0, 0, img.width, img.height).data;

                            // 【2. 收集扩散种子点】
                            let seeds = [];
                            r.lines.forEach(line => {
                                let cx = Math.round((line[0][0] + line[1][0] + line[2][0] + line[3][0]) / 4);
                                let cy = Math.round((line[0][1] + line[1][1] + line[2][1] + line[3][1]) / 4);
                                if (cx >= 0 && cx < img.width && cy >= 0 && cy < img.height) {
                                    seeds.push({x: cx, y: cy});
                                }
                            });

                            // 【3. 动态防漏色安全护栏】
                            let bMinX = Math.max(0, Math.floor(Math.min(...r.lines.flatMap(l => l.map(p => p[0])))) - lineWidth * 2);
                            let bMaxX = Math.min(img.width - 1, Math.ceil(Math.max(...r.lines.flatMap(l => l.map(p => p[0])))) + lineWidth * 2);
                            let bMinY = Math.max(0, Math.floor(Math.min(...r.lines.flatMap(l => l.map(p => p[1])))) - lineWidth * 2);
                            let bMaxY = Math.min(img.height - 1, Math.ceil(Math.max(...r.lines.flatMap(l => l.map(p => p[1])))) + lineWidth * 2);

                            const floodVisited = new Uint8Array(img.width * img.height);
                            const floodStack = [];
                            seeds.forEach(s => {
                                const idx = s.y * img.width + s.x;
                                floodVisited[idx] = 1;
                                floodStack.push(idx);
                            });

                            const animData = analysisCtx.getImageData(0, 0, img.width, img.height).data;
                            const isWhiteFill = (fillColor === "#ffffff");
                            
                            // 【4. 核心升级：基于明度（Luminance）动态计算阻挡阈值】
                            const currentTolerance = floodTolerance;
                            // 涂白模式下，明度低于此值的 pixel 将被认定为有色线框（黑、灰、棕、过渡色）
                            const lineLuminanceThreshold = 255 - currentTolerance; 

                            // BFS/DFS 位图蔓延核心扩散
                            while (floodStack.length > 0) {
                                const curr = floodStack.pop();
                                const cx = curr % img.width;
                                const cy = Math.floor(curr / img.width);

                                const neighbors = [
                                    {x: cx + 1, y: cy}, {x: cx - 1, y: cy},
                                    {x: cx, y: cy + 1}, {x: cx, y: cy - 1}
                                ];

                                for (const n of neighbors) {
                                    if (n.x >= bMinX && n.x <= bMaxX && n.y >= bMinY && n.y <= bMaxY) {
                                        const nIdx = n.y * img.width + n.x;
                                        if (floodVisited[nIdx] === 0) {
                                            const pIdx = nIdx * 4;
                                            
                                            let canPass = false;
                                            // 如果是当前行框内部的像素，强制允许水流通过（清除内部文字）
                                            if (rBoxData[pIdx] > 0) {
                                                canPass = true;
                                            } else {
                                                // 框外走明度过滤：计算当前像素的工业级明度值
                                                const rVal = animData[pIdx];
                                                const gVal = animData[pIdx+1];
                                                const bVal = animData[pIdx+2];
                                                const luminance = 0.299 * rVal + 0.587 * gVal + 0.114 * bVal;

                                                if (isWhiteFill) {
                                                    // 涂白去字：只要邻居明度高于阈值（说明是白色或浅色气泡内部），水流就可以流过去
                                                    if (luminance > lineLuminanceThreshold) {
                                                        canPass = true;
                                                    }
                                                } else {
                                                    // 涂黑去字：只要邻居明度低于容差阈值（说明是深色暗夜气泡内部），水流就可以流过去
                                                    if (luminance < currentTolerance) {
                                                        canPass = true;
                                                    }
                                                }
                                            }

                                            if (canPass) {
                                                floodVisited[nIdx] = 1;
                                                floodStack.push(nIdx);
                                            }
                                        }
                                    }
                                }
                            }

                            // 【5. 数学形态学“圆形液体颗粒半径膨胀”】
                            let finalVisited = floodVisited; 
                            const currentRadius = floodRadius;

                            if (currentRadius > 0) {
                                finalVisited = new Uint8Array(img.width * img.height);
                                for (let y = bMinY; y <= bMaxY; y++) {
                                    for (let x = bMinX; x <= bMaxX; x++) {
                                        const idx = y * img.width + x;
                                        if (floodVisited[idx] === 1) {
                                            for (let dy = -currentRadius; dy <= currentRadius; dy++) {
                                                for (let dx = -currentRadius; dx <= currentRadius; dx++) {
                                                    if (dx * dx + dy * dy <= currentRadius * currentRadius) {
                                                        const nx = x + dx;
                                                        const ny = y + dy;
                                                        if (nx >= bMinX && nx <= bMaxX && ny >= bMinY && ny <= bMaxY) {
                                                            finalVisited[ny * img.width + nx] = 1;
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }

                            // 【6. 位图高速回写 + 任意色框绝对保护盾】
                            const procImgData = procCtx.getImageData(0, 0, img.width, img.height);
                            const pData = procImgData.data;
                            const fillR = isWhiteFill ? 255 : 0;
                            const fillG = isWhiteFill ? 255 : 0;
                            const fillB = isWhiteFill ? 255 : 0;

                            for (let y = bMinY; y <= bMaxY; y++) {
                                for (let x = bMinX; x <= bMaxX; x++) {
                                    const vIdx = y * img.width + x;
                                    if (finalVisited[vIdx] === 1) {
                                        const pIdx = vIdx * 4;

                                        // 框外触发有色相框拦截保护
                                        if (rBoxData[pIdx] === 0) {
                                            const origR = animData[pIdx];
                                            const origG = animData[pIdx+1];
                                            const origB = animData[pIdx+2];
                                            const origLuminance = 0.299 * origR + 0.587 * origG + 0.114 * origB;

                                            // 涂白模式：只要该像素的明度低于线框阈值（不管是黑、灰、棕还是渐变浅框），金身拦截！
                                            if (isWhiteFill && (origLuminance <= lineLuminanceThreshold)) {
                                                continue;
                                            }
                                            // 涂黑模式：只要该像素的明度高于反向阈值（说明碰到了白色或浅色线框），金身拦截！
                                            if (!isWhiteFill && (origLuminance >= currentTolerance)) {
                                                continue;
                                            }
                                        }

                                        pData[pIdx] = fillR;
                                        pData[pIdx+1] = fillG;
                                        pData[pIdx+2] = fillB;
                                        pData[pIdx+3] = 255; 
                                    }
                                }
                            }
                            procCtx.putImageData(procImgData, 0, 0);
                            // 【7. 终极修正：“形排”真正文字内容像素级（竖排上下、横排左右）溢出检测与换行清除】
                            const isShapeWrapEnabled = (typeof enableShapeWrap !== 'undefined') ? enableShapeWrap : false;
                            
                            if (isShapeWrapEnabled && r.translation && r.translation.trim() !== '') {
                                let isTextOverflow = false;
                                
                                // A. 获取当前总框的几何中心点，作为文字排版的中心中心锚点
                                const allX = r.lines.flatMap(l => l.map(p => p[0]));
                                const allY = r.lines.flatMap(l => l.map(p => p[1]));
                                const rCenterX = (Math.min(...allX) + Math.max(...allX)) / 2;
                                const rCenterY = (Math.min(...allY) + Math.max(...allY)) / 2;

                                const fSize = parseInt(r.font_size) || 20;
                                const lHeight = fSize * 1.3; // 行高
                                const isV = r.direction === 'v';

                                // B. 按当前的换行符切分出实际渲染的每一行（一列）
                                const textLines = r.translation.split(/【BR】|\n/);
                                
                                procCtx.save();
                                // 注入当前框的真实字号与字体，进行无误差拟合测量
                                procCtx.font = `${activeFontWeight || '400'} ${fSize}px ${r.fontFamily || activeFontFamily}`;

                                if (!isV) {
                                    // ================= 横排文字：核心探测【左端、右端】是否戳出气泡 =================
                                    const totalHeight = textLines.length * lHeight;
                                    textLines.forEach((lineStr, idx) => {
                                        if (isTextOverflow) return;
                                        
                                        // 核心去噪：必须过滤掉富文本标签（如 [b][/b]），只测量真实可见文本的物理宽度
                                        // 升级版：既能兼容老代码的 [font Mini]，也能完美抹除新加的 [s=...], [g=...], [os=...] 等所有带参数的特效标签
                                        const cleanLineStr = lineStr.replace(/\[\/?[a-z0-9]+(?:=[^\]]*)?\]/gi, "");
                                        const w = procCtx.measureText(cleanLineStr).width;
                                        
                                        // 根据漫画通常居中排版的特性，推算出文字左端和右端的真实 X 坐标
                                        const leftX = Math.round(rCenterX - w / 2);
                                        const rightX = Math.round(rCenterX + w / 2);
                                        const lineY = Math.round(rCenterY - (totalHeight / 2) + (idx * lHeight) + fSize / 2);

                                        // 判定：字的左边界或右边界，只要有一个踩在了油漆桶没走过的死区(=== 0)，即代表横排超出
                                        if (leftX < 0 || rightX >= img.width || lineY < 0 || lineY >= img.height) {
                                            isTextOverflow = true;
                                        } else {
                                            if (floodVisited[lineY * img.width + leftX] === 0 || floodVisited[lineY * img.width + rightX] === 0) {
                                                isTextOverflow = true;
                                            }
                                        }
                                    });
                                } else {
                                    // ================= 竖排文字：核心精准探测【顶端(上)、底端(下)】是否戳出气泡 =================
                                    const totalWidth = textLines.length * lHeight;
                                    textLines.forEach((lineStr, idx) => {
                                        if (isTextOverflow) return;
                                        
                                        // 核心去噪：必须清除所有样式标签，防止标签字母导致竖排字数爆表、从而引发误判
                                        const cleanLineStr = lineStr.replace(/\[\/?[a-z0-9]+(?:=[^\]]*)?\]/gi, "");
                                        
                                        // 竖排字的物理总高度 = 实际可见中日韩字数 × 当前字号
                                        const h = cleanLineStr.length * fSize;
                                        
                                        // 【关键坐标转换】：以气泡中心为轴，精准推算出当前列文字真实的【最顶端 topY】和【最底端 bottomY】
                                        const topY = Math.round(rCenterY - h / 2);
                                        const bottomY = Math.round(rCenterY + h / 2);
                                        
                                        // 估算当前列文字所在的 X 坐标轴（日漫习惯从右往左排）
                                        const lineX = Math.round(rCenterX + (totalWidth / 2) - (idx * lHeight) - fSize / 2);

                                        // 核心拦截门：如果字的顶边界(上出界)或底边界(下出界)直接溢出了画布，或者踩在了
                                        // 桶填油漆桶（液体）无法蔓延到的死区（说明字已经爬出了气泡相框），则立刻拉响警报！
                                        if (topY < 0 || bottomY >= img.height || lineX < 0 || lineX >= img.width) {
                                            isTextOverflow = true;
                                        } else {
                                            if (floodVisited[topY * img.width + lineX] === 0 || floodVisited[bottomY * img.width + lineX] === 0) {
                                                isTextOverflow = true; // 向上或向下触及气泡边界死区，判定溢出
                                            }
                                        }
                                    });
                                }
                                procCtx.restore();

                                // C. 一旦判定【真实文字墨迹】向任何边界超出了气泡，一键洗掉所有换行符拉平文本
                                if (isTextOverflow) {
                                    r.translation = r.translation.replace(/【BR】/g, '').replace(/\n/g, '').trim();
                                }
                            }
                        }
                        // 【传统几何覆盖分支】（未开启桶填时，依然走原汁原味的矩形逻辑）
                        const offsetDist = lineWidth * 0.45;
                        const offset = isV ? {x: offsetDist, y: 0} : {x: 0, y: -offsetDist};

                        drawAndClip(r.lines, fillColor, offset, skipFirstOffset);
                        drawAndClip(r.lines, fillColor);

                        // “填落”全列多维雷达探测
                        let secondaryDetected = false;
                        const extDistSecondary = lineWidth / 4;
                        const isSecondaryEnabled = (typeof enableSecondaryExpand !== 'undefined') ? enableSecondaryExpand : false;

                        if (isSecondaryEnabled) {
                            for (let lineItem of r.lines) {
                                const extPolySecondary = isV ? 
                                    [lineItem[3], lineItem[2], [lineItem[2][0], lineItem[2][1] + extDistSecondary], [lineItem[3][0], lineItem[3][1] + extDistSecondary]] : 
                                    [lineItem[1], [lineItem[1][0] + extDistSecondary, lineItem[1][1]], [lineItem[2][0] + extDistSecondary, lineItem[2][1]], lineItem[2]];
                                
                                if (hasOppositeColor(analysisCtx, extPolySecondary, opposite)) {
                                    secondaryDetected = true;
                                    break; 
                                }
                            }
                        }

                        if (secondaryDetected) {
                            const offsetDistSecondary = lineWidth * 0.3;
                            const offsetSecondary = isV ? {x: 0, y: offsetDistSecondary} : {x: offsetDistSecondary, y: 0};
                            drawAndClip(r.lines, fillColor, offsetSecondary, false, true);
                        }
                        

                        pageChanged = true;
                    }
                });
                // 新增：“削蒙”核心裁剪逻辑（在单页的所有文本框扫描完毕后执行）
                // “削蒙”高精度连通域智能裁剪逻辑
                if (enableEraseMask && item.mask_raw && qualifiedLines.length > 0) {
                    const maskImg = await loadMaskFromBase64(item.mask_raw);
                    if (maskImg) {
                        const width = img.width;
                        const height = img.height;

                        const tMaskCanvas = document.createElement('canvas');
                        tMaskCanvas.width = width; tMaskCanvas.height = height;
                        const tMaskCtx = tMaskCanvas.getContext('2d');
                        tMaskCtx.drawImage(maskImg, 0, 0);

                        // 1. 抓取原始蒙版的像素信息数据
                        const maskImgData = tMaskCtx.getImageData(0, 0, width, height);
                        const maskData = maskImgData.data;

                        // 2. 隐形地图 A：渲染当前被填充的行框（红色通道占领）
                        const qualCanvas = document.createElement('canvas');
                        qualCanvas.width = width; qualCanvas.height = height;
                        const qualCtx = qualCanvas.getContext('2d');
                        qualCtx.fillStyle = 'rgb(255, 0, 0)';
                        qualifiedLines.forEach(line => {
                            qualCtx.beginPath();
                            qualCtx.moveTo(line[0][0], line[0][1]);
                            for (let k = 1; k < line.length; k++) qualCtx.lineTo(line[k][0], line[k][1]);
                            qualCtx.closePath();
                            qualCtx.fill();
                        });
                        const qualData = qualCtx.getImageData(0, 0, width, height).data;

                        // 3. 隐形地图 B：渲染全页所有的行框，哪怕没被填充的也算（蓝色通道占领）
                        const allCanvas = document.createElement('canvas');
                        allCanvas.width = width; allCanvas.height = height;
                        const allCtx = allCanvas.getContext('2d');
                        allCtx.fillStyle = 'rgb(0, 0, 255)';
                        if (item.regions) {
                            item.regions.forEach(r => {
                                if (r.lines) {
                                    r.lines.forEach(line => {
                                        allCtx.beginPath();
                                        allCtx.moveTo(line[0][0], line[0][1]);
                                        for (let k = 1; k < line.length; k++) allCtx.lineTo(line[k][0], line[k][1]);
                                        allCtx.closePath();
                                        allCtx.fill();
                                    });
                                }
                            });
                        }
                        const allData = allCtx.getImageData(0, 0, width, height).data;

                        // 4. 深度优先搜索 (DFS) 连通域扩散追踪算法
                        const stack = [];
                        const visited = new Uint8Array(width * height);

                        // 寻找扩散起点：只要一个像素“有蒙版颜色”且“落在了当前填充行框内部”，就是污染源种子
                        for (let y = 0; y < height; y++) {
                            for (let x = 0; x < width; x++) {
                                const idx = (y * width + x) * 4;
                                if (maskData[idx + 3] > 0 && qualData[idx] > 0) {
                                    const vIdx = y * width + x;
                                    visited[vIdx] = 1;
                                    stack.push(vIdx);
                                }
                            }
                        }

                        // 顺藤摸瓜：把所有相连的蒙版毛边像素全部揪出来标记
                        while (stack.length > 0) {
                            const curr = stack.pop();
                            const cx = curr % width;
                            const cy = Math.floor(curr / width);

                            const neighbors = [
                                {x: cx + 1, y: cy}, {x: cx - 1, y: cy},
                                {x: cx, y: cy + 1}, {x: cx, y: cy - 1}
                            ];

                            for (const n of neighbors) {
                                if (n.x >= 0 && n.x < width && n.y >= 0 && n.y < height) {
                                    const nIdx = n.y * width + n.x;
                                    if (visited[nIdx] === 0) {
                                        const pIdx = nIdx * 4;
                                        if (maskData[pIdx + 3] > 0) { // 邻居也是蒙版像素，视为一体
                                            visited[nIdx] = 1;
                                            stack.push(nIdx);
                                        }
                                    }
                                }
                            }
                        }

                        // 5. 精准割除：只有“被标记为相连”且“在隐形地图B里找不到任何行框（蓝色通道为0）”的像素，才会被无情擦除
                        for (let y = 0; y < height; y++) {
                            for (let x = 0; x < width; x++) {
                                const vIdx = y * width + x;
                                if (visited[vIdx] === 1) {
                                    const idx = vIdx * 4;
                                    if (allData[idx + 2] === 0) { 
                                        maskData[idx + 3] = 0; // 将溢出的非行框像素蒸发变透明
                                    }
                                }
                            }
                        }

                        // 重新写回画布中保存
                        tMaskCtx.putImageData(maskImgData, 0, 0);
                        item.mask_raw = tMaskCanvas.toDataURL('image/png').split(',')[1];
                        
                        if (index === currentFileIndex) {
                            maskCanvas.width = tMaskCanvas.width; maskCanvas.height = tMaskCanvas.height;
                            maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
                            maskCtx.drawImage(tMaskCanvas, 0, 0);
                            isCanvasDirty = true;
                        }
                    }
                }
                if (pageChanged) {
                    item.paint_raw = procCanvas.toDataURL();
                    if (index === currentFileIndex) isCanvasDirty = true;
                }
            }

            // 3. 异步并发池控制阀（利用滑动窗口限制同时进行的页数）
            let completedCount = 0;
            const pool = [];

            for (let i = 0; i < matchedFiles.length; i++) {
                // 给低端设备每 5 页让出 50 毫秒的喘息主线程，防止高算力导致卡死
                if (i > 0 && i % 5 === 0) await new Promise(r => setTimeout(r, 50));

                // 丢入并发池后台运行
                const task = processPageTask(matchedFiles[i], i).then(() => {
                    completedCount++;
                    autoFillBtnRight.innerText = `处理中 ${completedCount}/${matchedFiles.length}`;
                });
                pool.push(task);

                // 如果当前排队处理的页面数达到了界面的“并发渲染数”上限，则挂起等待最老的一个跑完
                if (pool.length >= CONCURRENCY_LIMIT) {
                    await pool.shift(); 
                }
            }

            // 等待所有残余尾款页面彻底全部收尾
            await Promise.all(pool);

            autoFillBtnRight.innerText = "完成";
            setTimeout(() => { autoFillBtnRight.innerText = originalText; autoFillBtnRight.disabled = false; }, 1500);
            
            // 刷新显示当前视图
            loadFile(currentFileIndex);
        };

        /**
        * 分析多边形边缘的像素分布
        */
        /**
         * [终极高精版] 全像素级全闭合边缘黑白扫描引擎
         * 接收整页 ImageData，实现零显存交互的纯物理内存高速检索
         */
        /**
         * [外扩高精版] 全像素级边缘外扩黑白扫描引擎
         * @param {ImageData} imageData - 整页的像素矩阵
         * @param {Array} points - 文本行框的顶点坐标数组 [[x1,y1], [x2,y2], ...]
         */
        function analyzeLineEdges(imageData, points) {
            const stats = { black: 0, white: 0, other: 0 };
            if (!points || points.length < 2 || !imageData) return stats;

            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;

            // --- 【参数配置】 决定向外扩张的物理像素距离（支持小数，如 2.5 像素） ---
            const OUTWARD_OFFSET = 3; 

            // 1. 核心前置计算：求出多边形的几何质心（用来绝对判定“向外”的方向）
            let cx = 0, cy = 0;
            for (let i = 0; i < points.length; i++) {
                cx += points[i][0];
                cy += points[i][1];
            }
            cx /= points.length;
            cy /= points.length;

            // 2. 遍历多边形外壳的每一条物理边
            for (let i = 0; i < points.length; i++) {
                const p1 = points[i];
                const p2 = points[(i + 1) % points.length];
                
                const dx = p2[0] - p1[0];
                const dy = p2[1] - p1[1];
                const len = Math.hypot(dx, dy);
                
                if (len === 0) continue;

                // 3. 计算该边的基础单位法向量（垂直于该边）
                let nx = -dy / len;
                let ny = dx / len;

                // 4. 方向校准：计算从“质心”指向“边中点”的向量
                const midX = (p1[0] + p2[0]) / 2;
                const midY = (p1[1] + p2[1]) / 2;
                const toMidX = midX - cx;
                const toMidY = midY - cy;

                // 如果法向量与质心外指向量的点积为负，说明法线指内了，直接取反，保证 100% 朝外
                if (nx * toMidX + ny * toMidY < 0) {
                    nx = -nx;
                    ny = -ny;
                }

                // 5. 全像素步进扫描（带状安全区版）
                const steps = Math.ceil(len); 
                for (let j = 0; j < steps; j++) {
                    const ratio = steps > 0 ? (j / steps) : 0;
                    const baseX = p1[0] + dx * ratio;
                    const baseY = p1[1] + dy * ratio;

                    // 额外扫描 1px、2px、3px 三层厚度，编织成密集的探测网
                    for (let offset = 1; offset <= 3; offset++) {
                        const x = Math.round(baseX + nx * offset);
                        const y = Math.round(baseY + ny * offset);

                        if (x >= 0 && x < width && y >= 0 && y < height) {
                            const idx = (y * width + x) * 4;
                            const r = data[idx]; const g = data[idx + 1]; const b = data[idx + 2];

                            if (r < 5 && g < 5 && b < 5) stats.black++;
                            else if (r > 250 && g > 250 && b > 250) stats.white++;
                            else stats.other++;
                        }
                    }
                }
            }
            return stats;
        }

        /**
        * 在画布上填充多边形
        */
        function fillPolygon(ctx, points, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i][0], points[i][1]);
            }
            ctx.closePath();
            ctx.fill();
        }



        // [新增] 追踪最后点击的输入框
        transEditArea.addEventListener('focus', () => { lastActiveInputId = 'transEditArea'; });
        origEditArea.addEventListener('focus', () => { lastActiveInputId = 'origEditArea'; });
        /**
         * 属性修改核心：优先处理多选列表，否则处理单选，最后处理全局
         */
        function batchUpdateProp(propName, value) {
            if (selectedRegions.length > 0) {
                // A. 批量修改模式
                selectedRegions.forEach(idx => {
                    if (regions[idx]) regions[idx][propName] = value;

        // 辅助：更新全局默认变量 (根据你的代码变量名)
        function updateGlobalDefault(prop, val) {
            if (prop === 'font_size') {} // 字号通常不设全局默认
            else if (prop === 'fontFamily') activeFontFamily = val;
            else if (prop === 'fontWeight') activeFontWeight = val;
            else if (prop === 'line_spacing') activeLineSpacing = val;
            else if (prop === 'letter_spacing') activeLetterSpacing = val;
            else if (prop === 'parsedColor') activeTextColor = val;

            // --- 补全以下缺失的全局映射 ---
            else if (prop === 'strokeWidthRatio') activeStrokeWidth = val; // 对应描边粗细
            else if (prop === 'strokeColor') activeStrokeColor = val;     // 对应描边颜色
            else if (prop === 'strokeEnable') activeStrokeEnabled = val;   // 对应描边开关

            else if (prop === 'outerStrokeWidthRatio') activeOuterStrokeWidth = val;
            else if (prop === 'outerStrokeColor') activeOuterStrokeColor = val;
            else if (prop === 'outerStrokeEnable') activeOuterStrokeEnabled = val;
            // --- 新增：如果是间距或颜色等全局属性，且当前未选中任何框时，同步更新所有现有框 ---
            if (activeRegionIndex === -1 && selectedRegions.length === 0) {

                    r[prop] = val; 
                });

        }

        // 将 Base64 蒙版载入离屏画布
        async function loadMaskToCanvas(base64) {
            if (!base64) {
                maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
                return;
            }
            const img = await loadMaskFromBase64(base64); 
            maskCanvas.width = img.width;
            maskCanvas.height = img.height;
            maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
            maskCtx.drawImage(img, 0, 0);
        }

        // 同步当前编辑的蒙版到内存数据中
        function syncMaskData() {
            // 检查画布是否有内容
            if (maskCanvas.width === 0 || maskCanvas.height === 0) return;
            
            // 将最新的 Canvas 内容转为 Base64 字符串

                // 更新内存中的蒙版数据
                matchedFiles[currentFileIndex].mask_raw = base64;
            }
        }
        // 新增：全量同步当前页所有数据（文本 + 涂鸦 + 蒙版）到内存
        function saveCurrentStateToMemory() {
            if (currentFileIndex === -1 || !matchedFiles[currentFileIndex]) return;

            const item = matchedFiles[currentFileIndex];
            
            // 1. 同步文本框数据
            item.regions = JSON.parse(JSON.stringify(regions));

        // --- [新增] Base64 转图像工具 ---
        function loadMaskFromBase64(base64Str) {
            return new Promise((resolve) => {
                if (!base64Str) return resolve(null);
                const img = new Image();
                img.onload = () => {
                    // 【关键】加载后立即转换，这样 draw() 函数拿到的就是透明蒙版了
                    const alphaMask = processMaskToAlpha(img);
                    alphaMask.onload = () => resolve(alphaMask);
                };
                img.onerror = () => resolve(null);
                img.src = base64Str.startsWith('data:image') ? base64Str : `data:image/png;base64,${base64Str}`;
            });
        }
        // --- [新增] 蒙版黑转透预处理 ---
        function processMaskToAlpha(maskImg) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = maskImg.width;
            tempCanvas.height = maskImg.height;
            
            tempCtx.drawImage(maskImg, 0, 0);
            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                // 计算亮度 (R+G+B)
                const brightness = data[i] + data[i+1] + data[i+2];
                // 如果亮度很低（接近黑色），则将透明度(Alpha)设为 0
                if (brightness < 30) { 
                    data[i + 3] = 0; 
                } else {
                    // 如果是白色或高亮区域，确保它是完全不透明的
                    data[i + 3] = 255;
                }
            }
            
            tempCtx.putImageData(imageData, 0, 0);
            const finalImg = new Image();
            finalImg.src = tempCanvas.toDataURL();
            return finalImg;
        }

        function handlePaint(pos, op) {
            if (op === 'none' || paintCanvas.width === 0) return;
            isCanvasDirty = true; // [核心新增]
            
            paintCtx.save();
            // 根据操作切换：brush 用颜色，eraser 用透明模式
            if (op === 'brush') {
                paintCtx.globalCompositeOperation = 'source-over';
                paintCtx.fillStyle = activePaintColor; 
            } else {
                paintCtx.globalCompositeOperation = 'destination-out';
            }
            
            paintCtx.beginPath();
            const radius = maskBrushSize / viewState.scale;
            paintCtx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            paintCtx.fill();
            paintCtx.restore();
            
            draw(); 
        }

        // 自动判定横竖排的核心逻辑
        // 根据蓝 line 的物理长宽比自动判定方向
        function detectDirectionByRatio(region) {
            if (!region.lines || region.lines.length === 0) return 'v';
            
            let totalW = 0, totalH = 0;
            region.lines.forEach(line => {
                // 计算顶边宽和左边高
                const w = Math.hypot(line[1][0] - line[0][0], line[1][1] - line[0][1]);
                const h = Math.hypot(line[3][0] - line[0][0], line[3][1] - line[0][1]);
                totalW += w;
                totalH += h;
            });
            // 宽 > 高则为横，否则为竖
            return (totalW > totalH) ? 'h' : 'v';
        }

            topToolbar.addEventListener('wheel', (e) => {
                // 检查是否有横向滚动需求 (如果内容没溢出则不处理)
                if (topToolbar.scrollWidth <= topToolbar.clientWidth) return;

                // 拦截纵向滚动量
                // 如果 deltaY 为正（向下滚），我们让 scrollLeft 增加（向右滚）
                e.preventDefault(); 
                topToolbar.scrollLeft += e.deltaY;
            }, { passive: false });
        }

                    }

/**

        */
        async function executeFind() {
            const findStr = document.getElementById('findInput').value;
            const matchCase = document.getElementById('matchCase').checked;
            
            if (!findStr) return alert("请输入查找内容");

            searchResults = []; // 重置结果
            const flags = matchCase ? 'g' : 'gi';
            const regex = new RegExp(findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);

            // 1. 扫描所有文件数据
            matchedFiles.forEach((file, fIdx) => {
                file.regions.forEach((r, rIdx) => {
                    if (r.translation && regex.test(r.translation)) {
                        searchResults.push({ fileIndex: fIdx, regionIndex: rIdx });
                    }
                });
            });

            if (searchResults.length === 0) {
                document.getElementById('searchNavUI').classList.add('hidden');
                alert("未找到匹配内容");
                return;
            }

            // 2. 显示导航 UI
            document.getElementById('searchNavUI').classList.remove('hidden');

            // =========================================================================
            // 🌟【核心升级】：智能锚定到当前查看或编辑的实际位置
            // =========================================================================
            let targetSearchIdx = searchResults.findIndex(match => {
                // 情况 A：匹配项在后续页面，直接通过
                if (match.fileIndex > currentFileIndex) return true;
                
                // 情况 B：匹配项正好在当前页
                if (match.fileIndex === currentFileIndex) {
                    // 如果当前有选中具体的红框，就从这个红框或它后面的框开始聚焦；否则从当前页第 1 个框算起
                    const baseRegionIdx = (activeRegionIndex !== -1) ? activeRegionIndex : 0;
                    return match.regionIndex >= baseRegionIdx;
                }
                
                return false;
            });

            // ⚡【安全回滚】：如果当前页之后（含当前页）没有任何匹配项了，说明到尽头了，自动循环回全书第 1 处匹配
            if (targetSearchIdx === -1) {
                targetSearchIdx = 0;
            }

            currentSearchIndex = targetSearchIdx;
            updateSearchStatus();
            
            // 3. 立即顺畅跳转到该匹配项（原有跳转引擎会自动处理跨页逻辑和涂鸦暂存）
            goToSearchResult(currentSearchIndex);
        }

        /**
        * 更新搜索状态文字
        */
        function updateSearchStatus() {
            const status = document.getElementById('searchStatus');
            status.innerText = `${currentSearchIndex + 1} / ${searchResults.length}`;
        }

        /**
        * 导航：上一个 / 下一个
        */
        function navigateSearch(dir) {
            if (searchResults.length === 0) return;
            
            currentSearchIndex += dir;
            
            // 循环导航
            if (currentSearchIndex < 0) currentSearchIndex = searchResults.length - 1;
            if (currentSearchIndex >= searchResults.length) currentSearchIndex = 0;
            
            updateSearchStatus();
            goToSearchResult(currentSearchIndex);
        }

        /**
        * 核心：跳转到指定的搜索结果（支持跨页）
        */
        async function goToSearchResult(index) {
            const match = searchResults[index];
            if (!match) return;

            // A. 如果匹配项不在当前页，执行跳转
            if (match.fileIndex !== currentFileIndex) {
                // 先保存当前页的修改
                if (matchedFiles[currentFileIndex]) {
                    matchedFiles[currentFileIndex].regions = JSON.parse(JSON.stringify(regions));
                    // 如果是低内存用户，这里可以加入 canvasDirty 判定来同步 paint_raw
                }
                
                currentFileIndex = match.fileIndex;
                await loadFile(currentFileIndex); // 等待页面加载完成
            }

            // B. 选中对应的文本框
            setActiveRegion(match.regionIndex); //
            
            // C. 视觉反馈：在编辑框中高亮背景
            const area = document.getElementById('transEditArea');
